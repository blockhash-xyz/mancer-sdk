        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookOrderPreviewResponse" }
        "400":
          description: "`bad-body`. See [Books errors](/api/guides/books/errors)."
          content:
            application/json:
