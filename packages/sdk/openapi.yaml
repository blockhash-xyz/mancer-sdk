      operationId: createBookDraft
      security:
        - { bearer: [] }
      description: "Saves a Book's record (factory, name, ticker and profile) for the wallet that will send the open, so the Book's first answer carries its profile. Add its logo with `PUT /v1/books/drafts/{id}/logo` and the open's hash with `PATCH /v1/books/drafts/{id}`."
