      properties:
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minOut: { $ref: "#/components/schemas/BooksUnits" }
        route: { $ref: "#/components/schemas/BooksHex" }
        deadline: { type: string }
        salt: { type: string }
        signature: { $ref: "#/components/schemas/BooksHex" }
    BookSigningAccess:
      type: string
      enum: [open, restricted]
      description: "The request's stock access: `open` for a request an API key authorizes."
    BookStakeState:
      type: object
