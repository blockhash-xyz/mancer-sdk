        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`not-the-creator`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409": { description: "`profile-field-held`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "413": { description: "`logo-too-large`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "`logo-type`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { description: "`logo-unavailable`, `book-indexing`, `books-index-unavailable`, `books-state-unavailable` or `books-deployment-unverified`. See [Books errors](/api/guides/books/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
