        openToAllAt: { type: [number, "null"] }
        estimate:
          description: What a settlement now would fix.
          anyOf: [{ $ref: "#/components/schemas/BookSettlementEstimate" }, { type: "null" }]
        final:
          description: What the settlement fixed.
          anyOf: [{ $ref: "#/components/schemas/BookSettlementFinal" }, { type: "null" }]
    BookSignBudget:
      type: object
      description: The vault's signed trades and grants of the last rolling hour and day, in basis points of its value, beside the caps.
      required: [hourUsedBps, dayUsedBps, hourCapBps, dayCapBps]
      properties:
        hourUsedBps: { type: number }
        dayUsedBps: { type: number }
        hourCapBps: { type: number }
        dayCapBps: { type: number }
    BookSignedQuote:
      type: object
      description: One signed sale, as `liquidate(bookId, quotes)` takes it.
