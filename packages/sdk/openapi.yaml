    KeyScope:
      type: string
      enum: [read, trade, records, books]
      description: "What a wallet key may ask beyond the public reads: the account's own reads, building trades and orders, the account's records on Mancer, or Books signing for its own wallet."
    ApiKey:
      type: object
      required: [name, id, active, rateClass, actsAsOwner, scopes, selfServe, owner, createdAt]
      properties:
        name: { type: string, description: "The key's name: the one given at the mint for a key the account minted." }
        id: { type: string, description: "The key's id: `self.` and 16 hex digits for a key the account minted, its name for one Mancer issued." }
        active: { type: boolean, description: "False while it is paused." }
        rateClass: { type: string, enum: [standard, high] }
        feeBpsCap: { type: [integer, "null"] }
        integratorFeeMaxBps: { type: [integer, "null"] }
        origins: { type: array, items: { type: string }, description: "Kept for a key Mancer issued; no key is taken from a browser." }
        actsAsOwner: { type: boolean, description: "Whether it acts as its owner wallet, as that wallet's session does." }
        scopes: { type: array, items: { $ref: "#/components/schemas/KeyScope" } }
        selfServe: { type: boolean, description: "True for a key the account minted, false for one Mancer issued." }
        owner: { $ref: "#/components/schemas/Address", description: "The wallet the key belongs to and acts as." }
        stocksAcknowledged:
          type: [object, "null"]
          description: "The holder's acknowledgement at the mint, with its time in seconds."
          properties:
            at: { type: integer }
            text: { type: string }
        createdAt: { type: string, format: date-time }
    ApiKeyList:
      type: object
      required: [account, keys, selfServe, scopes, stocksAcknowledgement]
      properties:
        account: { $ref: "#/components/schemas/Address" }
        keys: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
        selfServe:
          type: object
          description: "The keys the account minted, in force and paused, and the most it may hold of each."
          properties:
            held: { type: integer, description: "Keys in force." }
            paused: { type: integer, description: "Keys paused." }
            max: { type: integer, description: "The most in force: three." }
            keptMax: { type: integer, description: "The most kept, paused ones among them: ten." }
        scopes: { type: array, items: { $ref: "#/components/schemas/KeyScope" } }
        stocksAcknowledgement: { type: string, description: "The sentence a mint sends as `acknowledgeStocks`." }
    ApiKeyMinted:
      type: object
      required: [key, name, id, owner, account, scopes, rateClass, active, selfServe, stocksAcknowledged, createdAt]
      properties:
        key: { type: [string, "null"], description: "The key, `mancer_` and 48 hex digits: in this answer alone. Null in a replay of the same Idempotency-Key." }
        keyWithheld: { type: boolean, description: "True in a replay, which withholds the key." }
        name: { type: string }
        id: { type: string }
        owner: { $ref: "#/components/schemas/Address" }
        account: { $ref: "#/components/schemas/Address" }
        scopes: { type: array, items: { $ref: "#/components/schemas/KeyScope" } }
        rateClass: { type: string, enum: [standard] }
        active: { type: boolean }
        selfServe: { type: boolean, enum: [true] }
        stocksAcknowledged:
          type: object
          properties:
            at: { type: integer }
            text: { type: string }
        createdAt: { type: string, format: date-time }
    Limits:
      type: object
      required: [caller, buckets, durable]
      properties:
        caller:
          type: object
          description: "Who the API takes the request for: `anonymous` (by its address), `session` (its wallet, account, `issuedAt` and `expiresAt`) or `key` (its `name` and `rateClass`, and a wallet key's `actsAs`)."
          required: [kind]
          properties:
            kind: { type: string, enum: [anonymous, session, key] }
            proven: { type: boolean, description: "Anonymous: false where the request's address could not be read, so it shares one tight bucket." }
            sessionRevoked: { type: boolean, description: "Anonymous: the request carried a session its account ended." }
            wallet: { $ref: "#/components/schemas/Address" }
            account: { type: [string, "null"] }
            issuedAt: { type: [integer, "null"] }
            expiresAt: { type: integer }
            name: { type: string }
            rateClass: { type: string, enum: [standard, high] }
            selfServe: { type: boolean, description: "Key: true for a key its account minted." }
            actsAs:
              type: object
              description: "Wallet key: the wallet it acts as, that wallet's account now, and its scopes."
              properties:
                wallet: { $ref: "#/components/schemas/Address" }
                account: { type: [string, "null"] }
                scopes: { type: array, items: { $ref: "#/components/schemas/KeyScope" } }
        buckets:
          type: array
          description: Every rate bucket a request from this caller may pay, each refilled to now and charged nothing by this read.
          items:
            type: object
            required: [name, scope, rate, burst, remaining, resetSeconds, applies]
            properties:
              name: { type: string, description: "The bucket, as a 429's `bucket` and `RateLimit-Policy` name it." }
              scope: { type: string, enum: [key, session, account, ip], description: "Whose it is: the key's, the session's wallet's, the account's (its wallets and its wallet keys share it), or the address's." }
              rate: { type: number, description: Tokens a second. }
              burst: { type: integer, description: Tokens at the most. }
              remaining: { type: integer, description: Requests that may follow at once. }
              resetSeconds: { type: integer, description: Seconds until the bucket is full again. }
              applies: { type: string }
        durable:
          type: array
          description: "The limits on an account's writes, with how many the account has used. `used` is null for a key or an anonymous caller, which hold no account."
          items:
            type: object
            required: [name, limit, windowSeconds, used, applies]
            properties:
              name: { type: string }
              limit: { type: integer }
              windowSeconds: { type: [integer, "null"] }
              used: { type: [integer, "null"] }
              applies: { type: string }
    SessionsRevoked:
      type: object
      required: [revoked, scope, sessionsAfter, wallets, token, issuedAt, expiresAt]
      properties:
        revoked: { type: boolean, enum: [true] }
        scope: { type: string, enum: [account, wallet] }
        sessionsAfter: { type: integer, description: "The cut, in seconds: every session of `wallets` issued at or before it is ended." }
        wallets: { type: array, items: { $ref: "#/components/schemas/Address" } }
        token: { type: string, description: "The calling wallet's fresh session." }
        issuedAt: { type: integer, description: "The fresh session's issue, a second past the cut." }
        expiresAt: { type: integer, description: "Seven days past `issuedAt`." }
        pausedWebhooks: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" }, description: "The webhooks paused with the sessions. Resume each with the fresh session." }
    ProfileReportResponse:
      type: object
      required: [report, duplicate]
      properties:
        report: { type: object, additionalProperties: true }
        duplicate: { type: boolean }
    Health:
      type: object
      properties:
        ok: { type: boolean, description: "True when the API can quote." }
        chainId: { type: integer }
        chain: { type: string }
        swapRouter: { $ref: "#/components/schemas/Address" }
        allowanceTarget:
          type: [string, "null"]
          description: "The address a user approves for swaps; null until the API has read it. A build's `tx.approval.spender` is authoritative."
        orders: { $ref: "#/components/schemas/Address" }
        ordersServed:
          type: array
          items: { type: string }
          description: "Every orders contract the API reads and cancels on. New orders sign for `orders`."
        storage: { type: string }
        venueBookReady: { type: boolean }
        node:
          type: object
          description: "The chain head the API reads, beside the public reference."
          additionalProperties: true
    ContractEntry:
      type: object
      required: [address, codeHash]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        codeHash: { $ref: "#/components/schemas/Hash", description: "keccak-256 of the runtime code at `address`, read from the chain. `eth_getCode` from your own node must hash to it." }
    Contracts:
      type: object
      required: [chainId, chain, router, allowanceTarget, orders, launchCoordinator, launchAllowanceTarget, weth, usdg]
      properties:
        chainId: { type: integer, const: 4663 }
        chain: { type: string }
        router:
          allOf: [{ $ref: "#/components/schemas/ContractEntry" }]
          description: "MancerRouter: the `to` of every swap the API builds."
        allowanceTarget:
          allOf: [{ $ref: "#/components/schemas/ContractEntry" }]
          description: "The one spender a swap's input token is approved to."
        orders:
          description: "MancerOrders, with the EIP-712 domain and `Order` typehash every order signs under."
          allOf:
            - { $ref: "#/components/schemas/ContractEntry" }
            - type: object
              required: [eip712]
              properties:
                eip712:
                  type: object
                  required: [domain, primaryType, typehash]
                  properties:
                    domain:
                      type: object
                      required: [name, version, chainId, verifyingContract]
                      properties:
                        name: { type: string, const: Mancer Orders }
                        version: { type: string, const: "3" }
                        chainId: { type: integer }
                        verifyingContract: { $ref: "#/components/schemas/Address" }
                    primaryType: { type: string, const: Order }
                    typehash: { $ref: "#/components/schemas/Hash", description: "What the contract's `ORDER_TYPEHASH()` returns." }
        launchCoordinator:
          oneOf: [{ $ref: "#/components/schemas/ContractEntry" }, { type: "null" }]
          description: "Where an account-bound launch route is sent; null where the chain has none."
        launchAllowanceTarget:
          oneOf: [{ $ref: "#/components/schemas/ContractEntry" }, { type: "null" }]
          description: "The spender a launch route's input is approved to."
        weth:
          allOf: [{ $ref: "#/components/schemas/ContractEntry" }]
          description: "Wrapped ether, which stands for native ether in every route."
        usdg:
          oneOf: [{ $ref: "#/components/schemas/ContractEntry" }, { type: "null" }]
          description: "The dollar, USDG."
    Fee:
      type: object
      description: The fee already subtracted from `amountOut`.
      properties:
        bps: { type: integer, description: "Basis points charged." }
        tier: { type: string, enum: [pegged, eth-stable, other, new-token], description: "The pair category that set the rate." }
        asset: { $ref: "#/components/schemas/Address" }
        side: { type: string, enum: [input, output, mid], description: "Which side of the trade carried the fee." }
    IntegratorFee:
      type: object
      description: "Present when the request named an integrator fee. `amountOut` and `minOut` are already net of it."
      properties:
        bps: { type: integer, description: "The rate the request named." }
        recipient: { $ref: "#/components/schemas/Address" }
        side: { type: string, enum: [input, output] }
        token: { $ref: "#/components/schemas/Address", description: "The token the fee is paid in; the zero address for native ETH." }
        amount: { $ref: "#/components/schemas/Uint", description: "On the input, the exact fee. On the output, the fee at this quote; the transaction pays the same share of what it actually delivers." }
    Safety:
      type: object
      description: Reference-value check, distinct from measured price impact.
      properties:
        blocked: { type: boolean, description: "True where the quote is refused (409, with a value guard code). A token whose simulated sale from a fresh wallet reverts is always refused." }
        reasonCode: { type: [string, "null"], enum: [value-discrepancy, pool-fee, sell-blocked, sell-gated, round-trip, router-refused, null] }
        referenceShortfallBps: { type: [integer, "null"] }
        poolFeeBps: { type: integer, description: "The largest single-pool take on the route, in bps: a static LP fee, a dynamic pool's last swap fee, a hook's modeled take on top. Absent when unknown." }
        poolFeeShareBps: { type: integer, description: "The share of the trade, in bps, that runs through the pool `poolFeeBps` names. Absent where the route does not say, which reads as the whole trade." }
        routeFeeBps: { type: integer, description: "What every pool of the route takes of the whole trade, in bps: each pool's take of what reaches it, on the share of the trade that runs through it. Absent where the route does not say." }
        outsideAgrees: { type: boolean, description: "An outside aggregator quoted the same trade within 5% of this quote (on `external=1` requests alone), so a reference shortfall is the reference's. Present (true) only then." }
        sellTaxBps: { type: integer, description: "Share of a later sale the output token itself keeps, in bps, when its sale was simulated and measured. Absent otherwise." }
        sellBlockedReason: { type: string, description: "Why the output token's simulated sale failed, from the chain. Present only with reasonCode sell-blocked." }
        sellFreshWalletBlocked: { type: boolean, description: "A wallet that never bought could not sell the output token, and nobody has traded it yet to confirm either way. Present (true) only then." }
        referenceUsdIn: { type: [number, "null"] }
        referenceUsdOut: { type: [number, "null"] }
    Approval:
      type: object
      description: The ERC-20 allowance the sender must hold first. Approve `spender` exactly as given; it is the router's allowance target, never the router.
      properties:
        token: { $ref: "#/components/schemas/Address" }
        spender: { $ref: "#/components/schemas/Address" }
        amount: { $ref: "#/components/schemas/Uint" }
    QuoteTx:
      type: object
      description: The ready-to-sign terminal transaction.
      required: [to, data, value, approval]
      properties:
        to: { $ref: "#/components/schemas/Address" }
        data: { $ref: "#/components/schemas/Hex" }
        value: { $ref: "#/components/schemas/Uint" }
        approval:
          oneOf:
            - $ref: "#/components/schemas/Approval"
            - type: "null"
        preconditions:
          type: array
          items: { type: string }
          description: Route-specific setup beyond a plain approval. Never assume approval is the only setup.
    Assessment:
      type: object
      description: The result of Mancer's simulation of the built transaction at an explicit block and fee context.
      properties:
        status: { type: string, enum: [simulated, reverted, unavailable] }
        reasonCode: { type: [string, "null"] }
        fundingMode: { type: string, enum: [real, override, unknown] }
        amountOut: { type: [string, "null"], description: "Decoded output where supported." }
        outputStatus: { type: string }
        gasEstimate: { type: [string, "null"] }
        assessedAt: { type: integer }
        context: { type: object, additionalProperties: true, description: "Block, hash, and fee context of the assessment." }
        revertSelector: { type: [string, "null"] }
    ExecutionRequirement:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [erc20-allowance, protocol-operator] }
        token: { $ref: "#/components/schemas/Address" }
        spender: { $ref: "#/components/schemas/Address" }
        amount: { $ref: "#/components/schemas/Uint" }
      additionalProperties: true
    ExecutionTransaction:
      type: object
      required: [chain, chainId, kind, to, data, value]
      properties:
        chain: { type: string, enum: [robinhood] }
        chainId: { type: integer, const: 4663 }
        kind: { type: string, enum: [approval, authorization, swap] }
        to: { $ref: "#/components/schemas/Address" }
        data: { $ref: "#/components/schemas/Hex" }
        value: { $ref: "#/components/schemas/Uint" }
    Execution:
      type: object
      description: The complete ordered wallet sequence. Submit `transactions` in order; the last is the swap.
      required: [version, taker, recipient, entrypoint, requirements, transactions]
      properties:
        version: { type: integer, const: 1 }
        taker: { $ref: "#/components/schemas/Address" }
        recipient: { $ref: "#/components/schemas/Address" }
        entrypoint: { description: "`router`, or `launch-coordinator`, whose swap goes to the launch coordinator and not to the `swapRouter` of `GET /health`.", type: string, enum: [router, launch-coordinator] }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/ExecutionRequirement" }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/ExecutionTransaction" }
    Selection:
      type: object
      description: "How the executable candidate was chosen. Gas converted into the output token is for the comparison alone: it never changes the on-chain minimum, the accepted floor or the fee."
      properties:
        requested: { type: string }
        basis: { description: "`net-output` for ETH and WETH output; `native-input-efficiency` for native ETH input; `reference-net-output` for other pairs; `output`, with `fallbackReason`, where no estimate was usable.", type: string, enum: [output, net-output, native-input-efficiency, reference-net-output] }
        tieBreak: { description: "Set where equal outputs were split by gas cost.", type: [string, "null"] }
        gasCostInOutput: { type: [string, "null"] }
        netAmountOut: { type: [string, "null"] }
        conversionBasis: { type: [string, "null"] }
        assessedCandidates: { type: integer }
        fallbackReason: { type: [string, "null"] }
        reference: { type: [object, "null"], additionalProperties: true }
      additionalProperties: true
    Quote:
      type: object
      description: The winning route's economics. Executable fields appear only when a build was requested.
      required: [amountOut, latencyMs, cached, fee]
      properties:
        amountOut: { $ref: "#/components/schemas/Uint" }
        quotedAmountOut:
          $ref: "#/components/schemas/Uint"
          description: "Executable builds only. The estimate the floor is taken from, where `amountOut` is the measured net output. On a build with `repricedFrom`, what the route's first build delivered."
        minOut:
          $ref: "#/components/schemas/Uint"
          description: Executable builds only. The floor the calldata enforces, the stronger of `acceptedMinOut` and the slippage-derived floor of `quotedAmountOut`.
        repricedFrom:
          type: object
          description: "Executable builds only, where the route's first build was stopped by its own floor alone and was built again at what it delivered (at least 80% of its estimate, and `acceptedMinOut`)."
          required: [quotedAmountOut, minOut, shortBps]
          properties:
            quotedAmountOut:
              $ref: "#/components/schemas/Uint"
              description: The estimate the route's first build carried.
            minOut:
              $ref: "#/components/schemas/Uint"
              description: The floor the route's first build carried and delivered under.
            shortBps:
              type: integer
              description: How far under the first estimate the route delivered, in basis points.
        replannedFrom:
          type: object
          description: "Executable builds only, where the first plan was refused in simulation by a market maker's own contract and a plan without that maker's refused markets was built. Absent on every other build."
          required: [quotedAmountOut, refusedBy, heldOut]
          properties:
            quotedAmountOut:
              $ref: "#/components/schemas/Uint"
              description: The estimate the refused plan carried.
            refusedBy:
              type: array
              items: { type: string }
              description: The maker venues whose contracts refused the plan.
            heldOut:
              type: array
              items: { type: string }
              description: "The markets left out of this plan, one string each. Opaque: show them, never parse them."
        route:
          $ref: "#/components/schemas/Route"
        all:
          type: array
          description: Alternatives, best first, the winner included. Absent on estimates.
          items:
            type: object
            properties:
              route: { $ref: "#/components/schemas/Route" }
              amountOut: { $ref: "#/components/schemas/Uint" }
        recommendedSlippageBps: { type: integer }
        slippageBasis: { type: string, enum: [realtime-vol, prior] }
        volBps: { type: [number, "null"] }
        marketNote: { type: [string, "null"], description: "A sentence about market hours worth showing verbatim, when there is one." }
        priceImpactBps:
          type: integer
          description: "What the order's size cost against its own route's marginal rate, in basis points; never negative. Absent where it could not be measured: derive a coarse figure from `usdIn` and `usdOut`."
        marginalRate:
          type: [number, "null"]
          description: "The route's marginal exchange rate in raw output units per raw input unit, gross of the protocol fee. Null on a flow route and whenever `priceImpactBps` is absent."
        raceInputFeeBps:
          type: integer
          description: The input-side fee, in basis points, that the race already reflected in every candidate's output. Zero for an output-side or zero-fee schedule. A build recomputes it for the funding wallet.
        timings:
          type: object
          additionalProperties: true
          description: "Diagnostics of the race (per-arm latencies, timeouts). Useful when reporting a slow or missing quote; never a contract, since the fields change between releases."
        usdIn: { type: [number, "null"] }
        usdOut: { type: [number, "null"] }
        fee: { $ref: "#/components/schemas/Fee" }
        integratorFee: { $ref: "#/components/schemas/IntegratorFee" }
        safety: { $ref: "#/components/schemas/Safety" }
        latencyMs: { type: integer }
        cached: { type: boolean }
        estimate: { type: boolean, description: "True on an anonymous estimate. Tell estimates apart by this field, never by a missing one." }
        tx:
          oneOf:
            - $ref: "#/components/schemas/QuoteTx"
            - type: "null"
          description: Executable builds only. Absent or null when every candidate failed build, policy, or simulation.
        txSimulation: { description: "`passed`; `skipped` where the request sent `verify=0`; `setup-required` where an account-bound build's setup must run before the swap can be simulated.", type: string, enum: [passed, skipped, setup-required] }
        assessment: { $ref: "#/components/schemas/Assessment" }
        execution: { $ref: "#/components/schemas/Execution" }
        selection: { $ref: "#/components/schemas/Selection" }
        ready: { $ref: "#/components/schemas/ReadyStepsField", description: "With `steps=1` alone." }
    Route:
      type: object
      required: [kind]
      additionalProperties: true
      description: "The winning route, for display and audit. Calldata is compiled on the server from the same route at build time, so a client never turns a route into a transaction itself. `kind` says which shape the other fields take; treat a kind you do not know as opaque, because a new venue can add a kind without a version bump.\n\n| `kind` | What it is | Fields beside `kind` |\n| --- | --- | --- |\n| `flow` | A plan across many pools and middle tokens, each leg one pool. `takesNetted` is true where the amounts are already net of the tokens' transfer taxes. | `legs[]`, `amountOut`, `takesNetted` |\n| `direct` | One Uniswap v3 pool on the canonical tier. | `fee` |\n| `hop` | Two v3 pools through a hub token. | `mid`, `feeIn`, `feeOut`, `path` |\n| `hop3` | Three v3 pools across the WETH and USDG bridge. | `midA`, `midB`, `feeIn`, `feeBridge`, `feeOut`, `path` |\n| `v2` | A Uniswap v2 path of one to three hops. | `path` |\n| `v4` | One Uniswap v4 pool. `hooks` is the zero address on a pool with no hook, and the zero address as a currency is native ETH. | `currency0`, `currency1`, `fee`, `tickSpacing`, `hooks`, `zeroForOne`, `hookPools` |\n| `v4hop` | Two v4 pools through a hub currency. | `exactCurrency`, `mid`, `legA`, `legB`, `out` |\n| `up33` | UP33 router hops with a stable or volatile curve per hop. | `routes[{ from, to, stable }]` |\n| `up33cl` | One UP33 concentrated-liquidity pool. | `pool`, `tickSpacing`, `zeroForOne` |\n| `path` | A chain of single-pool hops across any venues. | `legs[]` |\n| `psplit` | The order split into disjoint branches settled in one plan. | `branches[{ legs, amountIn, amountOut }]` |\n| `msplit` | The order across up to five pool-disjoint v3 and v2 routes in one transaction. | `legs[{ route, amountIn, amountOut }]` |\n| `layered` | Two stages through one middle token: every first-stage leg trades the input for the middle, every second-stage leg trades the pooled middle for the output, and the two stages split independently. | `mid`, `stages[legs[], legs[]]`, `amountOut` |\n| `network` | A split over the hub tokens: direct legs beside every hub's inbound and outbound legs, each one pool. | `direct[]`, `vias[{ mid, first, second }]`, `amountOut` |\n| `via` | Two legs through a cash token, the fee taken between them. | `cash`, `legA`, `legB`, `midOut` |\n| `ext` | An outside aggregator's route, only with `external=1`. | `agg`, `variant` |\n| `launch` | A trade on a launch protocol's bonding curve, with an optional swap before or after it. | `protocol`, `origin`, `launchId`, `token`, `quoteToken`, `direction`, `launchSettlement`, `bridge` |\n| `consolidated` | Two entrances joined through a bridge pool into one exit. | `entrances`, `bridge`, `tail`, `family` |\n| `civ-game` | A Nightshades faction trade through the game's own desk, optionally behind a conversion (`bridge`: the input into WETH before a buy, or the desk's WETH into the output after a sell), or faction to faction (`into`: the desk's WETH buys the second faction). | `direction`, `factionId`, `token`, `bridge`, `into` |\n| `cashfanout` | WETH into cash across parallel tails at a fixed split. | `tails`, `v3TailBps`, `gigaTailBps` |\n| `split` | Retired: only an old quote can carry it. | `v3Fee`, `v3AmountIn`, `v3AmountOut`, `v2Path`, `v2AmountIn`, `v2AmountOut` |"
      properties:
        kind: 
          type: string
          description: The route family.
          enum: [flow, direct, hop, hop3, v2, v4, v4hop, up33, up33cl, path, psplit, msplit, layered, network, via, ext, launch, consolidated, civ-game, cashfanout, split]
      example: { kind: path, legs: [{ venue: sushiswap-v3, tokenIn: "0x0bd7d308f8e1639fab988df18a8011f41eacad73", tokenOut: "0x5fc5360d0400a0fd4f2af552add042d716f1d168", amountIn: "280000000000000000", amountOut: "680550219", fee: 500 }] }
    RouteLeg:
      type: object
      required: [venue, tokenIn, tokenOut, amountIn, amountOut]
      description: "One leg of a route, through one pool. On a path or a branch, each leg's `amountIn` is the previous leg's `amountOut`. The pool is named by `fee`, `pool` and `tickSpacing`, `stable`, or the v4 key."
      properties:
        venue: { type: string, description: "The pool's venue, such as `v3`, `v2`, `v4`, `up33cl`, `ramsescl`, or a fee-tier v3 venue like `sushiswap-v3`." }
        tokenIn: { $ref: "#/components/schemas/Address" }
        tokenOut: { $ref: "#/components/schemas/Address" }
        amountIn: { $ref: "#/components/schemas/Uint" }
        amountOut: { $ref: "#/components/schemas/Uint" }
        fee: { type: integer, description: "v3-family fee tier in hundredths of a basis point." }
        pool: { $ref: "#/components/schemas/Address" }
        tickSpacing: { type: integer, description: "Concentrated-liquidity tick spacing for CL venues keyed by spacing rather than fee." }
        stable: { type: boolean, description: "UP33 stable-curve flag." }
        currency0: { $ref: "#/components/schemas/Address" }
        currency1: { $ref: "#/components/schemas/Address" }
        hooks: { $ref: "#/components/schemas/Address" }
        zeroForOne: { type: boolean }
    QuoteResponse:
      type: object
      required: [quote]
      properties:
        quote:
          oneOf:
            - $ref: "#/components/schemas/Quote"
            - type: "null"
          description: Null when no route exists, which is an authoritative market claim, or when a Nightshades pair's game desk did not answer, which `reason` marks as transient.
        reason:
          type: string
          enum: [civ-game-desk-unavailable, civ-game-night]
          description: "Beside a null quote that is no market claim. `civ-game-desk-unavailable`: the Nightshades desk did not answer, so retry. `civ-game-night`: the game's pools refuse every swap until `nightEndsAt`."
        nightEndsAt:
          type: string
          format: date-time
          description: With `civ-game-night`, when the current Night ends according to the game's manager.
        estimate: { type: boolean, description: "Present and true on an anonymous estimate." }
        acceptedMinOut: { $ref: "#/components/schemas/Uint" }
    LaunchAuthorization:
      type: object
      required: [protocol, origin, launchId, requirements, transactions]
      properties:
        protocol: { type: string, enum: [safe-launch-v2], description: "The launch protocol that needs setup. Pons pairs use the ordinary router allowance and never appear here." }
        origin: { $ref: "#/components/schemas/Address" }
        launchId: { type: string }
        requirements:
          type: array
          items: { $ref: "#/components/schemas/ExecutionRequirement" }
        transactions:
          type: array
          description: Setup only, in order. Never contains a swap.
          items: { $ref: "#/components/schemas/ExecutionTransaction" }
    Order:
      type: object
      description: The V3 order instrument. One signed message covers limit, stop, and recurring orders.
      required: [maker, tokenIn, tokenOut, amountPerFill, totalFills, everySec, fillWindowSec, startAt, expiry, minOutPerFill, triggerOutPerFill, maxOutPerFill, maxFeeBps, epoch, nonce, ocoGroup]
      properties:
        maker: { $ref: "#/components/schemas/Address" }
        tokenIn: { $ref: "#/components/schemas/Address" }
        tokenOut: { $ref: "#/components/schemas/Address" }
        amountPerFill: { $ref: "#/components/schemas/Uint", description: "Raw units pulled from the maker per fill." }
        totalFills: { type: integer, minimum: 1, description: "1 for a limit or stop, N for a recurring order." }
        everySec: { type: integer, description: "Seconds between fills. 0 for a single fill; 60..7776000 for recurring." }
        fillWindowSec: { type: integer, description: "Recurring slot window. 0 for a single fill; 1..everySec for recurring. Each slot is fillable in `[due, due + fillWindowSec)`; a missed slot is consumed, never shifted." }
        startAt: { type: integer, description: "Unix time of the earliest first fill. 0 anchors a recurring grid at the first successful fill." }
        expiry: { type: integer, description: "Unix time after which the order is dead. 0 = never." }
        minOutPerFill: { $ref: "#/components/schemas/Uint", description: "Floor on what reaches the maker per fill, net of fees, enforced on chain. 0 = market-priced recurring fill." }
        triggerOutPerFill: { $ref: "#/components/schemas/Uint", description: "Stop trigger. 0 unless a single-fill stop; must sit above `minOutPerFill`." }
        maxOutPerFill: { $ref: "#/components/schemas/Uint", description: "Optional range cap. 0 = uncapped; otherwise must exceed `minOutPerFill`." }
        maxFeeBps: { type: integer, minimum: 0, maximum: 100, description: "The most a fill may charge. At least the pair's schedule (`GET /v1/order-fee`), at most 100." }
        epoch: { $ref: "#/components/schemas/Hash", description: "The maker's current on-chain epoch, `makerEpoch(maker)`. Zero for a fresh wallet." }
        nonce: { $ref: "#/components/schemas/Uint", description: "Maker-chosen salt. Same terms with a new nonce is a new order." }
        ocoGroup: { $ref: "#/components/schemas/Hash", description: "One-cancels-the-other group, the same fresh 32-byte value on every leg; zero when not grouped." }
    OrderStatus:
      type: string
      enum: [open, filled, cancelled, expired]
    ExecutorBlocker:
      type: object
      description: "The latest reason Mancer's executor held an open order. Context, never signed intent; it clears after a fill or a terminal state."
      required: [code, message, observedAt]
      properties:
        code: { type: string, enum: [market-data, no-route, reference-price, price-impact, unpriceable, uneconomic, simulation, pool-fee, sell-blocked, maker-funds, floor, better-route, search-incomplete] }
        message: { type: string }
        observedAt: { type: integer }
        amountOut: { type: string }
        referenceOut: { type: string }
        marginalOut: { type: string }
        maxImpactPct: { type: number }
        referenceAgeSec: { type: number }
        feeUsd: { type: number }
        gasUsd: { type: number }
        minimumFeeUsd: { type: number }
        poolFeeBps: { type: integer, description: "With `pool-fee`: the largest single-pool take of the route that was refused, in bps." }
        barOut: { type: string, description: "With `better-route`: the gross output of the better route quoted for the same fill. The held route's `amountOut` pays well under it." }
    OrderRecord:
      type: object
      description: "An order as Mancer holds and serves it. The signature is never returned."
      required: [hash, contract, maker, order, createdAt, status, fillsDone, nextDueAt]
      properties:
        hash: { $ref: "#/components/schemas/Hash" }
        contract: { $ref: "#/components/schemas/Address", description: "The orders deployment the signature binds." }
        maker: { $ref: "#/components/schemas/Address" }
        order: { $ref: "#/components/schemas/Order" }
        createdAt: { type: integer, description: "Unix seconds." }
        status: { $ref: "#/components/schemas/OrderStatus" }
        fillsDone: { type: integer, description: "On V3, the schedule-slot cursor, which includes missed windows." }
        executionsDone: { type: integer, description: "Successful `Filled` events." }
        nextDueAt: { type: integer, description: "Unix seconds of the next slot." }
        executorBlocker:
          oneOf:
            - $ref: "#/components/schemas/ExecutorBlocker"
            - type: "null"
        ocoGroup: { type: [string, "null"] }
    Fill:
      type: object
      required: [order_hash, fill_index, maker, amount_in, amount_out, fee_bps, tx_hash, block_number, timestamp]
      properties:
        order_hash: { $ref: "#/components/schemas/Hash" }
        fill_index: { type: integer }
        maker: { $ref: "#/components/schemas/Address" }
        amount_in: { $ref: "#/components/schemas/Uint" }
        amount_out: { $ref: "#/components/schemas/Uint" }
        fee_bps: { type: integer }
        tx_hash: { $ref: "#/components/schemas/Hash" }
        block_number: { type: integer }
        timestamp: { type: integer, description: "Unix seconds." }
    Token:
      type: object
      required: [address, symbol, name, decimals, isStock, tier]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        name: { type: string }
        decimals: { type: integer }
        isStock: { type: boolean, description: "A Robinhood Chain tokenized stock." }
        tier: { type: integer, description: "2 = verified by Mancer, 1 = issued stock, 0 = the unreviewed tail." }
        impersonator: { type: boolean, description: "A symbol lookalike of a verified token." }
        price: { type: [number, "null"], description: "USD." }
        change24h: { type: [number, "null"], description: "Percent." }
        liquidityUsd: { type: [number, "null"] }
        depthUsd: { type: [number, "null"], description: "Measured executable depth." }
        volume24h: { type: [number, "null"] }
        trades24h: { type: integer }
        pools24h: { type: integer, description: "Pools that traded in the last 24 hours." }
        pools: { type: integer, description: "Pools with a depth row (the ones with a cash side)." }
        priceConfidence: { type: [string, "null"], description: "`high` or `low` (a defended price, by the pools behind it), `day`, `last`, `pool` (its market pool's price, before any trade), or null without a price." }
        priceDepthUsd: { type: [number, "null"], description: "The measured depth behind the price; 0 means it rests on volume alone." }
        firstBlock: { type: integer }
        firstSeen: { type: [integer, "null"], description: "Unix seconds." }
        marketCapUsd: { type: [number, "null"], description: "The price times the circulating supply, which leaves out the dead address's balance, an NFT market token's escrow and a Mosh token's agent vaults." }
        imageUrl: { type: [string, "null"] }
        book: { $ref: "#/components/schemas/BookFlag", description: "A Book token: its Book, and `name` is the display name where the deployment gives one. Absent on every other token." }
    TokenDetail:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          properties:
            freshness: { type: object, additionalProperties: true, description: "Which components of the row are current, partial, or missing." }
            changes:
              type: object
              properties:
                m5: { type: [number, "null"] }
                h1: { type: [number, "null"] }
                h6: { type: [number, "null"] }
                h24: { type: [number, "null"] }
            poolsList:
              type: array
              description: A bounded preview of the token's top pools.
              items:
                type: object
                properties:
                  pool: { type: string }
                  venue: { type: string }
                  other: { $ref: "#/components/schemas/Address" }
                  otherSymbol: { type: [string, "null"] }
                  cash: { type: string }
                  liquidityUsd: { type: [number, "null"] }
                  depthUsd: { type: [number, "null"] }
            poolListTruncated: { type: boolean }
            poolListLimit: { type: integer }
            chartPool: { type: [string, "null"], description: "The pool its chart is drawn from." }
            candlePools: { type: integer }
            buyVolume24h: { type: [number, "null"] }
            holders: { type: [integer, "null"] }
            totalSupply: { type: [string, "null"], description: "Raw units as an integer string." }
            circulatingSupply: { type: [number, "null"], description: "Human units: the supply less the dead address's balance, less its escrow's for an NFT market's token, and less its agent vaults' for a Mosh token." }
            escrow:
              type: object
              description: "An NFT market's token: the escrow its circulating supply and market cap leave out, which holds the token behind the collection's NFTs. Absent on every other token."
              required: [address, market, collection, balance, tokensPerNft]
              properties:
                address: { $ref: "#/components/schemas/Address" }
                market: { $ref: "#/components/schemas/Address", description: "The market's trading vault." }
                collection: { $ref: "#/components/schemas/Address" }
                balance: { type: string, description: "The escrow's balance of the token, raw units as an integer string." }
                tokensPerNft: { type: string, description: "The tokens one NFT trades at, raw units as an integer string." }
            agentVaults:
              type: object
              description: "A token Mosh launched: its swarm's agent vaults, which its circulating supply and market cap leave out, as Mosh's own supply figure does. Absent on every other token."
              required: [swarm, balance, vaults]
              properties:
                swarm: { $ref: "#/components/schemas/Address", description: "The Mosh swarm that lists the vaults." }
                balance: { type: string, description: "What the vaults hold of the token together, raw units as an integer string." }
                vaults:
                  type: array
                  items:
                    type: object
                    required: [address, balance]
                    properties:
                      address: { $ref: "#/components/schemas/Address" }
                      balance: { type: string, description: "The vault's balance of the token, raw units as an integer string." }
            fdvUsd: { type: [number, "null"] }
            source: { type: string, enum: [indexer] }
            servedAgeSec: { type: integer, description: "How old the figures in this answer are, in seconds." }
    TokenSwap:
      type: object
      properties:
        spotUsd: { type: number, description: "The pool's own price after the swap, in USD; 0 where the venue reports none." }
        id: { type: string }
        txHash: { $ref: "#/components/schemas/Hash" }
        logIndex: { type: integer }
        blockNumber: { type: string }
        timestamp: { type: integer }
        pool: { type: string }
        venue: { type: string }
        cash: { $ref: "#/components/schemas/Address", description: "The cash leg the price is measured against." }
        priceUsd: { type: number }
        volumeUsd: { type: number }
        side: { type: [string, "null"], enum: [buy, sell, null] }
        amountToken: { type: [number, "null"] }
        amountCash: { type: [number, "null"] }
        cashSymbol: { type: [string, "null"] }
        trader: { type: [string, "null"], description: "Who made the swap: its payer, as `/v1/transactions/{hash}` names each swap's `maker`, else its sender. Null on a token's fee (`fee`). A swap neither names yet is left out of the tape." }
        sender: { type: string, description: "The transaction's sender. Absent on a token's fee." }
        fee: { type: boolean, enum: [true], description: "Present where the swap is a token's own fee traded inside someone else's trade: nobody's swap, its `trader` null." }
        deliveredTo: { type: string, description: "Where what the swap bought went, where that is a wallet other than its trader." }
        solver: { type: boolean, enum: [true], description: "Present where the trader is a solver's float that filled another's purchase out of its own money." }
        purpose: { type: string, enum: [liquidity-add, liquidity-remove, liquidity-move], description: "Present where the print was a step of its owner's liquidity added, removed or moved (a zap's swap); absent for a trade." }
    Candle:
      type: object
      required: [t, o, h, l, c, v]
      properties:
        t: { type: integer, description: "Bucket start, unix seconds." }
        o: { type: number }
        h: { type: number }
        l: { type: number }
        c: { type: number }
        v: { type: number, description: "Volume in USD." }
    RoutedTotals:
      type: object
      required: [source, swaps, volumeUsd, feesUsd, unpricedFees, unpricedVolume]
      properties:
        source: { type: string, enum: [swap, split, order] }
        swaps: { type: integer }
        volumeUsd: { type: number }
        feesUsd: { type: number }
        unpricedFees: { type: integer }
        unpricedVolume: { type: integer }
    RoutedStats:
      type: object
      required: [days, series, allTime, asOf, valuation, indexing]
      properties:
        days: { type: integer }
        series:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/RoutedTotals"
              - type: object
                properties:
                  day: { type: integer, description: "UTC day as unix seconds." }
        allTime:
          type: array
          items: { $ref: "#/components/schemas/RoutedTotals" }
        asOf: { type: integer }
        valuation:
          type: object
          properties:
            basis: { type: string, const: historical-usdg }
            anchor: { type: string, const: "USDG = $1" }
            estimated: { type: boolean, const: true }
        indexing:
          type: object
          properties:
            latestTradeAt: { type: [integer, "null"] }
            status: { type: string, enum: [current, catching-up, unknown] }
    MarketStatus:
      type: object
      required: [open, phase, nextOpen, sessionOpen, nextClose, note]
      properties:
        open: { type: boolean, description: "Regular session in progress." }
        phase: { type: string, enum: [open, pre, after, closed] }
        nextOpen: { type: integer, description: "Unix seconds of the next regular-session open." }
        sessionOpen: { type: [integer, "null"] }
        nextClose: { type: [integer, "null"] }
        note: { type: [string, "null"], description: "A line clients can show verbatim." }
    BookAbiSet:
      type: string
      enum: [books]
      description: "The contracts and rules a deployment speaks: `books` is StonkBrokers' Trader Book contracts."
    BookActivityItem:
      type: object
      description: One curve trade, vault trade or market swap.
      required: [kind, token, displayName, symbol, account, side, quote, quoteAmount, tokensWei, vaultTrade, block, time, tx]
      properties:
        kind: { type: string, enum: [curve-buy, curve-sell, vault-trade, pool-swap] }
        token: { $ref: "#/components/schemas/BooksAddress" }
        displayName: { type: string }
        symbol: { type: string }
        account:
          description: The buyer, the seller, the vault, or the market swap's sender.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        side: { type: [string, "null"], enum: [buy, sell, null], description: Of the Book token; a vault trade has none. }
        quote:
          description: The Book's base pair.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        quoteAmount:
          description: How much of the base pair moved.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        tokensWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        vaultTrade:
          anyOf:
            - type: object
              properties:
                tokenIn: { $ref: "#/components/schemas/BooksAddress" }
                tokenOut: { $ref: "#/components/schemas/BooksAddress" }
                amountIn: { $ref: "#/components/schemas/BooksUnits" }
                amountOut: { $ref: "#/components/schemas/BooksUnits" }
              required: [tokenIn, tokenOut, amountIn, amountOut]
            - { type: "null" }
        block: { type: number }
        time: { type: number }
        tx: { $ref: "#/components/schemas/BooksHex" }
    BookBondBlocked:
      type: object
      description: That a bond would revert now, and why.
      required: [error, pool, poolLiquidity]
      properties:
        error: { $ref: "#/components/schemas/BookDecodedError" }
        pool:
          description: The Book's v3 pool at the locker's fee, where one exists. One someone opened off the curve's closing price stops the bond (`PoolMispriced`).
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        poolLiquidity:
          description: That pool's `liquidity()`, as it reads; null where it did not read.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
    BookBuysResponse:
      type: object
      description: The curve's trades, newest first, and every one in time order for a chart.
      required: [trades, history, nextBefore]
      properties:
        trades:
          type: array
          items: { $ref: "#/components/schemas/BookCurveTrade" }
        history:
          type: array
          items:
            type: object
            properties:
              time: { type: number }
              mcapUsd8: { $ref: "#/components/schemas/BooksUnits" }
            required: [time, mcapUsd8]
        nextBefore: { type: [number, "null"] }
    BookCapabilities:
      type: object
      description: What the chain would take now, from whoever the contracts allow.
      required:
        - abort
        - arm
        - bond
        - buy
        - buyNft
        - claimCut
        - claimFees
        - graduate
        - harvest
        - liquidate
        - openNftMarket
        - redeem
        - sell
        - sellNft
        - stake
        - sweep
        - sweepUnowned
        - trade
        - unstake
        - unwrap
        - wrap
      properties:
        openNftMarket: { type: boolean, description: "No market yet, and the Book is not cancelled." }
        wrap: { type: boolean, description: "A market that passed its checks, the Book armed, not settled and not cancelled, and the feed fresh." }
        unwrap: { type: boolean, description: "A market that passed its checks, and the feed fresh." }
        sellNft: { type: boolean, description: "A market that passed its checks, and the feed fresh." }
        buyNft: { type: boolean, description: "An NFT in the inventory, the Book not settled and not cancelled, and the feed fresh." }
        arm: { type: boolean, description: The creator may arm. }
        abort: { type: boolean, description: "The creator may cancel: armed, no buy, the curve open." }
        buy: { type: boolean }
        sell: { type: boolean }
        graduate: { type: boolean, description: Anyone may graduate. }
        bond: { type: boolean, description: Anyone may bond. }
        trade: { type: boolean, description: The traders may trade the vault. }
        stake: { type: boolean }
        unstake: { type: boolean }
        claimFees: { type: boolean }
        harvest: { type: boolean, description: Anyone may harvest the locked market's fees. }
        sweepUnowned: { type: boolean, description: Anyone may burn fees nobody staked for. }
        liquidate:
          type: object
          description: Who may settle now, and from when anyone may.
          required: [tradersAndCreator, anyone, anyoneFrom]
          properties:
            tradersAndCreator: { type: boolean }
            anyone: { type: boolean }
            anyoneFrom: { type: [number, "null"] }
        redeem: { type: boolean }
        claimCut: { type: boolean, description: A trader's cut waits to be claimed. }
        sweep:
          type: boolean
          description: A settled Book's vault holds WETH, or a balance of a token it tracks. A token it does not track, which a sweep also sells, is not read here, and a sweep of WETH or of the Book token sells nothing.
    BookCirculatingParts:
      type: object
      description: "Where part of circulating sits: the Book NFT market's vault."
      required: [nftMarket]
      properties:
        nftMarket:
          description: The tokens behind the NFTs, behind NFTs stuck in its vault, and sent to its vault; null where the Book has no market or a read of it did not answer.
          anyOf:
            - type: object
              properties:
                escrowed: { $ref: "#/components/schemas/BooksUnits" }
                backed: { type: number }
                stuckTokens: { $ref: "#/components/schemas/BooksUnits" }
                donatedTokens: { $ref: "#/components/schemas/BooksUnits" }
              required: [escrowed, backed, stuckTokens, donatedTokens]
            - { type: "null" }
    BookCurveTrade:
      type: object
      description: One trade on the curve.
      required: [side, account, grossQuote, taxQuote, taxBps, netQuote, tokensWei, mcapUsd8, block, time, tx, logIndex]
      properties:
        side: { type: string, enum: [buy, sell] }
        account: { $ref: "#/components/schemas/BooksAddress", description: The buyer (the call's recipient) or the seller. }
        grossQuote: { $ref: "#/components/schemas/BooksUnits", description: "What a buy paid, or what a sale moved on the curve, in the base pair." }
        taxQuote: { $ref: "#/components/schemas/BooksUnits" }
        taxBps: { type: number }
        netQuote: { $ref: "#/components/schemas/BooksUnits", description: "What reached the curve, or the seller." }
        tokensWei: { $ref: "#/components/schemas/BooksUnits" }
        mcapUsd8: { $ref: "#/components/schemas/BooksUnits", description: The market cap after it. }
        block: { type: number }
        time: { type: number }
        tx: { $ref: "#/components/schemas/BooksHex" }
        logIndex: { type: number }
    BookDecodedError:
      type: object
      description: A contract's refusal, decoded by its selector where it is a Books error.
      required: [name, selector]
      properties:
        name: { type: [string, "null"] }
        selector:
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
    BookDecodedPlan:
      type: object
      description: A Mancer route as the vault's adapter runs it, by token and amount.
      required: [tokenIn, tokenOut, amountIn, minAmountOut, recipient, deadline, feeBps, feeMode, legs]
      properties:
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minAmountOut: { $ref: "#/components/schemas/BooksUnits", description: The route's floor. }
        recipient: { $ref: "#/components/schemas/BooksAddress", description: "Who the route pays: the vault." }
        deadline: { type: number }
        feeBps: { type: number, description: Mancer's swap fee inside the route. }
        feeMode: { type: string, enum: [input, output, mid] }
        legs:
          type: array
          description: The route's legs.
          items:
            type: object
            properties:
              tokenIn: { $ref: "#/components/schemas/BooksAddress" }
              tokenOut: { $ref: "#/components/schemas/BooksAddress" }
              amountIn: { $ref: "#/components/schemas/BooksUnits" }
            required: [tokenIn, tokenOut, amountIn]
    BookDeploymentRef:
      type: object
      description: The deployment a Book belongs to, for good.
      required: [factory, abiSet, label]
      properties:
        factory: { $ref: "#/components/schemas/BooksAddress" }
        abiSet: { $ref: "#/components/schemas/BookAbiSet" }
        label: { type: string, description: "`books`." }
    BookDeploymentView:
      type: object
      description: One deployment of the Books contracts.
      required:
        - factory
        - label
        - abiSet
        - opensNewBooks
        - minDurationSecs
        - verified
        - failed
        - addresses
        - deployBlock
        - indexedTo
        - books
        - nftMarkets
        - signer
        - signing
        - orderSpenders
        - quotes
        - hooksAllowed
        - pendingProposals
      properties:
        factory: { $ref: "#/components/schemas/BooksAddress" }
        label: { type: string }
        abiSet: { $ref: "#/components/schemas/BookAbiSet" }
        opensNewBooks: { type: boolean, description: A new Book may be opened on it. }
        minDurationSecs: { type: [number, "null"], description: "The shortest term a new Book may run, the factory's `minDurationSecs()`." }
        verified: { type: boolean, description: Its contracts passed Mancer's checks. }
        failed:
          description: The first check that failed, where one did.
          anyOf:
            - type: object
              properties:
                address: { $ref: "#/components/schemas/BooksAddress" }
                field: { type: string }
              required: [address, field]
            - { type: "null" }
        addresses:
          type: object
          required: [factory, pad, settler, lpFees, locker, lockerV4, operatorNft, accountImplementation, adapters, bookAnvilFactory]
          properties:
            factory: { $ref: "#/components/schemas/BooksAddress" }
            pad: { $ref: "#/components/schemas/BooksAddress" }
            settler: { $ref: "#/components/schemas/BooksAddress" }
            lpFees: { $ref: "#/components/schemas/BooksAddress" }
            locker: { $ref: "#/components/schemas/BooksAddress" }
            lockerV4:
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
            operatorNft: { $ref: "#/components/schemas/BooksAddress" }
            accountImplementation: { $ref: "#/components/schemas/BooksAddress", description: The vault implementation every Book's vault is a clone of. }
            adapters:
              type: object
              required: [uniswap, mancer]
              properties:
                uniswap: { $ref: "#/components/schemas/BooksAddress" }
                mancer:
                  anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
            bookAnvilFactory:
              description: The Book NFT market factory.
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        deployBlock: { type: number }
        indexedTo: { type: [number, "null"], description: The block the index has read the deployment through. }
        books: { type: number, description: How many Books it holds. }
        nftMarkets:
          description: The Book NFT markets its factory opened, and how many failed their checks or did not read.
          anyOf:
            - type: object
              properties:
                count: { type: number }
                unverified: { type: number }
              required: [count, unverified]
            - { type: "null" }
        signer:
          description: The factory's `mancerSigner()`, whether Mancer's API has a signer, and whether it is that one.
          anyOf:
            - type: object
              properties:
                onChain:
                  anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
                configured: { type: boolean }
                current: { type: boolean }
                hasCode: { type: boolean }
              required: [onChain, configured, current, hasCode]
            - { type: "null" }
        signing:
          description: Each purpose, and whether Mancer's signing switch is on for it on this deployment. Whether the signer is ready is `signer`'s.
          anyOf:
            - type: object
              properties:
                trade: { type: boolean }
                liquidate: { type: boolean }
                sweep: { type: boolean }
                order-grant: { type: boolean }
              required: [trade, liquidate, sweep, order-grant]
            - { type: "null" }
        orderSpenders:
          type: array
          description: "The order spenders the factory lists: MancerOrders v3."
          items: { $ref: "#/components/schemas/BooksAddress" }
        quotes:
          type: array
          description: "Every base pair the raise contract lists beside WETH, delisted ones too (`allowed: false`), with its USD feed (`usdFeed`), its fixed USD price (`fixedUsd8`, 8 decimals) and its feed's age limit."
          items:
            type: object
            properties:
              token: { $ref: "#/components/schemas/BooksAddress" }
              symbol: { type: [string, "null"] }
              decimals: { type: number }
              usdFeed:
                anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
              fixedUsd8: { $ref: "#/components/schemas/BooksUnits" }
              maxAgeSecs: { type: number }
              allowed: { type: boolean }
            required: [token, symbol, decimals, usdFeed, fixedUsd8, maxAgeSecs, allowed]
        hooksAllowed:
          type: array
          description: The Uniswap v4 hooks a Book may name.
          items: { $ref: "#/components/schemas/BooksAddress" }
        pendingProposals:
          type: array
          description: "Every adapter, signer and spender the owner proposed and has not acted on, as Mancer's watch last read them: those still in their 2-day notice, and those past it."
          items:
            type: object
            properties:
              kind: { type: string, enum: [adapter, signer, spender] }
              address: { $ref: "#/components/schemas/BooksAddress" }
              since: { type: number }
            required: [kind, address, since]
    BookDetail:
      type: object
      description: "One Book's page: its summary, and every block its page shows."
      required:
        - bondBlocked
        - bookId
        - bookValueWei
        - capabilities
        - costBasisWei
        - creator
        - decimals
        - deployment
        - displayName
        - durationSecs
        - final
        - flags
        - holdings
        - launchMode
        - launchPhase
        - lock
        - lpFeeMode
        - market
        - name
        - nameFlag
        - nftMarket
        - operatorNft
        - phase
        - profile
        - quote
        - raise
        - rank
        - settlement
        - stake
        - step
        - symbol
        - terms
        - timeLeftSecs
        - times
        - token
        - traderCount
        - traders
        - trust
        - value
        - vault
        - venue
        - votes
      properties:
        token: { $ref: "#/components/schemas/BooksAddress", description: "The Book token, which names the Book." }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string, description: "The Book's id on its deployment. Name a Book by its token." }
        name: { type: string, description: "The display name where the deployment names one, else the chain's name; the same as `displayName`." }
        displayName: { type: string }
        symbol: { type: string }
        decimals: { type: number, const: 18, description: Every Book token has 18 decimals. }
        nameFlag:
          type: [string, "null"]
          enum: [impersonator, null]
          description: "`impersonator` where the Book's symbol is a verified token's symbol, or its name or symbol holds a protected name as a whole word (Mancer, StonkBrokers, TOKENIZE): such a Book is never ranked."
        quote: { $ref: "#/components/schemas/BookQuoteRef", description: The Book's base pair. }
        venue: { $ref: "#/components/schemas/BookVenueState" }
        creator: { $ref: "#/components/schemas/BooksAddress", description: The wallet that opened the Book. }
        traders:
          type: array
          description: The Book's traders, one to eight.
          items:
            type: object
            properties:
              address: { $ref: "#/components/schemas/BooksAddress" }
              acted: { type: boolean, description: "The creator's own seat, or seen confirming, cancelling or revoking on chain." }
              verified: { type: boolean, description: The trader's wallet carries Mancer's verified mark now. }
              ethos:
                description: The trader's Ethos reading, at most 30 minutes old; null where none is held.
                anyOf: [{ $ref: "#/components/schemas/BookTraderEthos" }, { type: "null" }]
            required: [address, acted, verified, ethos]
        trust:
          $ref: "#/components/schemas/BookTrust"
          description: "`flagged` where the creator or a trader who acted has an Ethos score under 800; else `trusted` where one carries the verified mark or an Ethos score of 1,600 or more; else `plain`."
        votes: { $ref: "#/components/schemas/BookVoteCounts", description: The verified accounts' votes on the Book. }
        profile: { $ref: "#/components/schemas/BookProfile", description: "What its creator set of it." }
        traderCount: { type: number }
        phase: { $ref: "#/components/schemas/BookPhase" }
        step: { $ref: "#/components/schemas/BookStep" }
        launchPhase: { $ref: "#/components/schemas/BookLaunchPhase" }
        flags: { $ref: "#/components/schemas/BookStepFlags" }
        launchMode:
          anyOf: [{ $ref: "#/components/schemas/BookLaunchMode" }, { type: "null" }]
        lpFeeMode: { type: string, enum: [stake, burn], description: "Where the locked market's fees go: to stakers, or burned." }
        durationSecs: { type: number, description: "The term, from the bond." }
        times:
          type: object
          required: [openedAt, armedAt, antiSnipeEndsAt, minBondAt, deadline, forcedBond, bondedAt, unlockAt, openToAllAt, settledAt, cancelledAt]
          properties:
            openedAt: { type: number }
            armedAt: { type: [number, "null"] }
            antiSnipeEndsAt: { type: [number, "null"], description: When the opening tax reaches its 1% floor. }
            minBondAt: { type: [number, "null"], description: "The earliest second the mark closes the curve: an hour after the tax reaches 1%." }
            deadline: { type: [number, "null"], description: "The window's end, or a buys-only Book's bond clock. It closes the curve where `forcedBond`." }
            forcedBond: { type: [boolean, "null"], description: The window's end closes the curve. }
            bondedAt: { type: [number, "null"] }
            unlockAt: { type: [number, "null"], description: The term's end. }
            openToAllAt: { type: [number, "null"], description: "When anyone may settle: the unlock and the 2-day grace." }
            settledAt: { type: [number, "null"] }
            cancelledAt: { type: [number, "null"], description: When its creator cancelled it. }
        timeLeftSecs: { type: [number, "null"], description: "To the deadline while raising (null once an open-ended raise is past it), to the unlock while trading." }
        market:
          type: object
          description: "The Book token's market: before the bond, the curve's price and market cap, and no pool; after it, the locked market (the v3 pool, or the PoolManager and the pool id on v4). Priced in the base pair."
          required: [pool, poolId, pricePerTokenQuote, priceUsd, marketCapUsd]
          properties:
            pool:
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
            poolId:
              anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
            pricePerTokenQuote:
              description: The base pair's raw units per whole token.
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            priceUsd: { type: [number, "null"] }
            marketCapUsd: { type: [number, "null"] }
        value:
          description: What a settlement now would fix, while the Book trades or is frozen.
          anyOf: [{ $ref: "#/components/schemas/BookValue" }, { type: "null" }]
        bookValueWei:
          description: "The Book's value in WETH: its raise before the bond; then its vault and the ETH its locked LP returns holders; once settled, what the settlement took in. Null if cancelled or unread."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        final:
          description: What its settlement fixed, once settled.
          anyOf: [{ $ref: "#/components/schemas/BookFinal" }, { type: "null" }]
        rank:
          type: object
          required: [ranked, why, transfersInWei, tradingReturnBps]
          properties:
            ranked: { type: boolean, description: "Raised at least 0.1 ETH, a name not flagged, and a trader who acted." }
            why:
              anyOf: [{ $ref: "#/components/schemas/BookRankWhy" }, { type: "null" }]
            transfersInWei: { $ref: "#/components/schemas/BooksUnits", description: What was sent to the vault from outside. }
            tradingReturnBps: { type: [number, "null"], description: "What the board ranks by: while the Book trades or is frozen, its return net of what was sent to the vault from outside; once settled, its settlement's `returnBps`." }
        holdings: { $ref: "#/components/schemas/BookHoldings", description: The tracked holdings. A settled Book's leave out what the settlement emptied. }
        trackedTokens:
          type: array
          description: "A settled Book alone: every token its vault tracked, its own token among them."
          items: { $ref: "#/components/schemas/BooksAddress" }
        terms: { $ref: "#/components/schemas/BookTerms", description: "The launch's terms, the close fee and the traders' share." }
        operatorNft:
          type: object
          description: The Book's operator NFT.
          required: [address, tokenId]
          properties:
            address: { $ref: "#/components/schemas/BooksAddress" }
            tokenId: { type: string }
        capabilities: { $ref: "#/components/schemas/BookCapabilities", description: What the chain would take now. }
        bondBlocked:
          description: While the step is `bond`, why a bond would revert now; null where it would land.
          anyOf: [{ $ref: "#/components/schemas/BookBondBlocked" }, { type: "null" }]
        raise:
          description: The raise.
          anyOf: [{ $ref: "#/components/schemas/BookRaiseState" }, { type: "null" }]
        vault:
          description: The vault.
          anyOf: [{ $ref: "#/components/schemas/BookVaultState" }, { type: "null" }]
        lock:
          description: The locked market, once bonded.
          anyOf: [{ $ref: "#/components/schemas/BookLockState" }, { type: "null" }]
        stake:
          description: "The staking contract's figures for this Book, sent on every Book: before the bond nothing is staked or dripped."
          anyOf: [{ $ref: "#/components/schemas/BookStakeState" }, { type: "null" }]
        settlement: { $ref: "#/components/schemas/BookSettlementState" }
        costBasisWei: { $ref: "#/components/schemas/BooksUnits", description: "What reached the vault in the raise, in WETH: its share of the tax and its 75% of the raise." }
        nftMarket:
          description: "The Book NFT market: none yet, or open."
          anyOf: [{ $ref: "#/components/schemas/NftMarketState" }, { type: "null" }]
    BookDetailResponse:
      type: object
      description: One Book, read at one block.
      required: [head, indexedBlock, book, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        indexedBlock: { type: [number, "null"], description: "The block the answer is read through." }
        book: { $ref: "#/components/schemas/BookDetail" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap", description: Every token the page names. }
    BookEthosLevel:
      type: string
      enum: [untrusted, questionable, neutral, known, established, reputable, exemplary, distinguished, revered, renowned]
      description: Ethos's level of a credibility score.
    BookFinal:
      type: object
      description: "A settled Book's figures: what the settlement fixed, and what is left to redeem."
      required:
        - navTotalWei
        - lpPotWei
        - costBasisWei
        - closeFeeWei
        - closeFeeMancerWei
        - closeFeeProtocolWei
        - creatorCutTotalWei
        - holderPotLeftWei
        - circulatingLeft
        - payoutPerTokenWei
        - returnBps
      properties:
        navTotalWei: { $ref: "#/components/schemas/BooksUnits", description: "What the vault settled for, sweeps included." }
        lpPotWei: { $ref: "#/components/schemas/BooksUnits", description: "What the locked market returned to the holders' pot, in WETH." }
        costBasisWei: { $ref: "#/components/schemas/BooksUnits" }
        closeFeeWei:
          description: This Book's close fee, sweeps included.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeMancerWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeProtocolWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        creatorCutTotalWei: { $ref: "#/components/schemas/BooksUnits", description: The traders' cut. }
        holderPotLeftWei: { $ref: "#/components/schemas/BooksUnits", description: "What the settlement contract still holds for the holders who have not redeemed, `settleOf(id).holderPot`." }
        circulatingLeft: { $ref: "#/components/schemas/BooksUnits", description: "The tokens not yet redeemed, `settleOf(id).circulating`." }
        payoutPerTokenWei:
          description: "What each whole token is paid on redemption, in WETH wei, fixed at settlement: all the settlement credited holders, sweeps included, over the tokens circulating then. Null where nothing circulated."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        returnBps:
          type: [number, "null"]
          description: "The settlement's trading NAV (`navTotalWei`, sweeps included) over the cost basis, before the close fee and the traders' cut. The LP pot, the locked liquidity's own principal, is apart."
        afterFeesBps: { type: [number, "null"], description: "The same NAV after the close fee and the traders' cut, over the cost basis, the LP pot apart: the trading return a holder kept." }
    BookFlag:
      type: object
      description: "On a token response, a Book token: its Book."
      required: [factory, abiSet, label, bookId, vault, phase, step, flags, quote, raise, unlockAt, settledAt, backingPerTokenWei, displayName, nftMarket]
      properties:
        factory: { $ref: "#/components/schemas/BooksAddress" }
        abiSet: { $ref: "#/components/schemas/BookAbiSet" }
        label: { type: string }
        bookId: { type: string }
        vault: { $ref: "#/components/schemas/BooksAddress" }
        phase: { $ref: "#/components/schemas/BookPhase" }
        step: { $ref: "#/components/schemas/BookStep" }
        flags:
          type: object
          required: [pastWindow, graduatable, feedStale]
          properties:
            pastWindow: { type: boolean }
            graduatable: { type: boolean }
            feedStale: { type: boolean }
        quote: { $ref: "#/components/schemas/BooksAddress" }
        raise:
          description: "While the Book waits, raises or has graduated: what it raised and the tax now."
          anyOf:
            - type: object
              properties:
                raisedQuote: { $ref: "#/components/schemas/BooksUnits" }
                taxBpsNow: { type: number }
              required: [raisedQuote, taxBpsNow]
            - { type: "null" }
        unlockAt: { type: [number, "null"] }
        settledAt: { type: [number, "null"] }
        backingPerTokenWei:
          description: While it trades, the holders' pot over circulating; once settled, what a token redeems for.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        displayName: { type: string }
        nftMarket:
          anyOf:
            - type: object
              properties:
                nft: { $ref: "#/components/schemas/BooksAddress" }
                tokensPerNft: { $ref: "#/components/schemas/BooksUnits" }
              required: [nft, tokensPerNft]
            - { type: "null" }
    BookGrantRow:
      type: object
      description: One order the vault granted. Its terms are public on chain.
      required:
        - spender
        - orderHash
        - kind
        - tokenIn
        - tokenOut
        - amountPerFill
        - totalFills
        - filled
        - floorPerFill
        - triggerPerFill
        - capPerFill
        - schedule
        - maxFeeBps
        - ocoGroup
        - live
        - end
        - admitted
        - hold
        - granted
      properties:
        spender: { $ref: "#/components/schemas/BooksAddress" }
        orderHash: { $ref: "#/components/schemas/BooksHex" }
        kind: { $ref: "#/components/schemas/BookOrderKind" }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountPerFill: { $ref: "#/components/schemas/BooksUnits" }
        totalFills: { type: number }
        filled: { type: number }
        floorPerFill: { $ref: "#/components/schemas/BooksUnits" }
        triggerPerFill:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        capPerFill:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        schedule:
          type: object
          required: [everySec, fillWindowSec, startAt, expiry]
          properties:
            everySec: { type: number }
            fillWindowSec: { type: number }
            startAt: { type: number }
            expiry: { type: number }
        maxFeeBps: { type: number }
        ocoGroup:
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        live:
          type: boolean
          description: "The vault still answers for the grant: not cancelled or revoked, its spender listed and Mancer's signer not revoked, its Book trading, and not expired, filled or ended in Mancer's order book."
        end:
          type: [string, "null"]
          enum: [cancelled, stopped, filled, expired, ended, null]
          description: "Why a grant that is not live ended, null while live: `cancelled` by a trader, `stopped` with every vault order (`revokeOrders`), `filled`, `expired`, or `ended` for any other end."
        admitted: { type: boolean, description: Mancer's order book holds it open. }
        hold:
          description: "Why Mancer's executor does not fill a live grant, null where nothing holds it. Nothing ever fills an `unsigned` or `passed-over` grant: a trader can cancel it. `since` is when the hold began."
          anyOf:
            - type: object
              properties:
                code: { type: string, enum: [token-refused, fills-off, unsigned, passed-over] }
                reason: { type: string }
                since: { type: number }
              required: [code, reason, since]
            - { type: "null" }
        granted:
          type: object
          required: [block, time, tx]
          properties:
            block: { type: number }
            time: { type: number }
            tx: { $ref: "#/components/schemas/BooksHex" }
    BookHistoryEvent:
      type: object
      description: One step of a Book's life.
      required: [kind, block, time, tx, logIndex, actor, detail]
      properties:
        kind: { $ref: "#/components/schemas/BookHistoryKind" }
        block: { type: number }
        time: { type: number }
        tx: { $ref: "#/components/schemas/BooksHex" }
        logIndex: { type: number }
        actor:
          description: Who sent it, where the event names them.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        detail:
          type: object
          description: "The step's figures, amounts as raw units: sibling events of its transaction merged in (the pad's and the factory's bond are one step), and words and 0 or 1 flags where the step names them."
          additionalProperties: { type: [string, number, "null"] }
    BookHistoryKind:
      type: string
      enum:
        - opened
        - armed
        - cancelled
        - graduated
        - bonded
        - order-granted
        - order-cancelled
        - orders-revoked
        - allowance-revoked
        - settled
        - unsold
        - swept
        - redeemed
        - cut-claimed
        - close-fee
        - fees-harvested
        - nft-market-opened
        - nft-image-set
      description: A kind of step in a Book's life.
    BookHistoryResponse:
      type: object
      description: A Book's history, newest first.
      required: [events, nextBefore, tokens]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/BookHistoryEvent" }
        nextBefore: { type: [number, "null"] }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookHolderRole:
      type: string
      enum: [vault, nft-market, staking, settler, pad, pool, pool-manager, dead]
      description: A holder of a Book token that is one of the Book's own contracts.
    BookHoldingShare:
      type: object
      description: One tracked holding of the vault.
      required: [token, valueWei, shareBps, isWeth, isBook]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        valueWei:
          description: What it sells for at settlement by the last valuation, in WETH wei; null where nothing priced it.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        shareBps: { type: [number, "null"], description: Its share of what the priced holdings are worth. }
        isWeth: { type: boolean }
        isBook: { type: boolean, description: The Book's own token. }
    BookHoldings:
      type: object
      description: The vault's tracked holdings, the most valuable first.
      required: [count, tokens]
      properties:
        count: { type: number, description: "How many tokens the vault tracks, at most 16 over its life. A settled Book's count leaves out what the settlement emptied." }
        tokens:
          type: array
          items: { $ref: "#/components/schemas/BookHoldingShare" }
    BookIndexingDetail:
      type: object
      description: "The `detail` of a 503 `book-indexing`: `indexedBlock`, and `bookId` where the chain names a Book the index does not hold yet. A read that names `minBlock` names `indexedBlock` alone."
      required: [indexedBlock]
      properties:
        bookId: { type: string, description: "The Book's id, where the chain names it." }
        indexedBlock: { type: [number, "null"], description: The block the index has read through; null where it has read none. }
    BookLaunchMode:
      type: string
      enum: [buys-only, guaranteed, open-ended]
      description: "How the raise runs: `buys-only` (no sales on the curve), `guaranteed` (its window closes the curve) or `open-ended` (only the mark closes it)."
    BookLaunchPhase:
      type: string
      enum: [waiting, active, migrating, migrated, aborted]
      description: The phase in the words of Mancer's launch routes.
    BookLeftToken:
      type: object
      description: A held token the run leaves unsold, and why.
      required: [token, amount, valueWei, code]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        amount: { $ref: "#/components/schemas/BooksUnits" }
        valueWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        code: { type: string }
    BookLiquidationLeft:
      type: object
      description: What this run leaves unsold, and who else may settle with it sold.
      required: [tokens, byAccess, valueWei, shareOfNavBps, othersWhoMaySettle]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/BookLeftToken" }
        byAccess:
          type: array
          description: "The tokens the request's stock access alone leaves: empty for a request an API key authorizes, which is open for issued stocks."
          items: { $ref: "#/components/schemas/BooksAddress" }
        valueWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        shareOfNavBps: { type: [number, "null"], description: Their share of the vault's value. }
        othersWhoMaySettle:
          type: object
          description: The traders and the creator, and when anyone may.
          required: [traders, creator, anyoneFrom]
          properties:
            traders:
              type: array
              items: { $ref: "#/components/schemas/BooksAddress" }
            creator: { $ref: "#/components/schemas/BooksAddress" }
            anyoneFrom: { type: number }
    BookLiquidationLeg:
      type: object
      description: "One token of a settlement: each tracked token, the vault's untracked WETH, and the lock's released base-pair leg where the vault does not track the base pair."
      required: [token, symbol, kind, amount, quotedOutWei, minOutWei, adapter, pool, reason]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        symbol: { type: [string, "null"] }
        kind: { type: string, enum: [weth, book, empty, sale, unsellable] }
        amount: { $ref: "#/components/schemas/BooksUnits", description: "What the settlement takes of it: the vault's balance, with the lock's released leg on the base pair; 0 where the balance did not read." }
        quotedOutWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        minOutWei: { $ref: "#/components/schemas/BooksUnits" }
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        pool:
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        reason: { type: [string, "null"], description: "Why it cannot sell, or how its value was read." }
    BookLiquidationQuotesRequest:
      type: object
      description: A settlement quotes request.
      properties:
        wallet:
          $ref: "#/components/schemas/Address"
          description: "The wallet that will send the transaction: a trader or the creator from the unlock, or after the 2-day grace any wallet that is not a contract."
        slippageBps: { type: number, description: "The sales' band, 50 to 150 (100 by default)." }
    BookLiquidationQuotesResponse:
      type: object
      description: The signed sales, the settlement call that carries them, and the settlement its simulation fixed.
      required: [head, deployment, bookId, vault, quotes, unquoted, call, preSync, estimate, tranches, left, simulation, slippageBps, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string }
        vault: { $ref: "#/components/schemas/BooksAddress" }
        quotes:
          type: array
          items: { $ref: "#/components/schemas/BookSignedQuote" }
        unquoted:
          type: array
          description: Each held token no quote sells, and why. A later sweep can sell it.
          items:
            type: object
            properties:
              token: { $ref: "#/components/schemas/BooksAddress" }
              amount: { $ref: "#/components/schemas/BooksUnits" }
              code: { type: string }
            required: [token, amount, code]
        call:
          type: object
          description: "`settler.liquidate(bookId, quotes)`, to send from the `wallet` the request named."
          required: [to, data, value]
          properties:
            to: { $ref: "#/components/schemas/BooksAddress" }
            data: { $ref: "#/components/schemas/BooksHex" }
            value: { type: string, const: "0" }
        preSync:
          description: The vault's `syncTracked` call, to send first where it is not null.
          anyOf:
            - type: object
              properties:
                to: { $ref: "#/components/schemas/BooksAddress" }
                data: { $ref: "#/components/schemas/BooksHex" }
              required: [to, data]
            - { type: "null" }
        estimate: { $ref: "#/components/schemas/BookSettlementEstimate", description: "The settlement as its simulation fixed it at the head. `owedLpFeesWei` and `circulatingParts` are the Book's last reading." }
        tranches:
          type: array
          description: A sale cut to what the impact cap allows, and what it leaves.
          items:
            type: object
            properties:
              token: { $ref: "#/components/schemas/BooksAddress" }
              sold: { $ref: "#/components/schemas/BooksUnits" }
              left: { $ref: "#/components/schemas/BooksUnits" }
            required: [token, sold, left]
        left:
          description: What this run leaves unsold.
          anyOf: [{ $ref: "#/components/schemas/BookLiquidationLeft" }, { type: "null" }]
        simulation:
          type: object
          required: [block, gas]
          properties:
            block: { type: number }
            gas: { type: [number, "null"] }
        slippageBps: { type: number }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
        ready: { $ref: "#/components/schemas/ReadyStepsField", description: "With `steps=1` alone." }
    BookLiquidationResponse:
      type: object
      description: A frozen Book's settlement as it would run now.
      required: [head, deployment, bookId, phase, eligible, legs, preSync, syncDue, quotesAt, estimate, slippageBps, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string }
        phase: { $ref: "#/components/schemas/BookPhase" }
        eligible:
          type: object
          description: Whether `caller` may settle now, and from when.
          required: [caller, role, now, from, mustBeEoa, callerKind]
          properties:
            caller:
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
            role: { type: [string, "null"], enum: [trader, creator, other, null] }
            now: { type: boolean }
            from: { type: number }
            mustBeEoa: { type: boolean, description: "The caller must send its own transaction: a wallet with no seat after the grace." }
            callerKind:
              anyOf: [{ $ref: "#/components/schemas/BookTakerKind" }, { type: "null" }]
        legs:
          type: array
          items: { $ref: "#/components/schemas/BookLiquidationLeg" }
        preSync:
          description: The vault's `syncTracked` call to send first, with an API key; null without one.
          anyOf:
            - type: object
              properties:
                to: { $ref: "#/components/schemas/BooksAddress" }
                data: { $ref: "#/components/schemas/BooksHex" }
              required: [to, data]
            - { type: "null" }
        syncDue: { type: boolean, description: "A tracked token's balance, the Book's own token aside, differs from what the vault tracks of it, as a filled order leaves it: a sync is due." }
        quotesAt: { type: string, description: The route that signs the sales. }
        estimate: { $ref: "#/components/schemas/BookSettlementEstimate" }
        slippageBps: { type: number }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookLockPositionState:
      type: object
      description: "One of the locked market's two positions: the full-range pair, or the unsold tokens' one-sided ask."
      required: [kind, positionId, tickLower, tickUpper, liquidity, bookAmountWei, quoteAmount]
      properties:
        kind: { type: string, enum: [pair, ask] }
        positionId: { type: [string, "null"], description: The v3 position; null on v4. }
        tickLower: { type: number }
        tickUpper: { type: number }
        liquidity: { $ref: "#/components/schemas/BooksUnits" }
        bookAmountWei: { $ref: "#/components/schemas/BooksUnits", description: The Book tokens it holds now. }
        quoteAmount: { $ref: "#/components/schemas/BooksUnits", description: The base pair it holds now. }
    BookLockState:
      type: object
      description: The Book's locked market.
      required: [lockId, venue, locker, pool, poolId, hook, positions, bookAmountWei, quoteAmount, owedBookWei, owedQuote, unlockAt, released]
      properties:
        lockId: { type: string }
        venue: { $ref: "#/components/schemas/BookVenue" }
        locker: { $ref: "#/components/schemas/BooksAddress", description: The locker that holds it. }
        pool: { $ref: "#/components/schemas/BooksAddress", description: "The v3 pool, or the PoolManager on v4." }
        poolId:
          description: The v4 pool id; null on v3.
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        hook:
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        positions:
          type: array
          items: { $ref: "#/components/schemas/BookLockPositionState" }
        bookAmountWei: { $ref: "#/components/schemas/BooksUnits" }
        quoteAmount: { $ref: "#/components/schemas/BooksUnits" }
        owedBookWei: { $ref: "#/components/schemas/BooksUnits", description: Fees owed in Book tokens. }
        owedQuote: { $ref: "#/components/schemas/BooksUnits", description: Fees owed in the base pair. }
        unlockAt: { type: number }
        released: { type: boolean, description: Settlement released it. }
    BookMyVote:
      type: object
      description: A wallet's own vote on a Book.
      required: [side, thesis, at]
      properties:
        side: { $ref: "#/components/schemas/BookVoteSide" }
        thesis: { type: [string, "null"], description: "Null where the vote carries no thesis, or Mancer took it down." }
        at: { type: number, description: Unix seconds of its last change. }
    BookNftApproval:
      description: "The approval a market call waits on: the Book token to the market's vault, or the vault approved for one NFT or every one."
      anyOf:
        - type: object
          properties:
            kind: { type: string, const: erc20 }
            token: { $ref: "#/components/schemas/BooksAddress" }
            spender: { $ref: "#/components/schemas/BooksAddress" }
            amount: { $ref: "#/components/schemas/BooksUnits" }
          required: [kind, token, spender, amount]
        - type: object
          properties:
            kind: { type: string, const: erc721 }
            nft: { $ref: "#/components/schemas/BooksAddress" }
            operator: { $ref: "#/components/schemas/BooksAddress" }
            ids:
              type: array
              items: { type: string }
          required: [kind, nft, operator, ids]
        - type: object
          properties:
            kind: { type: string, const: erc721-all }
            nft: { $ref: "#/components/schemas/BooksAddress" }
            operator: { $ref: "#/components/schemas/BooksAddress" }
          required: [kind, nft, operator]
    BookNftFlag:
      type: object
      description: "On a wallet's rows, a Book's NFT market collection: its Book."
      required: [token, factory, bookId, tokensPerNft, displayName, symbol]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress", description: The Book token. }
        factory: { $ref: "#/components/schemas/BooksAddress" }
        bookId: { type: string }
        tokensPerNft: { $ref: "#/components/schemas/BooksUnits" }
        displayName: { type: string }
        symbol: { type: string }
    BookNftMarketBook:
      type: object
      description: The Book a market route answers for.
      required: [token, deployment, bookId, phase, displayName, symbol]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string }
        phase: { $ref: "#/components/schemas/BookPhase" }
        displayName: { type: string }
        symbol: { type: string }
    BookNftMarketCapabilities:
      type: object
      description: What the Book's NFT market allows now, by its state. Who may act is for the caller to compare.
      required: [openNftMarket, wrap, unwrap, sellNft, buyNft]
      properties:
        openNftMarket: { type: boolean, description: "No market yet, and the Book is not cancelled." }
        wrap: { type: boolean, description: "A market that passed its checks, the Book armed, not settled and not cancelled, and the feed fresh." }
        unwrap: { type: boolean, description: "A market that passed its checks, and the feed fresh." }
        sellNft: { type: boolean, description: "A market that passed its checks, and the feed fresh." }
        buyNft: { type: boolean, description: "An NFT in the inventory, the Book not settled and not cancelled, and the feed fresh." }
    BookNftMarketResponse:
      type: object
      description: A Book's NFT market, its inventory oldest first, and what can be done now.
      required: [head, book, market, inventory, capabilities, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        book: { $ref: "#/components/schemas/BookNftMarketBook" }
        market: { $ref: "#/components/schemas/NftMarketState" }
        inventory:
          type: object
          required: [count, ids, truncated]
          properties:
            count: { type: number }
            ids:
              type: array
              items: { type: string }
            truncated: { type: boolean }
        capabilities: { $ref: "#/components/schemas/BookNftMarketCapabilities" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookNftMarketSummary:
      type: object
      description: A Book's NFT market on the board, where one passed its checks.
      required: [tokensPerNft, outside, escrowShareBps]
      properties:
        tokensPerNft: { $ref: "#/components/schemas/BooksUnits" }
        outside: { type: number, description: The NFTs wallets hold. }
        escrowShareBps: { type: [number, "null"], description: "The tokens the market's vault holds behind every outstanding NFT, stuck ones included (`escrowed()`), as a share of circulating." }
    BookNftMove:
      type: object
      description: One move through a market, one row a transaction and action.
      required: [action, account, recipient, count, ids, feeWei, block, time, tx]
      properties:
        action: { type: string, enum: [wrap, unwrap, sell, buy] }
        account: { $ref: "#/components/schemas/BooksAddress", description: "Who paid for a wrap or a purchase, owned the NFTs of an unwrap, or sold." }
        recipient:
          description: A wrap's recipient; null for the other moves.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        count: { type: number }
        ids:
          description: The NFTs moved, lowest first; null for an unwrap.
          anyOf:
            - type: array
              items: { type: string }
            - { type: "null" }
        feeWei: { $ref: "#/components/schemas/BooksUnits" }
        block: { type: number }
        time: { type: number }
        tx: { $ref: "#/components/schemas/BooksHex" }
    BookNftMovesResponse:
      type: object
      description: A market's moves, newest first.
      required: [moves, nextBefore]
      properties:
        moves:
          type: array
          items: { $ref: "#/components/schemas/BookNftMove" }
        nextBefore: { type: [number, "null"] }
    BookNftQuoteResponse:
      type: object
      description: One market call as the chain would take it from the wallet at the head.
      required: [head, action, wallet, walletKind, count, ids, tokens, fee, checks, afterSettlement, approval, tx, note]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        action: { $ref: "#/components/schemas/NftMarketAction" }
        wallet: { $ref: "#/components/schemas/BooksAddress" }
        walletKind: { $ref: "#/components/schemas/BookTakerKind" }
        count: { type: number }
        ids:
          anyOf:
            - type: array
              items: { type: string }
            - { type: "null" }
        tokens: { $ref: "#/components/schemas/BooksUnits", description: The Book tokens the call moves. }
        fee:
          type: object
          required: [wei, valueWei, bufferBps, usd, refundable]
          properties:
            wei: { $ref: "#/components/schemas/BooksUnits", description: The exact fee at the head. }
            valueWei: { $ref: "#/components/schemas/BooksUnits", description: "What to send: the fee and its buffer where the wallet takes ETH back, the exact fee where it does not." }
            bufferBps: { type: number }
            usd: { type: number }
            refundable: { type: boolean, description: The wallet takes the change back. }
        checks:
          type: object
          description: What the call waits on, as the chain reads it at the head.
          required: [feedFresh, walletTokens, allowance, owned, nftApproved, inInventory, operator, maker]
          properties:
            feedFresh: { type: boolean }
            walletTokens:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            allowance:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            owned: { type: [boolean, "null"] }
            nftApproved: { type: [boolean, "null"] }
            inInventory: { type: [boolean, "null"] }
            operator: { type: [boolean, "null"] }
            maker: { type: [boolean, "null"] }
        afterSettlement:
          description: "An unwrap of a settled Book: what the freed tokens redeem for, less the unwrap's fee."
          anyOf:
            - type: object
              properties:
                tokensFreed: { $ref: "#/components/schemas/BooksUnits" }
                payoutWei: { $ref: "#/components/schemas/BooksUnits" }
                unwrapFeeWei: { $ref: "#/components/schemas/BooksUnits" }
                netWei: { $ref: "#/components/schemas/BooksSignedUnits" }
              required: [tokensFreed, payoutWei, unwrapFeeWei, netWei]
            - { type: "null" }
        approval:
          anyOf: [{ $ref: "#/components/schemas/BookNftApproval" }, { type: "null" }]
        tx:
          description: The call, every recipient the wallet, with an API key; null without one.
          anyOf:
            - type: object
              properties:
                to: { $ref: "#/components/schemas/BooksAddress" }
                data: { $ref: "#/components/schemas/BooksHex" }
                value: { $ref: "#/components/schemas/BooksUnits" }
                chainId: { type: number, const: 4663 }
              required: [to, data, value, chainId]
            - { type: "null" }
        note: { type: [string, "null"], description: "Where the exact fee is sent: a feed step before the call lands can refuse it." }
        ready: { $ref: "#/components/schemas/ReadyStepsField", description: "With `steps=1` alone." }
    BookOrderBounds:
      type: object
      description: The bounds a vault order's fields must fit.
      required:
        - kinds
        - totalFills
        - everySec
        - fillWindowSec
        - startAtLatest
        - expiryLatest
        - spanMaxSec
        - stopBandBps
        - trigger
        - grantDeadlineSec
        - liveGrants
        - totalCapBps
        - liveTotalCapBps
      properties:
        kinds:
          type: array
          description: "The kinds of vault order Mancer signs: none while Mancer's executor fills no vault orders."
          items: { $ref: "#/components/schemas/BookOrderKind" }
        totalFills:
          type: object
          required: [min, max]
          properties:
            min: { type: number }
            max: { type: number }
        everySec:
          type: object
          required: [min, max]
          properties:
            min: { type: number }
            max: { type: number }
        fillWindowSec:
          type: object
          required: [min]
          properties:
            min: { type: number }
        startAtLatest: { type: number, description: The latest start. }
        expiryLatest: { type: number, description: "The latest expiry: before the Book's unlock." }
        spanMaxSec: { type: number }
        stopBandBps:
          type: object
          required: [min, max, default]
          properties:
            min: { type: number }
            max: { type: number }
            default: { type: number }
        trigger:
          type: object
          required: [minUnderPlanBps, maxUnderReferenceBps, needsCashSide]
          properties:
            minUnderPlanBps: { type: number }
            maxUnderReferenceBps: { type: number }
            needsCashSide: { type: boolean }
        grantDeadlineSec:
          type: object
          required: [solo, several]
          properties:
            solo: { type: number }
            several:
              type: object
              required: [min, max, default]
              properties:
                min: { type: number }
                max: { type: number }
                default: { type: number }
        liveGrants:
          type: object
          required: [max, now]
          properties:
            max: { type: number }
            now: { type: number }
        totalCapBps: { type: number, description: "One order's whole total, in basis points of the vault's value." }
        liveTotalCapBps: { type: number, description: "Every live order's remaining total, in basis points of the vault's value." }
    BookOrderGrantRequest:
      type: object
      description: A vault order grant request. A field it does not name, or a field of another kind, is refused.
      required: [kind, tokenIn, tokenOut, amountPerFill]
      properties:
        wallet: { $ref: "#/components/schemas/Address", description: "The wallet that will send the transaction, which your servers vouch for (`wallet-required` without it): a trader of the Book." }
        kind: { $ref: "#/components/schemas/BookOrderKind" }
        tokenIn: { $ref: "#/components/schemas/Address" }
        tokenOut: { $ref: "#/components/schemas/Address" }
        amountPerFill: { type: string, pattern: "^[1-9][0-9]*$", description: "The raw units of `tokenIn` each fill sells: above zero, and at most a uint128." }
        totalFills: { type: number, description: "Required for a recurring order (`twap`): 2 to 1,000." }
        everySec: { type: number, description: "Required for a recurring order (`twap`): 60 seconds to a day." }
        fillWindowSec: { type: number, description: "A recurring order: 60 seconds up to the interval." }
        minOutPerFill: { type: string, pattern: "^[1-9][0-9]*$", description: "Required for a `limit`: what one fill delivers at the least, net of the fee, in raw units above zero." }
        triggerOutPerFill: { type: string, pattern: "^[1-9][0-9]*$", description: "Required for a `stop`: the trigger, on one fill's gross output, in raw units above zero." }
        stopBandBps: { type: number, description: "A stop: the floor's band beneath the trigger, 100 to 1,000 (300 by default)." }
        startAt: { type: number, description: "Chain seconds, from a minute before the head to an hour after it." }
        expiry: { type: number, description: "Chain seconds, never past the Book's unlock less a minute." }
        deadlineSec: { type: number, description: "The grant's deadline in seconds, the shortest the policy allows: 600 with one trader, and 900 with several. It may name only that, and any other is 400 `bad-body`." }
        preview: { type: boolean, const: true, description: "Every check and the simulation, and no signature." }
    BookOrderGrantResponse:
      type: object
      description: The order Mancer built, its signed grant and intent, and the readings it was signed under.
      required:
        - kind
        - preview
        - order
        - grant
        - intent
        - digest
        - replaces
        - market
        - reference
        - budget
        - simulation
        - policy
        - signer
        - deployment
        - bookId
        - vault
        - tokens
        - head
      properties:
        kind: { $ref: "#/components/schemas/BookOrderKind" }
        preview: { type: boolean }
        order: { $ref: "#/components/schemas/BookOrderV3" }
        grant:
          anyOf: [{ $ref: "#/components/schemas/BookOrderGrantSignature" }, { type: "null" }]
        intent:
          anyOf: [{ $ref: "#/components/schemas/BookOrderIntent" }, { type: "null" }]
        digest:
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        replaces:
          anyOf: [{ $ref: "#/components/schemas/BookOrderReplaces" }, { type: "null" }]
        market: { $ref: "#/components/schemas/BookOrderMarket" }
        reference: { $ref: "#/components/schemas/BookOrderReference" }
        budget:
          type: object
          required: [dayCapBps, dayUsedBps, grantBps, hourCapBps, hourUsedBps]
          properties:
            grantBps: { type: number }
            hourUsedBps: { type: number }
            dayUsedBps: { type: number }
            hourCapBps: { type: number }
            dayCapBps: { type: number }
        simulation:
          type: object
          required: [proposeGas, grantGas, block]
          properties:
            proposeGas: { type: [number, "null"] }
            grantGas: { type: [number, "null"] }
            block: { type: number }
        policy:
          type: object
          required: [solo, deadlineSec, access, notionalWei, feeBps]
          properties:
            solo: { type: boolean }
            deadlineSec: { type: number }
            access: { $ref: "#/components/schemas/BookSigningAccess" }
            notionalWei: { $ref: "#/components/schemas/BooksUnits" }
            feeBps: { type: number }
        signer:
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string }
        vault: { $ref: "#/components/schemas/BooksAddress" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
        head: { $ref: "#/components/schemas/BooksHead" }
    BookOrderGrantSignature:
      type: object
      description: The grant Mancer signed.
      required: [spender, orderHash, deadline, salt, signature]
      properties:
        spender: { $ref: "#/components/schemas/BooksAddress" }
        orderHash: { $ref: "#/components/schemas/BooksHex" }
        deadline: { type: string }
        salt: { type: string }
        signature: { $ref: "#/components/schemas/BooksHex" }
    BookOrderIntent:
      type: object
      description: The `OrderIntent` `proposeOrder` and `confirmOrder` take, at the vault's `orderNonce()`.
      required: [spender, order, nonce, deadline, quoteSalt, mancerSig]
      properties:
        spender: { $ref: "#/components/schemas/BooksAddress" }
        order: { $ref: "#/components/schemas/BookOrderV3" }
        nonce: { type: string }
        deadline: { type: string }
        quoteSalt: { type: string }
        mancerSig: { $ref: "#/components/schemas/BooksHex" }
    BookOrderKind:
      type: string
      enum: [twap, limit, stop]
      description: "A vault order: `twap` (recurring), `limit` or `stop`."
    BookOrderMarket:
      type: object
      description: One fill against the market at the head.
      required: [outPerFillAtHead, grossOutPerFillAtHead, floorGapBps, triggerGapBps, impactBps]
      properties:
        outPerFillAtHead: { $ref: "#/components/schemas/BooksUnits" }
        grossOutPerFillAtHead: { $ref: "#/components/schemas/BooksUnits" }
        floorGapBps: { type: number }
        triggerGapBps: { type: [number, "null"] }
        impactBps: { type: number }
    BookOrderPreviewCode:
      type: string
      enum:
        - limit-under-market
        - stop-over-market
        - stop-would-fire
        - stop-too-deep
        - stop-band-too-narrow
        - fill-impact-too-high
        - price-moved
        - orders-exceed-holding
        - no-reference
        - no-route
      description: Why the pending order would not be granted now.
    BookOrderPreviewRequest:
      type: object
      description: The vault's pending order exactly as `pendingOrder()` reads it.
      required: [order]
      properties:
        wallet: { $ref: "#/components/schemas/Address", description: "The wallet that will send the transaction, which your servers vouch for (`wallet-required` without it): a trader of the Book." }
        order: { $ref: "#/components/schemas/BookOrderV3" }
    BookOrderPreviewResponse:
      type: object
      description: The vault's pending order beside the market now.
      required: [kind, pending, valid, refusals, market, reference, tokens, head]
      properties:
        kind: { $ref: "#/components/schemas/BookOrderKind" }
        pending: { type: boolean, description: The body is the vault's pending order. }
        valid:
          type: boolean
          description: "No refusal: the order passes a grant's checks of its tokens, route, price and the vault's holding at the head. The budget, reversals, live-grant cap and a stop's bounds are checked at the grant alone."
        refusals:
          type: array
          items:
            type: object
            properties:
              code:
                anyOf:
                  - { $ref: "#/components/schemas/BookOrderPreviewCode" }
                  - { type: string, const: token-refused:not-erc20 }
                  - { type: string, const: token-refused:book-token }
                  - { type: string, const: token-refused:not-verified }
                  - { type: string, const: token-refused:stock-not-receivable }
                  - { type: string, const: token-refused:sell-blocked }
                  - { type: string, const: token-refused:insider-liquidity }
                  - { type: string, const: token-refused:launch-curve }
                  - { type: string, const: token-refused:not-a-target }
              detail:
                type: object
                additionalProperties: {}
            required: [code]
        market:
          anyOf: [{ $ref: "#/components/schemas/BookOrderMarket" }, { type: "null" }]
        reference: { $ref: "#/components/schemas/BookOrderReference" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
        head: { $ref: "#/components/schemas/BooksHead" }
    BookOrderReference:
      description: How Mancer's executor holds each fill against the reference prices.
      anyOf:
        - type: object
          properties:
            kind: { type: string, enum: [twap, limit] }
            window: { type: string, const: 30m }
            outPerFill:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            holdUnderBps: { type: number }
          required: [kind, window, outPerFill, holdUnderBps]
        - type: object
          properties:
            kind: { type: string, const: stop }
            window: { type: string, const: 30m }
            outPerFill:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            holdUnderBps: { type: number }
            trigger:
              type: object
              required: [window, minMinutes, outPerFill]
              properties:
                window: { type: string, const: 5m }
                minMinutes: { type: number }
                outPerFill:
                  anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            broad:
              type: object
              required: [minPools, minMinutes, holdUnderBps]
              properties:
                minPools: { type: number }
                minMinutes: { type: number }
                holdUnderBps: { type: number }
            onePool:
              type: boolean
              description: "A stop: one pool alone set the 30-minute reference of the token whose fall it waits for, so it fills only once that price is within the band, and in a fast fall it may not fill."
          required: [kind, window, outPerFill, holdUnderBps, trigger, broad, onePool]
    BookOrderReplaces:
      type: object
      description: The pending order a proposal of this one replaces, and who had confirmed it.
      required: [digest, orderHash, kind, confirmedBy]
      properties:
        digest: { $ref: "#/components/schemas/BooksHex" }
        orderHash: { $ref: "#/components/schemas/BooksHex" }
        kind: { $ref: "#/components/schemas/BookOrderKind" }
        confirmedBy:
          type: array
          items: { $ref: "#/components/schemas/BooksAddress" }
    BookOrderV3:
      type: object
      description: "MancerOrders v3's `Order`: amounts as decimal strings, counts, times and the fee cap as JSON numbers, and `epoch` and `ocoGroup` as 32 bytes of hex."
      required:
        - maker
        - tokenIn
        - tokenOut
        - amountPerFill
        - totalFills
        - everySec
        - fillWindowSec
        - startAt
        - expiry
        - minOutPerFill
        - triggerOutPerFill
        - maxOutPerFill
        - maxFeeBps
        - epoch
        - nonce
        - ocoGroup
      properties:
        maker: { $ref: "#/components/schemas/BooksAddress" }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountPerFill: { $ref: "#/components/schemas/BooksUnits" }
        totalFills: { type: number }
        everySec: { type: number }
        fillWindowSec: { type: number }
        startAt: { type: number }
        expiry: { type: number }
        minOutPerFill: { $ref: "#/components/schemas/BooksUnits" }
        triggerOutPerFill: { $ref: "#/components/schemas/BooksUnits" }
        maxOutPerFill: { $ref: "#/components/schemas/BooksUnits" }
        maxFeeBps: { type: number }
        epoch: { $ref: "#/components/schemas/BooksHex" }
        nonce: { type: string }
        ocoGroup: { $ref: "#/components/schemas/BooksHex" }
    BookPendingIntent:
      type: object
      description: The vault's pending trade.
      required:
        - digest
        - adapter
        - adapterKind
        - tokenIn
        - tokenOut
        - amountIn
        - minOut
        - nonce
        - deadline
        - route
        - quoteSalt
        - mancerSig
        - plan
        - uniswapPath
        - confirmations
        - quote
        - checks
      properties:
        digest: { $ref: "#/components/schemas/BooksHex", description: The vault's `pendingDigest()`. }
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        adapterKind: { type: string, enum: [uniswap, mancer, unknown], description: The adapter the trade runs through. }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minOut: { $ref: "#/components/schemas/BooksUnits" }
        nonce: { type: string }
        deadline: { type: number }
        route:
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        quoteSalt: { type: [string, "null"] }
        mancerSig:
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        plan:
          anyOf: [{ $ref: "#/components/schemas/BookDecodedPlan" }, { type: "null" }]
        uniswapPath:
          anyOf:
            - type: array
              items:
                type: object
                properties:
                  token: { $ref: "#/components/schemas/BooksAddress" }
                  fee: { type: number }
                required: [token, fee]
            - { type: "null" }
        confirmations:
          type: array
          description: Each trader, and whether it confirmed.
          items:
            type: object
            properties:
              trader: { $ref: "#/components/schemas/BooksAddress" }
              confirmed: { type: boolean }
            required: [trader, confirmed]
        quote:
          description: Who signed the quote, whether that is the factory's signer now, and whether it was used or expired.
          anyOf:
            - type: object
              properties:
                signer:
                  anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
                signerIsCurrent: { type: boolean }
                used: { type: boolean }
                expired: { type: boolean }
              required: [signer, signerIsCurrent, used, expired]
            - { type: "null" }
        checks:
          description: The pending trade read against its own route.
          anyOf:
            - type: object
              properties:
                routeMatchesIntent: { type: boolean }
                recipientIsVault: { type: boolean }
                floorCoversMinOut: { type: boolean }
                feeWithinCap: { type: boolean }
              required: [routeMatchesIntent, recipientIsVault, floorCoversMinOut, feeWithinCap]
            - { type: "null" }
    BookPendingOrder:
      type: object
      description: The vault's pending order grant.
      required: [digest, spender, order, nonce, deadline, confirmations]
      properties:
        digest: { $ref: "#/components/schemas/BooksHex" }
        spender: { $ref: "#/components/schemas/BooksAddress" }
        order: { $ref: "#/components/schemas/BookOrderV3" }
        nonce: { type: string }
        deadline: { type: number }
        confirmations:
          type: array
          items:
            type: object
            properties:
              trader: { $ref: "#/components/schemas/BooksAddress" }
              confirmed: { type: boolean }
            required: [trader, confirmed]
    BookPhase:
      type: string
      enum: [waiting, raising, graduated, trading, frozen, settled, aborted]
      description: A Book's phase at the head's second, never a device's clock. `aborted` is a cancelled Book.
    BookPolicyCode:
      type: string
      enum:
        - not-erc20
        - book-token
        - not-verified
        - geo-restricted
        - stock-not-receivable
        - no-reference
        - sell-blocked
        - insider-liquidity
        - launch-curve
        - unread
        - not-a-target
      description: Why the policy refuses a token.
    BookPolicyResponse:
      type: object
      description: What Mancer will sign for this vault.
      required: [head, access, verdicts, budget, orders, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        access: { $ref: "#/components/schemas/BookSigningAccess" }
        verdicts:
          type: array
          items: { $ref: "#/components/schemas/BookPolicyVerdict" }
        budget: { $ref: "#/components/schemas/BookSignBudget" }
        orders: { $ref: "#/components/schemas/BookOrderBounds" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookPolicySide:
      type: object
      description: One side of a token's verdict.
      required: [verdict, code]
      properties:
        verdict: { type: string, enum: [signable, refused] }
        code:
          anyOf: [{ $ref: "#/components/schemas/BookPolicyCode" }, { type: "null" }]
    BookPolicyVerdict:
      type: object
      description: One token as the policy reads it.
      required: [token, isStock, buy, sell, holdingCapBps]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        isStock: { type: boolean }
        buy: { $ref: "#/components/schemas/BookPolicySide", description: As a trade's output. }
        sell: { $ref: "#/components/schemas/BookPolicySide", description: "As a trade's input, at the 30-minute reference alone: a settlement's sale and a sweep read six hours where the 30 minutes are thin." }
        holdingCapBps: { type: [number, "null"], description: The most of the vault's value it may hold of the token; null where no cap applies. }
    BookProfile:
      type: object
      description: "What a Book's creator set of it. None of it is on chain, and the targets bind what Mancer signs."
      required: [logo, description, links, targets, updatedAt]
      properties:
        logo: { type: [string, "null"], description: "The logo's path on the API, a new path for every change; null where none was set." }
        description: { type: [string, "null"], description: "Plain text: 1 to 500 characters and 10 lines, no link, line breaks as `\\n`." }
        links:
          type: object
          description: "Each a full https link: a website on its own host, an X profile (`https://x.com/<handle>`), a Telegram link (`https://t.me/<name>`)."
          required: [website, x, telegram]
          properties:
            website: { type: [string, "null"] }
            x: { type: [string, "null"] }
            telegram: { type: [string, "null"] }
        targets:
          type: array
          description: Up to 16 tokens the Book means to buy, in the creator's order. Where any are named, Mancer signs the vault's purchases into these, its base pair, WETH and USDG alone.
          items: { $ref: "#/components/schemas/BooksAddress" }
        updatedAt: { type: [number, "null"], description: Unix seconds of its last change; null where nothing was ever set. }
    BookQuoteRef:
      type: object
      description: "A Book's base pair: WETH, or a token the raise contract lists, with its US dollar price at the head."
      required: [token, symbol, decimals, isWeth, usd8, source]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        symbol: { type: [string, "null"] }
        decimals: { type: number }
        isWeth: { type: boolean }
        usd8:
          description: "The price now, US dollars with 8 decimals: a feed's answer, or the fixed price a listing holds. Null while the raise contract cannot read its feed (`StalePrice`)."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        source:
          type: string
          enum: [eth-usd-feed, usd-feed, fixed]
          description: "Where the price comes from: `eth-usd-feed` for WETH, `usd-feed` for a listed token whose listing names a USD feed, and `fixed` for the fixed USD price a listing holds where it names none."
    BookQuoteRoute:
      type: object
      description: A route in the shape `/v1/quote` serves one.
      required: [kind]
      properties:
        kind: { type: string }
      additionalProperties: {}
    BookRaiseQuoteResponse:
      type: object
      description: A raise trade as a direct call to the raise contract from the taker's own wallet.
      required:
        - head
        - deployment
        - bookId
        - side
        - payWith
        - quote
        - amountIn
        - taxBps
        - taxQuote
        - curveQuote
        - amountOut
        - minOut
        - pricePerTokenAfterQuote
        - moveBps
        - mcapUsd8After
        - closesCurve
        - nextTaxStep
        - cap
        - takerKind
        - tx
        - approval
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string }
        side: { type: string, enum: [buy, sell] }
        payWith: { type: string, enum: [eth, quote], description: "`eth` or `quote` (the base pair)." }
        quote: { $ref: "#/components/schemas/BookQuoteRef" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        taxBps: { type: number, description: The tax of the head's minute. }
        taxQuote: { $ref: "#/components/schemas/BooksUnits", description: "The tax, in the base pair." }
        curveQuote: { $ref: "#/components/schemas/BooksUnits", description: "The base pair that moves on the curve: a buy's after the tax, a sale's before it." }
        amountOut: { $ref: "#/components/schemas/BooksUnits", description: "A buy's tokens, or a sale's base pair (or ETH) after the tax." }
        minOut: { $ref: "#/components/schemas/BooksUnits", description: The floor the call enforces. }
        pricePerTokenAfterQuote: { $ref: "#/components/schemas/BooksUnits", description: The base pair's raw units per whole token after the trade. }
        moveBps: { type: number, description: How far the trade moves the curve's price. }
        mcapUsd8After:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closesCurve: { type: boolean, description: "The buy reaches the mark at a moment the mark may close the curve: it fills in full and graduates the Book." }
        nextTaxStep:
          anyOf:
            - type: object
              properties:
                at: { type: number }
                bps: { type: number }
              required: [at, bps]
            - { type: "null" }
        cap:
          description: "A sale's cap: the lesser of what the wallet bought on the curve and what it holds."
          anyOf:
            - type: object
              properties:
                boughtOnCurve: { $ref: "#/components/schemas/BooksUnits" }
                held: { $ref: "#/components/schemas/BooksUnits" }
                sellable: { $ref: "#/components/schemas/BooksUnits" }
              required: [boughtOnCurve, held, sellable]
            - { type: "null" }
        takerKind: { $ref: "#/components/schemas/BookTakerKind" }
        tx:
          description: The call, with an API key; null without one.
          anyOf:
            - type: object
              properties:
                to: { $ref: "#/components/schemas/BooksAddress" }
                data: { $ref: "#/components/schemas/BooksHex" }
                value: { $ref: "#/components/schemas/BooksUnits" }
                chainId: { type: number, const: 4663 }
              required: [to, data, value, chainId]
            - { type: "null" }
        approval:
          description: The exact allowance the call needs first, with an API key; null without one, or where it needs none.
          anyOf:
            - type: object
              properties:
                token: { $ref: "#/components/schemas/BooksAddress" }
                spender: { $ref: "#/components/schemas/BooksAddress" }
                amount: { $ref: "#/components/schemas/BooksUnits" }
              required: [token, spender, amount]
            - { type: "null" }
        ready: { $ref: "#/components/schemas/ReadyStepsField", description: "With `steps=1` alone." }
    BookRaiseState:
      type: object
      description: The raise at the head's second.
      required:
        - aborted
        - armed
        - bonded
        - buyCount
        - feed
        - gradMcapUsd8
        - graduated
        - loadedSupply
        - mcapUsd8
        - nextTaxStep
        - pricePerTokenQuote
        - progressBps
        - quoteMark
        - quoteToGraduate
        - raisedEthWei
        - raisedQuote
        - realEth
        - sellsEnabled
        - startMcapUsd8
        - startTaxBps
        - taxBpsNow
        - taxFloorAt
        - taxSplitBps
        - timing
        - vEth
        - vToken
      properties:
        raisedQuote: { $ref: "#/components/schemas/BooksUnits", description: "The base pair the raise holds, in its raw units." }
        raisedEthWei:
          description: The raise in WETH at the raise contract's prices; null where a price did not read.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        mcapUsd8:
          description: The curve's market cap, US dollars with 8 decimals.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        gradMcapUsd8: { $ref: "#/components/schemas/BooksUnits", description: "The mark: the market cap that closes the curve, US dollars with 8 decimals." }
        progressBps: { type: number, description: The market cap's progress to the mark. }
        buyCount: { type: number }
        taxBpsNow: { type: number, description: The raise tax at the head's second. }
        startMcapUsd8:
          description: The opening market cap, as the terms set it.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        startTaxBps: { type: [number, "null"], description: "The opening raise tax, as the terms set it." }
        vEth: { $ref: "#/components/schemas/BooksUnits", description: "The curve's virtual base-pair reserve, in the base pair's raw units." }
        vToken: { $ref: "#/components/schemas/BooksUnits", description: The curve's virtual Book reserve. }
        realEth: { $ref: "#/components/schemas/BooksUnits", description: The base pair the raise holds. }
        loadedSupply: { $ref: "#/components/schemas/BooksUnits", description: The supply minted to the raise at the arm. }
        armed: { type: boolean }
        graduated: { type: boolean }
        bonded: { type: boolean }
        aborted: { type: boolean }
        nextTaxStep:
          description: When the tax next falls, and to what; null before the arm and once it is at 1%.
          anyOf:
            - type: object
              properties:
                at: { type: number }
                bps: { type: number }
              required: [at, bps]
            - { type: "null" }
        taxFloorAt: { type: [number, "null"], description: When the tax reaches 1%. }
        quoteToGraduate:
          description: The base pair, gross of the tax now, that lifts the market cap to the mark; null before the arm, once there or graduated, and where the base pair's price did not read.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        pricePerTokenQuote: { $ref: "#/components/schemas/BooksUnits", description: The base pair's raw units per whole token at the curve's price. }
        feed:
          type: object
          description: The ETH/USD feed the raise reads.
          required: [ethUsd8, updatedAt, stale]
          properties:
            ethUsd8: { $ref: "#/components/schemas/BooksUnits" }
            updatedAt: { type: number }
            stale: { type: boolean }
        quoteMark:
          type: object
          description: The base pair's own US dollar price, where it comes from (`eth-usd-feed`, `usd-feed` or `fixed`), and whether its feed is stale.
          required: [usd8, source, stale]
          properties:
            usd8:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            source: { type: string, enum: [eth-usd-feed, usd-feed, fixed] }
            stale: { type: boolean }
        timing:
          type: object
          description: The raise's clock, as the raise contract's `timingOf` answers it.
          required: [antiSnipeEndsAt, minBondAt, deadline, forcedBond]
          properties:
            antiSnipeEndsAt: { type: number }
            minBondAt: { type: number }
            deadline: { type: number }
            forcedBond: { type: boolean }
        sellsEnabled: { type: boolean, description: "Not buys only, and the curve open." }
        taxSplitBps:
          type: object
          description: "Where the tax goes, in basis points of it: 7,500 to the vault, 833 to the creator, 833 to StonkBrokers' treasury, the rest (`remainderTo`) to the pad's StockBooster on a WETH Book, else the treasury."
          required: [vault, creator, protocol, remainder, remainderTo]
          properties:
            vault: { type: number }
            creator: { type: number }
            protocol: { type: number }
            remainder: { type: number }
            remainderTo: { type: string, enum: [stock-booster, treasury] }
    BookRaiseSummary:
      type: object
      description: A raise's figures while a Book waits, raises or has graduated.
      required: [raisedQuote, raisedEthWei, mcapUsd8, gradMcapUsd8, progressBps, buyCount, taxBpsNow, startMcapUsd8, startTaxBps]
      properties:
        raisedQuote: { $ref: "#/components/schemas/BooksUnits", description: "The base pair the raise holds, in its raw units." }
        raisedEthWei:
          description: The raise in WETH at the raise contract's prices; null where a price did not read.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        mcapUsd8:
          description: The curve's market cap, US dollars with 8 decimals.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        gradMcapUsd8: { $ref: "#/components/schemas/BooksUnits", description: "The mark: the market cap that closes the curve, US dollars with 8 decimals." }
        progressBps: { type: number, description: The market cap's progress to the mark. }
        buyCount: { type: number }
        taxBpsNow: { type: number, description: The raise tax at the head's second. }
        startMcapUsd8:
          description: The opening market cap, as the terms set it.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        startTaxBps: { type: [number, "null"], description: "The opening raise tax, as the terms set it." }
    BookRankWhy:
      type: string
      enum: [raise-under-floor, name-flagged, no-trader-acted]
      description: Why a Book is not ranked.
    BookRealized:
      type: object
      description: What a transaction's sales realized. A purchase carries none.
