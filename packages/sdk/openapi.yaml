              schema: { $ref: "#/components/schemas/BookNftMarketResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503":
          description: "`nft-market-unverified`, `book-indexing`, `books-index-unavailable`, `books-state-unavailable` or `books-deployment-unverified`. See [Books errors](/api/guides/books/errors)."
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait, where sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
  /v1/books/{token}/nft-market/moves:
    get:
      tags: [Books NFT market]
      summary: "List a Book NFT market's moves"
      operationId: getBookNftMoves
      security:
        - {}
        - { bearer: [] }
      description: "Wraps, unwraps, sales and purchases, newest first, one row a transaction and action. A page ends at a block's end. A Book with no market yet answers an empty list."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/BooksBefore" }
      responses:
        "200":
          description: The moves.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookNftMovesResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503":
          description: "`nft-market-unverified`, `book-indexing`, `books-index-unavailable`, `books-state-unavailable` or `books-deployment-unverified`. See [Books errors](/api/guides/books/errors)."
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait, where sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
  /v1/books/{token}/nft-market/quote:
    get:
      tags: [Books NFT market]
      summary: "Quote a Book NFT market call"
      operationId: getBookNftQuote
      security:
        - {}
        - { bearer: [] }
      description: "One market call checked as the chain would check it, on a reading at most 10 seconds old, with its fee and what it waits on. A wrap, unwrap, sale or purchase moves 1 to 20 NFTs at $1 in ETH each. `tx` needs a session or an API key."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [open, wrap, unwrap, sell, buy-oldest, buy-specific, set-image] }
        - name: wallet
          in: query
          required: true
          description: The address that sends the call.
          schema: { $ref: "#/components/schemas/Address" }
        - name: count
          in: query
          description: "`wrap` and `buy-oldest`: how many NFTs. A call moves 1 to 20: 409 `zero-count` or `batch-too-large` otherwise."
          schema: { type: integer, minimum: 0, maximum: 9999 }
        - name: ids
          in: query
          description: "`unwrap`, `sell` and `buy-specific`: a comma list of 1 to 20 NFT ids, each named once."
          schema: { type: string, example: "12,13,14" }
        - name: tokensPerNft
          in: query
          description: "`open`: the Book tokens each NFT holds, in raw units: 10^18 to 10^25, one token to 10,000,000."
          schema: { $ref: "#/components/schemas/Uint" }
        - name: name
          in: query
          description: "`open`: 1 to 40 printable characters with plain spaces, and no quote mark, backslash or angle bracket."
          schema: { type: string, maxLength: 40 }
        - name: symbol
          in: query
          description: "`open`: 1 to 12 printable characters, no spaces."
          schema: { type: string, maxLength: 12 }
        - name: imageUrl
          in: query
          description: "`open` and `set-image`: an `https://` address with a host name, an `ipfs://` content id, or a PNG, JPEG, GIF or WebP `data:` URL of at most 8,192 characters; any other is at most 512 characters."
          schema: { type: string }
        - { $ref: "#/components/parameters/Steps" }
      responses:
        "200":
          description: The call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookNftQuoteResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409":
          description: "`no-nft-market`, `nft-market-exists`, `not-book-operator`, `not-market-maker`, `nft-market-paused`, `book-not-armed`, `book-settled`, `book-cancelled`, `zero-count`, `batch-too-large`, `not-owner`, `not-in-inventory`, `inventory-short`, `insufficient-tokens`, `bad-tokens-per-nft`, `bad-name`, `bad-symbol` or `bad-image-url`. See [Books errors](/api/guides/books/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
        "503":
          description: "`nft-market-unverified`, `book-indexing`, `books-index-unavailable`, `books-state-unavailable` or `books-deployment-unverified`. See [Books errors](/api/guides/books/errors)."
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait, where sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
  /health:
    get:
      tags: [System]
      summary: "Get deployment addresses"
      operationId: getHealth
      security: []
      description: "Mancer's live contract addresses, its chain, and whether the API can quote now. Read `swapRouter`, `allowanceTarget` and `orders` here at runtime rather than pinning them; a build's `tx.approval.spender` is the address to approve."
      responses:
        "200":
          description: Deployment and readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                ok: true
                chainId: 4663
                chain: Robinhood Chain
                swapRouter: "0xa62858659C83095Eb5E702f0Af6a7Bb7F370B3e7"
                allowanceTarget: "0x4c16269006dB0DD87e6aE3C8A014B2807Aa2e388"
                orders: "0xf300A6549Cd46206629e6719d3f258022d7F2da1"
                ordersServed: ["0xf300a6549cd46206629e6719d3f258022d7f2da1"]
                storage: canonical-postgres
                venueBookReady: true
                node: { block: 61639549, lagBlocks: 0, lagSec: 0, degraded: false, reason: null, source: primary }
  /v1/geo:
    get:
      tags: [System]
      summary: "Get the caller's region"
      operationId: getGeo
      security: []
      description: "The country the request arrived from, and whether tokenized stocks may trade from it. Where `stocksRestricted` is true, a session's or an anonymous quote or order touching a stock answers 451. A request your API key authorizes is never refused for its region."
      responses:
        "200":
          description: Region details.
          content:
            application/json:
              schema:
                type: object
                required: [country, stocksRestricted]
                properties:
                  country:
                    type: [string, "null"]
                    description: ISO 3166-1 alpha-2 country code, or null when unknown.
                  stocksRestricted:
                    type: boolean
                    description: True when stock pairs are refused for this region (HTTP 451 on quotes and orders).
              example: { country: "DE", stocksRestricted: false }
  /v1/limits:
    get:
      tags: [System]
      summary: "Get rate limits"
      operationId: getLimits
      security:
        - {}
        - { bearer: [] }
      description: "Who the API takes the request for, every rate bucket it may pay with the tokens left in each, and the account's write limits. A route's own allowance for each caller is not listed. Reading it charges only its own request."
      responses:
        "200":
          description: The caller's limits.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Limits" }
              example:
                caller: { kind: session, wallet: "0xfe1a867b752c2f3033655d222a674bd1d8cb0f03", account: "0xfe1a867b752c2f3033655d222a674bd1d8cb0f03", issuedAt: 1793500000, expiresAt: 1794104800 }
                buckets:
                  - { name: session, scope: session, rate: 30, burst: 120, remaining: 119, resetSeconds: 1, applies: "every request the session makes, from any address" }
                  - { name: ip-ceiling, scope: ip, rate: 60, burst: 240, remaining: 239, resetSeconds: 1, applies: "every request from this address but those an API key authorizes, all callers there together" }
                  - { name: account-write, scope: account, rate: 2, burst: 10, remaining: 10, resetSeconds: 0, applies: "an account's writes: POST, PUT, PATCH and DELETE under /v1/me, a report, the X link's steps, a Book's records" }
                durable:
                  - { name: follows-per-hour, limit: 100, windowSeconds: 3600, used: 3, applies: "PUT /v1/me/following/{id}: 429 follow-limit" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/me/api-keys:
    get:
      tags: [API keys]
      summary: "List the account's API keys"
      operationId: listApiKeys
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "The keys of every wallet the account holds, those it minted and those Mancer issued to it, with their scopes and terms, never a key itself. A session asks, or a wallet key with `read`."
      responses:
        "200":
          description: The account's keys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyList" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [API keys]
      summary: "Mint an API key"
      operationId: mintApiKey
      security:
        - { bearer: [] }
      description: "Mints a key that acts as the session's wallet within its scopes, the key in this answer alone. A session alone mints: three keys in force an account, ten kept. `acknowledgeStocks` is the sentence a `stocks-ack-required` refusal names, exactly."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, acknowledgeStocks]
              additionalProperties: false
              properties:
                name: { type: string, pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$", description: "The key's name: 1 to 40 lowercase letters, digits and hyphens, the account's once." }
                scopes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/KeyScope" } }
                acknowledgeStocks:
                  type: string
                  enum: ["Issued stocks are open to this key. Keeping them from anyone in a place where they may not be traded is my responsibility."]
                  description: "The holder's acknowledgement that keeping issued stocks from the places they may not be traded is theirs. Kept with the key."
      responses:
        "201":
          description: Minted. The key is in this answer alone; a replay of the same Idempotency-Key withholds it.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyMinted" }
        "400": { description: "`stocks-ack-required`, `bad-key-name`, `bad-scopes`, `unknown-field`, `bad-body` or `idempotency-key-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-session-only` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`keys-max`, `key-name-taken`, `idempotency-in-progress` or `idempotency-key-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`self-serve-keys-off`: minting is not open yet; or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/api-keys/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: "The key's name, or its `id`. Where two of the account's wallets hold a key of one name, the `id`."
        schema: { type: string }
    patch:
      tags: [API keys]
      summary: "Change an API key"
      operationId: changeApiKey
      security:
        - { bearer: [] }
      description: "Changes a key's scopes, or pauses it (`active: false`) and resumes it. A pause ends the key at once on the server that answers, within 30 seconds on every other, and pauses the webhooks the key made. A session alone changes a key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scopes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/KeyScope" } }
                active: { type: boolean }
      responses:
        "200":
          description: "The key as it stands now, and the webhooks its pause paused."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiKey" }
                  - { type: object, required: [pausedWebhooks], properties: { pausedWebhooks: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" } } } }
        "400": { description: "`bad-scopes`, `unknown-field` or `bad-body`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-managed-by-mancer`, `key-session-only`, `key-server-only`, or `primary-wallet-only`: another wallet's key is the primary wallet's to change. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`key-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`keys-max`: a resume past three keys in force; or `key-name-ambiguous`: ask by the `id` its detail lists. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [API keys]
      summary: "Delete an API key"
      operationId: deleteApiKey
      security:
        - { bearer: [] }
      description: "Deletes a key for good: it ends at once on the server that answers, and within 30 seconds on every other. The webhooks it made are paused for a session to resume. A session alone deletes a key."
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, name, id, pausedWebhooks]
                properties:
                  deleted: { type: boolean, enum: [true] }
                  name: { type: string }
                  id: { type: string }
                  pausedWebhooks: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" }, description: "The webhooks the key made, paused." }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-managed-by-mancer`, `key-session-only`, `key-server-only`, or `primary-wallet-only`: another wallet's key is the primary wallet's to change. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`key-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`key-name-ambiguous`: ask by the `id` its detail lists. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/contracts:
    get:
      tags: [System]
      summary: "Get the contracts to check against"
      operationId: getContracts
      security: []
      description: "The contracts a client signs against, each with the keccak-256 of its runtime code. Read the same hash from your own node and refuse a contract that differs, before you sign a build, an approval or an order. See [Ready-to-sign steps](/api/guides/steps)."
      responses:
        "200":
          description: The live contracts.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contracts" }
              example:
                chainId: 4663
                chain: Robinhood Chain
                router: { address: "0xa62858659C83095Eb5E702f0Af6a7Bb7F370B3e7", codeHash: "0x6f7e1b7c12c4f744d3ff28fca581921728a5e66155fa8ba9628aafe08fdf9064" }
                allowanceTarget: { address: "0x4c16269006dB0DD87e6aE3C8A014B2807Aa2e388", codeHash: "0x…" }
                orders:
                  address: "0xf300A6549Cd46206629e6719d3f258022d7F2da1"
                  codeHash: "0x630145f26ba1a3bff17a536857dbd1fa259f4194be2adb930558810245217439"
                  eip712:
                    domain: { name: Mancer Orders, version: "3", chainId: 4663, verifyingContract: "0xf300A6549Cd46206629e6719d3f258022d7F2da1" }
                    primaryType: Order
                    typehash: "0x…"
                launchCoordinator: { address: "0xF5a39FE1b86C533F471d0e48dc0280804B8DDF69", codeHash: "0x1ec170ede1f3d3e9a06d44f045f320a4276410d5f9d88cdc60212c832421355f" }
                launchAllowanceTarget: { address: "0x9D356d32Df8a7463E8D73e26021e0dd8fdB7c65C", codeHash: "0xacf056eb923a69c9f9567dca28757c3ce9e37e71b98181e3291ce8c7e8385b02" }
                weth: { address: "0x0bd7d308f8e1639fab988df18a8011f41eacad73", codeHash: "0x…" }
                usdg: { address: "0x5fc5360d0400a0fd4f2af552add042d716f1d168", codeHash: "0x…" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`chain-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An API key (`mancer_…`) kept on your servers, or a wallet session's token from `POST /auth/verify`. A key cannot move funds. See [Authentication](/api/guides/authentication)."
    walletKey:
      type: http
      scheme: bearer
      description: "A wallet key (`mancer_…`) minted by a wallet's session with `POST /v1/me/api-keys`: it acts as that wallet within its scopes, from a server alone. See [Wallet keys](/api/guides/authentication#wallet-keys)."
  headers:
    RequestId:
      description: "The request's id: yours echoed where you sent an `X-Request-Id` of 1 to 128 of `[A-Za-z0-9._:-]`, else one made for it. Name it when you write to support."
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before sending the request again. Every 429 and every 503 carries it.
      schema: { type: integer, minimum: 0 }
    RateLimitPolicy:
      description: "The rate bucket nearest its end, by the IETF httpapi draft: `\"<bucket>\";q=<burst>;w=<seconds to refill from empty>`."
      schema: { type: string }
      example: '"session";q=120;w=4'
    RateLimit:
      description: "That bucket now: `\"<bucket>\";r=<requests left at once>;t=<seconds until full>`."
      schema: { type: string }
      example: '"session";r=118;t=1'
    IdempotentReplayed:
      description: "`true` where the answer is the one kept for the request's `Idempotency-Key`, and the write did not run again."
      schema: { type: string, enum: ["true"] }
  responses:
    Unauthorized:
      description: "`auth-required` or `session-revoked`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: sign in required, code: auth-required, retryable: false }
    SessionRefused:
      description: "`session-required`, `auth-required` or `session-revoked`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: This session was ended. Sign in again., code: session-revoked, retryable: false }
    RateLimited:
      description: "`rate-limited`. See [Errors](/api/guides/errors)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
        RateLimit: { $ref: "#/components/headers/RateLimit" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: rate limited, code: rate-limited, retryable: true, retryAfterSeconds: 1, bucket: session }
    IdempotencyKeyReused:
      description: "`idempotency-key-reused`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GeoRestricted:
      description: "`geo-restricted`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "Tokenized stocks are not available for trading in your region. Every other token remains open.", code: geo-restricted }
    StoreUnavailable:
      description: "`store-unavailable`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BooksBadQuery:
      description: "`bad-query`. See [Books errors](/api/guides/books/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BooksBadRequest:
      description: "`bad-query` or `bad-address`. See [Books errors](/api/guides/books/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BooksSigningBadBody:
      description: "`bad-body`, `unknown-field`, `wallet-required`, `wallet-mismatch`, `bad-query` or `bad-address`. See [Books errors](/api/guides/books/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BooksSigningBadRequest:
      description: "`bad-query`, `bad-address`, `wallet-required` or `wallet-mismatch`. See [Books errors](/api/guides/books/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BooksNotABook:
      description: "`not-a-book`. See [Books errors](/api/guides/books/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
          example: { error: this token is not a Book, code: not-a-book }
    BooksUnavailable:
      description: "`books-index-unavailable` or `books-state-unavailable`. See [Books errors](/api/guides/books/errors)."
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait, where sent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BookUnavailable:
      description: "`book-indexing`, `books-index-unavailable`, `books-state-unavailable` or `books-deployment-unverified`. See [Books errors](/api/guides/books/errors)."
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait, where sent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
    BooksSigningUnauthorized:
      description: "`auth-required` or `session-revoked`. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BooksRateLimited:
      description: "`books-rate-limited` or `rate-limited`. See [Books errors](/api/guides/books/errors)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenThesesUnavailable:
      description: "`store-unavailable`; `book-indexing`, a Book its factory opened and the index has not written yet, whose votes are the Book's once it is; or `books-state-unavailable`, the factory did not answer. See [Errors](/api/guides/errors)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TokenIsABook:
      description: "`token-is-a-book`: the token is a Book's, and `detail.book` names it; its votes and theses are the Book's routes'. See [Errors](/api/guides/errors)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: "this token is a Book: its votes and theses are the Book's", code: token-is-a-book, retryable: false, detail: { book: "0x00000000000000000000000000000000000000ab" } }
    VotesRateLimited:
      description: "`votes-rate-limited` or `rate-limited`. See [Errors](/api/guides/errors)."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BooksSigningUnavailable:
      description: "`books-signing-off`, `books-signer-unavailable`, `books-signer-stopped`, `books-signer-has-code`, `books-signer-not-current`, `books-chain-stale`, `books-sign-log-unavailable`, `books-index-unavailable` or `books-state-unavailable`. See [Books errors](/api/guides/books/errors)."
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait, where sent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BooksError" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: "Your own key of 1 to 255 visible ASCII characters, kept a day. The same request again with it is answered the kept success (`Idempotent-Replayed: true`) and runs nothing."
      schema: { type: string, minLength: 1, maxLength: 255 }
    Steps:
      name: steps
      in: query
      description: "`1` adds `ready`: the answer's approvals and transactions as ready-to-sign steps, each simulated from the wallet at the head. Without it, the answer carries no `ready`. It also pays a `steps` bucket."
      schema: { type: string, enum: ["1"] }
    ThesesFollowing:
      name: following
      in: query
      description: "`1` lists the theses of the profiles the session's account follows alone, and needs a session."
      schema: { type: string, enum: ["0", "1"] }
    BookToken:
      name: token
      in: path
      required: true
      description: The Book's token, which names the Book.
      schema: { $ref: "#/components/schemas/Address" }
    BooksBefore:
      name: before
      in: query
      description: "A block number: the page lists items from blocks before it. Pass a page's `nextBefore`."
      schema: { type: integer, minimum: 0 }
    BooksMinBlock:
      name: minBlock
      in: query
      description: "A receipt's block: the answer waits up to 2.5 seconds for the Book to be read through it, and names how far it got in `indexedBlock`. A block past the head counts as the head."
      schema: { type: integer, minimum: 0, maximum: 999999999999 }
    BooksActingWallet:
      name: wallet
      in: query
      description: "The wallet that will send the transaction: a session's own (another answers 400 `wallet-mismatch`); an API key must name it (400 `wallet-required`)."
      schema: { $ref: "#/components/schemas/Address" }
    UserId:
      name: id
      in: path
      required: true
      description: An address, or a username with or without its `@`.
      schema: { type: string }
  schemas:
    ReadyStep:
      type: object
      description: One transaction the wallet signs and sends itself, in the order given. An approval is a step of its own, with its calldata.
      required: [kind, to, data, value, gas, why]
      properties:
        kind: { type: string, description: "What the step does: `approval`, `wrap`, `swap`, `transfer`, `cancel`, `cancelAll`, `authorization`, a Book act's name (`arm`, `redeem` and the rest), or a route's own (`buy`, `sell`, `liquidate`)." }
        to: { $ref: "#/components/schemas/Address" }
        data: { $ref: "#/components/schemas/Hex" }
        value: { $ref: "#/components/schemas/Uint", description: Wei sent with the step. }
        gas: { type: [string, "null"], description: "A gas limit the simulation proved, in decimal: what the step spent, 30% more and 10,000 for the L1 data share, at most 30,000,000; null where the simulation did not reach it." }
        why: { type: string, description: One sentence. }
    ReadyStepsRevert:
      type: object
      description: What stopped the steps.
      required: [step, kind, error, selector, args, message]
      properties:
        step: { type: [integer, "null"], description: "The step that reverted, from 0. Null where none ran: the wallet cannot pay a step's gas at the base fee and its value (`error` `insufficient-funds`)." }
        kind: { type: [string, "null"] }
        error: { type: [string, "null"], description: "The decoded error: a contract's own by name, `Error` with its reason, `Panic`, or `insufficient-funds`. Null where the revert carried nothing Mancer decodes." }
        selector: { type: [string, "null"] }
        args: { type: array, items: { type: string } }
        message: { type: string }
    ReadyStepsSimulation:
      type: object
      description: "The steps run in order from the wallet, in one block on top of the head at the head's own second, on the wallet's own balances and allowances, at the gas each names and the head's base fee. What the wallet must hold is priced at twice it (`outcome.fees`)."
      required: [ok, block, timestamp]
      properties:
        ok: { type: boolean, description: "Whether every step ran. Steps that would revert are answered with `ok` false and `revert`, never as a refusal." }
        block: { type: integer, description: The head the steps ran on top of. }
        timestamp: { type: integer, description: "The head's second, the chain's clock every deadline was read on." }
        outcome:
          type: object
          description: "What the steps did: each step's gas and returned word, the events (ether moved as `EthTransfer`), the fees beside the wallet's ether, the route's own facts (`received`, `payoutWei` and the rest)."
          additionalProperties: true
          properties:
            gasUsed: { type: array, items: { type: string } }
            returns: { type: array, items: { type: [string, "null"] } }
            events:
              type: array
              description: At most 64.
              items:
                type: object
                required: [step, address, event, args]
                properties:
                  step: { type: integer }
                  address: { type: string }
                  event: { type: string, description: "The event's name, or `unknown:<topic0's first four bytes>`." }
                  args: { type: object, additionalProperties: true }
            fees:
              type: object
              properties:
                baseFeePerGas: { type: [string, "null"] }
                maxFeePerGas: { type: [string, "null"], description: Twice the head's base fee. }
                needWei: { type: [string, "null"], description: "Every step's gas at `maxFeePerGas`, and every step's value." }
                balanceWei: { type: [string, "null"] }
                covered: { type: [boolean, "null"] }
        revert: { $ref: "#/components/schemas/ReadyStepsRevert" }
    ReadySteps:
      type: object
      description: "What one wallet signs and sends, in order, and the simulation that proved them at one head. Mancer signs and sends nothing. Steps are for that head and that wallet: ask again rather than keep them."
      required: [chainId, wallet, steps, simulation, readAfter]
      properties:
        chainId: { type: integer, const: 4663 }
        wallet: { $ref: "#/components/schemas/Address", description: "The wallet that signs and sends every step, lowercase." }
        steps: { type: array, items: { $ref: "#/components/schemas/ReadyStep" } }
        simulation: { $ref: "#/components/schemas/ReadyStepsSimulation" }
        readAfter:
          description: The Mancer read that shows what the steps did, where there is one.
          oneOf:
            - type: object
              required: [path, minBlock]
              properties:
                path: { type: string }
                minBlock: { type: integer, description: "The first block the steps can land in. Name the last step's receipt block as `?minBlock=` where the read takes one." }
                method: { type: string, enum: [POST], description: Where the read is not a GET. }
            - { type: "null" }
    ReadyStepsField:
      description: "With `steps=1`: the steps, or why not, beside the route's own answer: `key-required` for a public read asked with no session or key, `steps-unavailable` where the chain did not answer."
      oneOf:
        - $ref: "#/components/schemas/ReadySteps"
        - type: object
          required: [error, code]
          properties:
            error: { type: string }
            code: { type: string }
            detail: { type: object, additionalProperties: true }
    StepsError:
      type: object
      description: "A steps route's refusal or outage, its sentence and its code. Where it carries `detail.why`, that names the reason in a word (`not-the-creator`, `not-a-trader`, `already-confirmed` and the rest)."
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [bad-body, bad-action, bad-wallet, wallet-required, bad-amount, bad-recipient, recipient-not-found, not-an-nft, quote-required, quote-invalid, quote-expired, salt-required, unknown-order, order-not-open, not-eligible, wrong-phase, nothing-to-do, draft-not-found, terms-refused, steps-unavailable, bad-address, not-a-book, book-indexing, books-index-unavailable, books-state-unavailable]
        detail: { type: object, additionalProperties: true }
    BookStepsRequest:
      type: object
      description: "One act and the wallet that sends it. Each act takes its own fields beside `action` and `wallet`, and any other field is 400 `bad-body`."
      required: [action]
      properties:
        action:
          type: string
          enum: [arm, abort, graduate, bond, proposeTrade, confirmTrade, executeTrade, cancelOrder, revokeOrders, revokeAllowance, syncTax, syncTracked, stake, unstake, claim, harvest, sweepUnowned, sweepLeftover, redeem, claimCreatorCut]
          description: "The act. Who may send it is checked against the Book's phase and the wallet's role; [Ready-to-sign steps](/api/guides/steps) lists each act's sender."
        wallet: { $ref: "#/components/schemas/Address", description: "The wallet that sends the steps: a session's own wallet by default, which a session may override; an API key must name it (400 `wallet-required`)." }
        quote:
          type: object
          additionalProperties: true
          description: "`proposeTrade`, and `sweepLeftover` of a token other than WETH and the Book's own: Mancer's signed quote from `POST /v1/books/{token}/vault-quote`, unused, and at least 15 seconds from its deadline."
        token: { $ref: "#/components/schemas/Address", description: "`sweepLeftover` of WETH or the Book's own token, which sells nothing and carries no signature. `revokeAllowance`: the token whose order allowance is zeroed." }
        spender: { $ref: "#/components/schemas/Address", description: "`cancelOrder` and `revokeAllowance`: the order book the grant names, the deployment's first order spender by default." }
        orderHash: { $ref: "#/components/schemas/Hash", description: "`cancelOrder`: the granted order's hash." }
        tokens: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/Address" }, description: "`syncTracked`: the tokens to sync, the vault's tracked tokens by default." }
        amount: { type: string, description: "`stake`, `unstake` and `redeem`: raw units of the Book token, or `all` for what the wallet holds (or has staked)." }
    BookStepsResponse:
      allOf:
        - $ref: "#/components/schemas/ReadySteps"
        - type: object
          required: [action, book]
          properties:
            action: { type: string }
            book:
              type: object
              required: [token, bookId, factory, vault, phase]
              properties:
                token: { $ref: "#/components/schemas/Address" }
                bookId: { type: string }
                factory: { $ref: "#/components/schemas/Address" }
                vault: { $ref: "#/components/schemas/Address" }
                phase: { $ref: "#/components/schemas/BookPhase" }
    DraftOpenStepsRequest:
      type: object
      required: [terms]
      properties:
        wallet: { $ref: "#/components/schemas/Address", description: "The record's creator, who sends the open. A session's own wallet by default." }
        terms:
          type: object
          description: "`openBook`'s terms beside the record's name, ticker and factory. A zero economics field takes the raise contract's default, a zero `quote` is WETH, and `venue` 0 is Uniswap v3, 1 v4."
          required: [traders, durationSecs]
          properties:
            traders: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/Address" } }
            durationSecs: { type: integer, minimum: 0 }
            lpFeeMode: { type: integer, enum: [0, 1], description: 0 burns the pool's fees, 1 stakes them. }
            startMcapUsd8: { type: string, pattern: "^[0-9]+$" }
            gradMcapUsd8: { type: string, pattern: "^[0-9]+$" }
            startTaxBps: { type: integer, minimum: 0, maximum: 10000 }
            taxDecayPerMinBps: { type: integer, minimum: 0, maximum: 10000 }
            windowSecs: { type: integer, minimum: 0 }
            buysOnly: { type: boolean }
            bondAfterSecs: { type: integer, minimum: 0 }
            guaranteedBond: { type: boolean }
            quote: { $ref: "#/components/schemas/Address", description: The base pair, a listed one or WETH. }
            venue: { type: integer, enum: [0, 1] }
            hook: { $ref: "#/components/schemas/Address" }
    DraftOpenStepsResponse:
      allOf:
        - $ref: "#/components/schemas/ReadySteps"
        - type: object
          required: [draft, bind]
          properties:
            draft:
              type: object
              required: [id, factory, name, symbol]
              properties:
                id: { type: string }
                factory: { $ref: "#/components/schemas/Address" }
                name: { type: string }
                symbol: { type: string }
            bind:
              type: object
              description: "Once the wallet sends the open, name its hash here (`{txHash}`) so the record binds to the Book by its transaction."
              required: [method, path]
              properties:
                method: { type: string, enum: [PATCH] }
                path: { type: string }
    TransferStepsRequest:
      type: object
      required: [to, asset]
      properties:
        wallet: { $ref: "#/components/schemas/Address", description: "The wallet that sends. A session's own by default; an API key names it." }
        to: { type: string, description: "The recipient: a whole address, or `@username` for the wallet that holds it. No address, a checksum typo, the zero address, the sender and the asset's own contract are refused (`bad-recipient`)." }
        asset:
          oneOf:
            - { type: object, required: [kind], properties: { kind: { type: string, const: native } } }
            - { type: object, required: [kind, token], properties: { kind: { type: string, const: erc20 }, token: { $ref: "#/components/schemas/Address" } } }
            - { type: object, required: [kind, collection, tokenId], properties: { kind: { type: string, const: nft }, collection: { $ref: "#/components/schemas/Address" }, tokenId: { type: string, pattern: "^[0-9]+$" } } }
        amount: { type: string, pattern: "^[0-9]+$", description: "Raw units: required for ether (wei) and a token. An ERC-721 piece moves whole, by the three-argument `safeTransferFrom`; an ERC-1155 sends 1 by default." }
    TransferStepsResponse:
      allOf:
        - $ref: "#/components/schemas/ReadySteps"
        - type: object
          required: [warnings]
          properties:
            warnings: { type: array, items: { type: string } }
    Address:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      description: A 20-byte hex address.
      example: "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
    Hash:
      type: string
      pattern: "^0x[0-9a-fA-F]{64}$"
      description: A 32-byte hex hash.
    Hex:
      type: string
      pattern: "^0x[0-9a-fA-F]*$"
    Uint:
      type: string
      pattern: "^[0-9]+$"
      description: An unsigned integer as a decimal string, in the token's smallest unit.
      example: "100000000000000000"
    TxNetFlows:
      type: array
      items:
        type: object
        required: [token, amountRaw, amount, usd]
        properties:
          token: { $ref: "#/components/schemas/Address" }
          amountRaw: { $ref: "#/components/schemas/Uint" }
          amount: { type: [number, "null"] }
          usd: { type: [number, "null"] }
    Error:
      type: object
      description: Every answer that is not a success. A route's own fields stay beside these (a refused quote's `quote`, a refusal's `detail`).
      required: [error, code, retryable]
      additionalProperties: true
      properties:
        error: { type: string, description: "A sentence naming what was wrong. Show it; branch on `code`." }
        code: { $ref: "#/components/schemas/ErrorCode" }
        retryable: { type: boolean, description: "Whether the same request, sent again unchanged after `Retry-After`, may succeed. An unexpected error is retryable for a read, or for a write that carries an `Idempotency-Key`." }
        retryAfterSeconds: { type: integer, minimum: 0, description: "The `Retry-After` header's seconds, where the answer carries one: every 429 and every 503." }
        bucket:
          type: string
          description: "On a 429 `rate-limited`, the bucket that refused."
          enum: [key, key-account, session, ip, ip-ceiling, art, estimate, build, build-ceiling, auth, discover, discover-ceiling, account-write, follow-write, user-search, user-lookup, user-follows, username-check, steps]
        detail: { type: object, additionalProperties: true, description: "What the refusal names, by code." }
