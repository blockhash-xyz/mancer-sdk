        "200":
          description: The profile as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookProfileResponse" }
        "400": { description: "`bad-address`, `bad-body`, `unknown-field`, `description-length`, `description-lines`, `description-blank`, `description-link`, `bad-website`, `website-social`, `bad-x`, `bad-telegram`, `bad-targets`, `target-duplicate`, `target-own-token`, `targets-required`, `target-unknown` or `target-unverified`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`not-the-creator`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409": { description: "`targets-locked` or `profile-field-held`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/profile/logo:
    put:
      tags: [Books]
      summary: Upload a Book's logo
      operationId: putBookLogo
      security:
        - { bearer: [] }
      description: |-
        Sets the Book's logo from the image the body carries and answers the profile; the logo is written again as a WebP, at most 640 pixels on its long side.
