              properties:
                txHash: { $ref: "#/components/schemas/Hash", description: "The open's transaction hash." }
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDraftResponse" }
        "400": { description: "`bad-body` or `bad-tx-hash`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`draft-not-found`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`draft-deployed` or `tx-taken`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
