        "503": { description: "`books-index-unavailable`. See [Books errors](/api/guides/books/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/BooksError" } } } }
    delete:
      tags: [Books]
      summary: Delete a saved Book
      operationId: deleteBookDraft
      security:
        - { bearer: [] }
      description: |-
        Deletes a Book saved by `POST /v1/books/drafts` that no deployed Book has taken, so no later open takes it.
        The session of the wallet that saved it alone.
        Send it when the wallet declines the open; a deployed record is the Book's and stays.
      parameters:
        - name: id
          in: path
          required: true
          description: "The record's `id`."
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`draft-not-found`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`draft-deployed`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`books-index-unavailable`. See [Books errors](/api/guides/books/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/BooksError" } } } }
  /v1/books/drafts/{id}/logo:
    put:
      tags: [Books]
      summary: Upload a saved Book's logo
      operationId: putBookDraftLogo
      security:
        - { bearer: [] }
      description: |-
        Sets the logo of a Book saved by `POST /v1/books/drafts`, held to every rule a Book's logo is, and answers the record.
        The session of the wallet that saved it alone.
