        "400": { description: "`bad-address`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/BooksError" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`not-the-creator`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`not-a-book` or `logo-not-found`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/BooksError" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/vote:
    put:
      tags: [Books]
      summary: Vote on a Book
      operationId: putBookVote
      security:
        - { bearer: [] }
      description: |-
        Sets the vote of the session's profile, with a thesis or none, replacing its earlier vote whole, and answers the Book's counts and that vote.
        The profile must carry Mancer's verified mark, but for the Book's creator and the traders who acted.
