        "503": { description: "`store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/nfts/{collection}/{tokenId}:
    get:
      tags: [NFTs]
      summary: Get an NFT
      operationId: getNft
      security: []
      description: "One piece: its name, picture and traits, its largest owners, its OpenRarity rank, its market and its last 50 moves. `pending` true means ask again. Each key, session or (with neither) client address has 5 reads a second, a burst of 30, shared with `getNftCollection`."
      parameters:
        - name: collection
          in: path
          required: true
          description: The collection's contract.
          schema: { $ref: "#/components/schemas/Address" }
        - name: tokenId
          in: path
          required: true
          description: The piece's id as a decimal integer, no leading zeros.
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nft" }
        "400": { description: "`bad-collection` or `bad-token-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`nft-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable` or `store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/nfts/{collection}/{tokenId}/image:
    get:
      tags: [NFTs]
      summary: Get an NFT's picture
      operationId: getNftImage
      security: []
      description: "The piece's picture from its own metadata: a raster image, or an SVG read from the chain or IPFS, served under a policy that runs no script. A large static raster may come as a WebP that fits 640 by 640. Each key, session or (with neither) client address has 20 a second, a burst of 150."
      parameters:
        - name: collection
          in: path
          required: true
          description: The collection's contract.
          schema: { $ref: "#/components/schemas/Address" }
        - name: tokenId
          in: path
          required: true
          description: The piece's id as a decimal integer, no leading zeros.
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        - name: v
          in: query
          description: "The picture's version, as the piece's `image` path names it."
          schema: { type: string }
      responses:
        "200":
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "400": { description: "`bad-collection` or `bad-token-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`no-image`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`not-read-yet`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/fx:
    get:
      tags: [Market data]
      summary: "Get display-currency rates"
      operationId: getFx
      security: []
      description: "USD multipliers for display currencies, from the rates the ECB publishes. Display only, never a quote."
      responses:
        "200":
          description: Rates against USD.
          content:
            application/json:
              schema:
                type: object
                required: [base, rates, at, date, stale, currencies]
                properties:
                  base: { type: string, enum: [USD] }
                  rates:
                    type: object
                    description: Code to USD multiplier. USD is always present and always 1.
                    additionalProperties: { type: number }
                  at: { type: integer, description: "When the set was fetched, in milliseconds." }
                  date: { type: [string, "null"], description: "The ECB publication date the rates belong to." }
                  stale: { type: boolean, description: "True when a persisted set could not be refreshed." }
                  currencies:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        symbol: { type: string }
                        locale: { type: string }
  /v1/prices:
    get:
      tags: [Market data]
      summary: "Get token prices"
      operationId: getPrices
      security: []
      description: "USD prices of the 5,000 tokens with the most day volume, keyed by address, with the figures a token list shows beside each."
      responses:
        "200":
          description: The price rail.
          content:
            application/json:
              schema:
                type: object
                required: [prices, count, source]
                properties:
                  count: { type: integer }
                  source: { type: string, enum: [indexer] }
                  prices:
                    type: object
                    additionalProperties:
                      type: object
                      required: [price, symbol, name, decimals, isStock]
                      properties:
                        price: { type: number, description: "USD." }
                        priceConfidence: { type: [string, "null"] }
                        priceDepthUsd: { type: [number, "null"] }
                        change24h: { type: [number, "null"], description: "Percent." }
                        symbol: { type: string }
                        name: { type: string }
                        decimals: { type: integer }
                        isStock: { type: boolean }
                        depthUsd: { type: [number, "null"] }
                        volume24h: { type: [number, "null"] }
                        marketCapUsd: { type: [number, "null"] }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/stats/routed:
    get:
      tags: [Market data]
      summary: "Get routed trading stats"
      operationId: getRoutedStats
      security: []
      description: "Daily and all-time totals of trades settled through Mancer's router, by source (`swap`, `split`, `order`). Dollar totals are estimates anchored on USDG at $1 and count priced events alone; `unpricedFees` and `unpricedVolume` count the rest."
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Aggregates and indexing status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutedStats" }
