        "503": { description: "`store-unavailable` or `store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/tokens/{address}/kol-marks:
    get:
      tags: [Tokens]
      summary: List named traders' trades in a token
      operationId: getTokenKolMarks
      security: []
      description: "The trades of Mancer's curated named wallets in one token over the last `days`, newest first, for marking a chart. `since` is how far back the page reaches; where `truncated` is true, older marks may exist that the page does not hold."
      parameters:
        - name: address
          in: path
          required: true
          description: The token.
          schema: { $ref: "#/components/schemas/Address" }
        - name: days
          in: query
          description: How many days back to read. A value out of range reads as its nearest bound.
          schema: { type: number, minimum: 1, maximum: 90, default: 30 }
        - name: limit
          in: query
          description: The most marks the page carries. A value out of range reads as its nearest bound.
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: The marks.
          content:
            application/json:
              schema:
                type: object
                required: [count, marks, since, truncated, source]
                properties:
                  count: { type: integer }
                  marks:
                    type: array
                    items: { $ref: "#/components/schemas/TokenKolMark" }
                  since: { type: integer, description: "Unix seconds the page reaches back to: the start of `days` when it was read whole, the oldest mark's time when `limit` ended it." }
                  truncated: { type: boolean, description: "True where the read ran out of time before `days` was read whole: `since` is then later than the start of `days`." }
                  source: { type: string, enum: [indexer] }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/tokens/{address}/windows:
    get:
      tags: [Tokens]
      summary: "Get a token's trading windows"
      operationId: getTokenWindows
      security: []
      description: "A token's trading over the last 5 minutes, hour, 6 hours and day, across every pool it trades in: its swaps by side, their dollar volumes, and the wallets behind them. They are read at most once in 30 seconds a token and may be up to two minutes old: `asOf` names the second they were read."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The windows.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenWindowsResponse" }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-busy` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/tokens/{address}/holders/pnl:
    get:
      tags: [Tokens]
      summary: "List a token's holders with their PnL"
      operationId: getTokenHoldersPnl
      security: []
      description: "A token's largest holders, each with its balance, its share of the supply, its worth and what it made on the token at average cost. Holders are read once in five minutes a token; worth and unrealized are priced as asked. A pool or contract carries a `label` and no `pnl`."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          description: How many holders, largest first. A value out of range reads as its nearest bound.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: The holders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenHoldersPnlResponse" }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`unknown-token`: no token the index knows has this address. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-busy` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/tokens/{address}/traders:
    get:
      tags: [Tokens]
      summary: "List a token's top traders"
      operationId: getTokenTraders
      security: []
      description: "Up to 100 wallets that traded a token over the last day or week, ranked by what their trades in the window made, or by what they bought or sold. A sale of tokens held from before the window makes no PnL and is told apart (`soldFromBefore`). Wrapped ether and dollar tokens answer `available: false`."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: window
          in: query
          description: "`1d` reads the last 24 hours, `7d` the last 7 days."
          schema: { type: string, enum: ["1d", "7d"], default: "1d" }
        - name: sort
          in: query
          description: "`pnl` ranks by `pnlUsd` (realized where it is null), `bought` and `sold` by the dollars bought or sold in the window."
          schema: { type: string, enum: [pnl, bought, sold], default: pnl }
      responses:
        "200":
          description: The traders, or why the token has none here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenTradersResponse" }
        "400": { description: "`bad-address` or `bad-query`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`unknown-token`: no token the index knows has this address. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-busy` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/tokens/setups:
    get:
      tags: [Tokens]
      summary: Search tokens for a chart setup
      operationId: searchTokenSetups
      security: []
      description: "The tokens among the 2,000 with the most 24-hour volume whose completed candles show a setup now: a Fib pullback, a breakout and retest, or a moving-average reclaim. Every filter is named once, and an unknown or malformed one is refused. It pays the `discover` bucket beside the caller's own."
      parameters:
        - name: setup
          in: query
          description: "The setup: a pullback into a Fib retracement band, a close above a prior 20-candle closing high and a retest of it, or a reclaim of a simple moving average."
          schema: { type: string, enum: [fib-pullback, breakout-retest, ma-reclaim], default: fib-pullback }
        - name: timeframe
          in: query
          description: Each candle's length in seconds.
          schema: { type: integer, enum: [900, 3600, 14400, 43200, 86400], default: 43200 }
        - name: lookbackBars
          in: query
          description: How many completed candles are read. By default 24 at a day, 48 at 12 hours and 96 at the shorter timeframes.
          schema: { type: integer, minimum: 24, maximum: 240 }
        - name: minVolume24hUsd
          in: query
          description: The least 24-hour volume in dollars a token needs.
          schema: { type: number, minimum: 0, maximum: 1000000000000, default: 50000 }
        - name: minRallyPct
          in: query
          description: "Fib setups: the least rise from the swing low to the swing high, in percent."
          schema: { type: number, minimum: 0, maximum: 100000, default: 30 }
        - name: retracementMin
          in: query
          description: "Fib setups: the band's shallow edge, in percent of the rise given back. It must be under `retracementMax`."
          schema: { type: number, minimum: 0, maximum: 100, default: 50 }
        - name: retracementMax
          in: query
          description: "Fib setups: the band's deep edge, in percent of the rise given back."
          schema: { type: number, minimum: 0, maximum: 100, default: 78.6 }
        - name: tolerancePct
          in: query
          description: "In percent: the band around a breakout's prior high, how far above its average a reclaim may close, and how far past the Fib band a `base` may stand."
          schema: { type: number, minimum: 0.1, maximum: 10, default: 2 }
        - name: maPeriod
          in: query
          description: "`ma-reclaim`: the moving average's length in candles. `lookbackBars` must be at least this plus 2."
          schema: { type: integer, minimum: 5, maximum: 100, default: 20 }
        - name: verifiedOnly
          in: query
          description: "`true` keeps verified tokens and issued stocks alone."
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: fibStage
          in: query
          description: "`fib-pullback`: the stage to find. `in-zone` is the latest close inside the band; `base`, `higher-lows`, `breakout` and `bounce` follow a visit to it."
          schema: { type: string, enum: [in-zone, base, higher-lows, breakout, bounce], default: in-zone }
        - name: maxBarsSinceTouch
          in: query
          description: "Every Fib stage but `in-zone`: the most candles since the band or the level was first touched."
          schema: { type: integer, minimum: 3, maximum: 200, default: 36 }
        - name: baseBars
          in: query
          description: "`base`: how many latest closes make the base."
          schema: { type: integer, minimum: 3, maximum: 40, default: 5 }
        - name: baseMaxRangePct
          in: query
          description: "`base`: the widest the base's closes may span, in percent of the lowest of them."
          schema: { type: number, minimum: 0.1, maximum: 100, default: 8 }
        - name: pivotBars
          in: query
          description: "`higher-lows`, `breakout` and `fibConfluence`: the strictly higher closes a pivot low needs on each side."
          schema: { type: integer, minimum: 1, maximum: 5, default: 2 }
        - name: higherLowCount
          in: query
          description: "`higher-lows` and `breakout`: how many rises between confirmed pivot lows."
          schema: { type: integer, minimum: 1, maximum: 4, default: 2 }
        - name: minHigherLowPct
          in: query
          description: "`higher-lows` and `breakout`: the least each pivot low rises over the one before, in percent."
          schema: { type: number, minimum: 0.1, maximum: 20, default: 1 }
        - name: breakoutLookback
          in: query
          description: "`breakout`: the candles before it whose highest close the breakout must clear."
          schema: { type: integer, minimum: 3, maximum: 60, default: 10 }
        - name: breakoutBufferPct
          in: query
          description: "`breakout`: how far above that closing high the breakout must close, in percent."
          schema: { type: number, minimum: 0, maximum: 10, default: 1 }
        - name: volumeLookback
          in: query
          description: "`breakout`: the candles before it whose mean volume is the baseline."
          schema: { type: integer, minimum: 3, maximum: 100, default: 20 }
        - name: minRelativeVolume
          in: query
          description: "`breakout`: the least the breakout candle's volume may be over that baseline."
          schema: { type: number, minimum: 0.1, maximum: 100, default: 1.5 }
        - name: fibConfluence
          in: query
          description: "Fib setups: `true` also requires a second band, from an earlier confirmed low to the same high, within `confluenceTolerancePct`. Not with `bounce`."
          schema: { type: string, enum: ["true", "false"], default: "false" }
        - name: confluenceTolerancePct
          in: query
          description: The most gap between the two bands, in percent of the first band's midpoint.
          schema: { type: number, minimum: 0.1, maximum: 10, default: 2 }
        - name: tokenAddress
          in: query
          description: "One token alone, and the answer carries `inspection`. Empty for the ranked tokens."
          schema: { type: string, pattern: "^$|^0x[0-9a-fA-F]{40}$", default: "" }
        - name: bounceBasis
          in: query
          description: "`bounce`: read the swing and the touch by the candles' wicks or by their closes."
          schema: { type: string, enum: [wick, close], default: wick }
        - name: bounceLevelPct
          in: query
          description: "`bounce`: the Fib level, in percent of the rise given back."
          schema: { type: number, minimum: 1, maximum: 99.9, default: 88.6 }
        - name: bounceTolerancePct
          in: query
          description: "`bounce`: how near the level the touch must be, in percent of the level's price."
          schema: { type: number, minimum: 0.1, maximum: 10, default: 1 }
        - name: minBouncePct
          in: query
          description: "`bounce`: how far above the level a confirming close must be, in percent."
          schema: { type: number, minimum: 0.1, maximum: 100, default: 5 }
        - name: bounceConfirmBars
          in: query
          description: "`bounce`: how many latest closes must confirm."
          schema: { type: integer, minimum: 1, maximum: 5, default: 1 }
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenSetupsResponse" }
        "400": { description: "`bad-query` or `bad-request`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`search-busy` or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`search-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/balances:
    get:
      tags: [Wallets]
      summary: "List a wallet's balances"
      operationId: getWalletBalances
      security: []
      description: "Every positive balance the wallet holds (ERC-20, ERC-721 and ERC-1155), read from every transfer on the chain, largest first. Balances are exact integers as strings: scale them by `decimals` where present."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Balances.
          content:
            application/json:
              schema:
                type: object
                required: [address, count, balances]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  count: { type: integer }
                  balances:
                    type: array
                    items:
                      type: object
                      required: [token, tokenId, balance, lastBlock]
                      properties:
                        token: { $ref: "#/components/schemas/Address" }
                        tokenId: { type: string, description: "0 for ERC-20; the id for ERC-721 and ERC-1155." }
                        balance: { type: string, description: "Exact integer, unscaled." }
                        balanceSource:
                          type: string
                          enum: [ledger, chain]
                          description: "`ledger`: the sum of the token's transfers. `chain`: read from the contract, for a token whose transfers were found not to describe its balances."
                        verdict: { type: string, description: "Whether the token's transfers describe its balances (`conforming`, `nonconforming` or `mixed`), where that was checked." }
                        lastBlock: { type: integer }
                        symbol: { type: string }
                        name: { type: string }
                        decimals: { type: integer }
                        isStock: { type: boolean }
                        book: { $ref: "#/components/schemas/BookFlag", description: "A Book token: its Book. Absent on every other token." }
                        bookNft: { $ref: "#/components/schemas/BookNftFlag", description: "A Book NFT market's collection: its Book. Absent on every other collection." }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/positions:
    get:
      tags: [Wallets]
      summary: "List a wallet's liquidity positions"
      operationId: getWalletPositions
      security: []
      description: "The concentrated-liquidity position NFTs the wallet owns with live liquidity, most recently changed first: each with its pool, range and liquidity, its exact amounts at the pool's price, whether the price is in range, and a USD value."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Positions.
          content:
            application/json:
              schema:
                type: object
                required: [address, count, positions]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  count: { type: integer }
                  positions:
                    type: array
                    items:
                      type: object
                      required: [manager, tokenId, pool, family, token0, token1, fee, tickSpacing, tickLower, tickUpper, liquidity, currentTick, inRange, amount0, amount1, valueUsd, lastBlock, asOf]
                      properties:
                        manager: { $ref: "#/components/schemas/Address", description: "The position manager that minted the NFT." }
                        tokenId: { type: string }
                        pool: { type: string, description: "The pool's address, or its id for a pool-manager venue." }
                        family: { type: string, example: v3 }
                        token0:
                          type: object
                          required: [address]
                          properties:
                            address: { $ref: "#/components/schemas/Address" }
                            symbol: { type: string }
                            decimals: { type: integer }
                        token1:
                          type: object
                          required: [address]
                          properties:
                            address: { $ref: "#/components/schemas/Address" }
                            symbol: { type: string }
                            decimals: { type: integer }
                        fee: { type: integer, description: "Pips (1e-6)." }
                        tickSpacing: { type: integer }
                        tickLower: { type: integer }
                        tickUpper: { type: integer }
                        liquidity: { type: string, description: "Exact integer, unscaled." }
                        currentTick: { type: integer, nullable: true, description: "The pool's tick at `asOf`; null before the pool has a state." }
                        inRange: { type: boolean, nullable: true }
                        amount0: { type: string, nullable: true, description: "Exact integer in token0, unscaled, at the pool's current price." }
                        amount1: { type: string, nullable: true }
                        valueUsd: { type: number, nullable: true, description: "The amounts in USD, counting a side only where its token has $1,000 of 2% depth across its pools, each worth at most 100 times that depth. Null where neither side counts." }
                        lastBlock: { type: integer }
                        asOf: { type: integer, nullable: true, description: "The block the pool state is exact at." }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/swaps:
    get:
      tags: [Wallets]
      summary: List a wallet's trades
      operationId: getWalletSwaps
      security: []
      description: "The wallet's priced trades, newest first, a row a transaction, sent by it or not; `token` keeps one token's. A short or empty page may still name `nextBefore`: pass it as `before` until it is null. Each key, session or (with neither) client address has one page a second, a burst of 20."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          description: The most trades the page carries. A value out of range reads as its nearest bound.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: "A page's `nextBefore`, as this route wrote it. The page holds the trades older than that page, and no transaction is split between two pages. Omit it for the newest page."
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,256}$" }
        - name: token
          in: query
          description: "The trades in which this token was either side, bought, sold or paid with. Native ether (the zero address) is `bad-token`."
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: A page of the wallet's trades.
          content:
            application/json:
              schema:
                type: object
                required: [address, swaps, source, nextBefore]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  swaps:
                    type: array
                    items: { $ref: "#/components/schemas/WalletTrade" }
                  source: { type: string, enum: [indexer] }
                  nextBefore: { type: [string, "null"], description: "The cursor of the next older page, opaque. Null once the wallet's history ends." }
        "400": { description: "`bad-address`, `bad-cursor` or `bad-token`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-busy` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/pnl:
    get:
      tags: [Wallets]
      summary: "Get a wallet's profit and loss"
      operationId: getWalletPnl
      security: []
      description: "Per token, the wallet's cost basis at average cost and its realized and unrealized profit, each transfer priced at its day's close. Only tokens with $1,000 of 2% depth and known decimals count. Native ether is one row under the zero address, at wrapped ether's close, with no cost or profit."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: Profit and loss.
          content:
            application/json:
              schema:
                type: object
                required: [address, source, totals, tokens, truncated]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  source: { type: string, enum: [indexer] }
                  truncated: { description: "The wallet has more than 90,000 transfer rows; the figures cover the first 90,000.", type: boolean }
                  nativeUnread: { description: "Present and true where the wallet's native ether did not read: no row of it, and `totals.valueUsd` is its tokens alone.", type: boolean }
                  totals:
                    type: object
                    required: [costBasisUsd, valueUsd, unrealizedUsd, realizedUsd]
                    properties:
                      costBasisUsd: { type: number }
                      valueUsd: { type: number, description: "The tokens' value and the native ether's. The cost and the profits are the tokens' alone." }
                      unrealizedUsd: { type: number }
                      realizedUsd: { type: number }
                  tokens:
                    type: array
                    items:
                      type: object
                      required: [token, balance, costBasisUsd, valueUsd, unrealizedUsd, realizedUsd, avgCostUsd, estimated, firstDay]
                      properties:
                        token: { $ref: "#/components/schemas/Address" }
                        symbol: { type: string }
                        decimals: { type: integer }
                        balance: { type: string, description: "Exact integer held now, unscaled." }
                        costBasisUsd: { type: number }
                        valueUsd: { type: number, nullable: true }
                        unrealizedUsd: { type: number, nullable: true }
                        realizedUsd: { type: number }
                        avgCostUsd: { type: number, nullable: true, description: "Average cost of one whole token while the balance is positive." }
                        estimated: { description: "A transfer came before the token's first price and was priced at its first close.", type: boolean }
                        firstDay: { type: string, description: "The day of the token's first transfer, YYYY-MM-DD. Empty for native ether, whose transfers no log names." }
                        native: { type: boolean, description: "Present and true on the native ether row (the zero address): its balance read from the chain now, `unrealizedUsd` and `avgCostUsd` null." }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/history:
    get:
      tags: [Wallets]
      summary: "Get a wallet's value over time"
      operationId: getWalletHistory
      security: []
      description: "The wallet's ERC-20 holdings and native ether valued each UTC day over the last `days`, at that day's closes. A token counts with $1,000 of 2% depth and is worth at most 100 times it. A first view reads the ether's past days a few a second: while `native.partial` is true, ask again."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        "200":
          description: One point per day and the holdings at the end of the window.
          content:
            application/json:
              schema:
                type: object
                required: [address, days, source, points, tokens]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  days: { type: integer }
                  source: { type: string, enum: [indexer] }
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        t: { type: integer, description: The day's start, Unix seconds. }
                        valueUsd: { type: number, description: "The tokens' value and `nativeUsd` where it is a number." }
                        nativeUsd: { type: number, nullable: true, description: "The native ether at the day's last block (today's: now) at wrapped ether's close. Null where it is not read yet or did not read." }
                  tokens:
                    type: array
                    items:
                      type: object
                      properties:
                        token: { $ref: "#/components/schemas/Address" }
                        symbol: { type: string }
                        decimals: { type: integer }
                        balance: { type: string, description: "Exact integer, unscaled." }
                        valueUsd: { type: number, nullable: true }
                        native: { type: boolean, description: "Present and true on the native ether row, under the zero address." }
                  native:
                    type: object
                    description: "What the answer read of the wallet's native ether."
                    required: [missing, partial, unread]
                    properties:
                      missing: { type: integer, description: "Points whose `nativeUsd` is null: their value is the wallet's tokens alone." }
                      partial: { type: boolean, description: "Some of them are being read now. The same request a few seconds on answers more of them." }
                      unread: { type: boolean, description: "Some of them could not be read now (a read upstream failed). Asking again later may answer them." }
        "400":
          description: "`bad-address`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`store-unavailable`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/wallets/{address}/nfts/{collection}:
    get:
      tags: [Wallets]
      summary: "List a wallet's pieces of a collection"
      operationId: getWalletNfts
      security: []
      description: "The token ids of one ERC-721 or ERC-1155 collection the wallet holds, lowest first, with `indexedBlock`, the block every transfer is read through. Use it for one collection rather than `balances`, which lists 500 tokens at the most."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: collection
          in: path
          required: true
          description: The collection's contract.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The pieces held.
          content:
            application/json:
              schema:
                type: object
                required: [address, collection, count, tokens, indexedBlock, truncated]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  collection: { $ref: "#/components/schemas/Address" }
                  count: { type: integer, description: "How many token ids are in `tokens`." }
                  tokens:
                    type: array
                    items:
                      type: object
                      required: [tokenId, balance, lastBlock]
                      properties:
                        tokenId: { type: string }
                        balance: { type: string, description: "How many of the id the wallet holds: 1 for an ERC-721, any count for an ERC-1155." }
                        lastBlock: { type: integer, description: "The block of the last transfer of the id that touched the wallet." }
                  indexedBlock: { type: integer, nullable: true, description: "The block every transfer of the collection is read through; null where it could not be read." }
                  truncated: { type: boolean, description: "True when the wallet holds more than 10,000 ids of the collection; the answer carries the lowest 10,000." }
        "400": { description: "`bad-address` or `bad-collection`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/collectibles:
    get:
      tags: [Wallets]
      summary: "List a wallet's NFTs"
      operationId: getWalletCollectibles
      security: []
      description: "The wallet's NFTs by collection, a page at a time: each piece with its name, picture, rarity rank and best live offer (`offerKind`), each collection with OpenSea's verification and floor. Each key, session or (with neither) client address has two pages a second, a burst of 20."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          description: The most pieces the page carries.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: perCollection
          in: query
          description: The most pieces of one collection the page carries, for a look across collections. By default every piece of each.
          schema: { type: integer, minimum: 1, maximum: 5000 }
        - name: offset
          in: query
          description: The pieces to pass over in the answer's order, the previous page's `nextOffset`.
          schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
        - name: collection
          in: query
          description: One collection's pieces alone. The values and `collections` still cover the whole wallet.
          schema: { $ref: "#/components/schemas/Address" }
        - name: q
          in: query
          description: "A search: across collections, a collection's name, symbol, OpenSea name or address prefix; with `collection`, a piece's name or a token id starting with its digits (`#12` or `12`)."
          schema: { type: string, maxLength: 64 }
        - name: sort
          in: query
          description: "The collections' order: most pieces first, most worth at offers first (the unpriced last), by name, or the default order with each collection's pieces rarest first."
          schema: { type: string, enum: [count, value, name, rarity], default: count }
        - name: verified
          in: query
          description: "`1` for the collections OpenSea verified alone."
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: The pieces, the wallet's collections, and their values at offers.
          content:
            application/json:
              schema:
                type: object
                required: [address, collectibles, pending, truncated, indexedBlock, total, nextOffset, collections, collectionsTotal, offerValueEth, offerValueUsd, pricedPieces, unpricedPieces]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  collectibles:
                    type: array
                    items:
                      type: object
                      required: [collection, tokenId, balance, standard, offer, offerUsd, offerKind]
                      properties:
                        collection: { $ref: "#/components/schemas/Address" }
                        collectionName: { type: [string, "null"], description: "The contract's own `name()`." }
                        collectionSymbol: { type: [string, "null"] }
                        collectionVerified: { type: [boolean, "null"], description: "OpenSea verified the collection; null where OpenSea has no word on it." }
                        collectionImage: { type: [string, "null"], description: "The API's path for the collection's picture." }
                        tokenId: { type: string }
                        balance: { type: string, description: "How many of the piece the wallet holds: 1 for an ERC-721, any count for an ERC-1155." }
                        standard: { type: string, enum: [erc721, erc1155] }
                        name: { type: [string, "null"], description: "The piece's name from its metadata." }
                        image: { type: [string, "null"], description: "The API's path for the piece's picture." }
                        rarityRank: { type: [integer, "null"], description: "The piece's rank in its collection by OpenRarity's method, 1 the rarest." }
                        offer: { type: [number, "null"], description: "The best live offer that covers the piece, one item's price in ether. Null where no offer covers it or its collection's offers are not read." }
                        offerUsd: { type: [number, "null"], description: "`offer` in dollars at ether's price." }
                        offerKind: { type: [string, "null"], enum: [item, trait, collection, null], description: "The kind of offer that set `offer`." }
                  pending: { type: integer, description: "Pieces of the page whose metadata was not read in time. They resolve behind the answer, for the next ask." }
                  truncated: { type: boolean, description: "The wallet holds pieces in scope that the page does not carry." }
                  indexedBlock: { type: [integer, "null"], description: "The block every transfer is read through." }
                  total: { type: integer, description: "The pieces in scope after the filters: the wallet's, or the one collection's." }
                  nextOffset: { type: [integer, "null"], description: "The `offset` of the next page; null on the last." }
                  collections:
                    type: array
                    description: Every collection the wallet holds after the filters, in the answer's order, 500 at the most.
                    items:
                      type: object
                      required: [collection, count, standard, floor, offers, collectionOffer, offerValueEth, pricedPieces]
                      properties:
                        collection: { $ref: "#/components/schemas/Address" }
                        collectionName: { type: [string, "null"] }
                        collectionSymbol: { type: [string, "null"] }
                        standard: { type: string, enum: [erc721, erc1155] }
                        count: { type: integer, description: "How many of its pieces the wallet holds." }
                        verified: { type: [boolean, "null"] }
                        image: { type: [string, "null"] }
                        banner: { type: [string, "null"] }
                        slug: { type: [string, "null"], description: "OpenSea's slug for the collection." }
                        openseaUrl: { type: [string, "null"] }
                        floor: { type: [number, "null"], description: "The collection's floor in ether. Shown as information, and not part of any value." }
                        floorUsd: { type: [number, "null"] }
                        offers:
                          type: string
                          enum: [read, unread, unlisted]
                          description: "`read`: valued from the collection's whole live market. `unread`: not valued, since its market is not read whole. `unlisted`: OpenSea knows no collection of the contract."
                        collectionOffer: { type: [number, "null"], description: "Its best live collection offer, one item's price in ether." }
                        collectionOfferUsd: { type: [number, "null"] }
                        offerValueEth: { type: [number, "null"], description: "The wallet's pieces of it at offers, in ether. Null where no offer covers any of them." }
                        offerValueUsd: { type: [number, "null"] }
                        pricedPieces: { type: integer, description: "How many of its pieces an offer covers." }
                  collectionsTotal: { type: integer, description: "The collections after the filters, the 500 cap aside." }
                  offerValueEth: { type: [number, "null"], description: "Those collections' pieces at offers, in ether. Null where no offer covers any piece." }
                  offerValueUsd: { type: [number, "null"], description: "`offerValueEth` in dollars at ether's price." }
                  pricedPieces: { type: integer, description: "How many of those pieces an offer covers." }
                  unpricedPieces: { type: integer, description: "How many of those pieces no offer covers, or whose collection's offers are not read." }
        "400": { description: "`bad-address`, `bad-page`, `bad-collection`, `bad-query` or `bad-request`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503": { description: "`store-unavailable` or `store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/wallets/{address}/nft-activity:
    get:
      tags: [Wallets]
      summary: List a wallet's NFT moves
      operationId: getWalletNftActivity
      security: []
      description: "Every move of an NFT into or out of the wallet, newest first, typed, named and priced where a sale paid for it; `collection` keeps one collection's. Pass `next` as `before` until it is null. Each key, session or (with neither) client address has two pages a second, a burst of 10."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          description: "The most moves the page carries, 1 to 4 digits; a value over 100 reads as 100."
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: "A page's `next`. Omit it for the newest page."
          schema: { type: string, pattern: "^\\d{1,12}\\.\\d{1,9}\\.\\d{1,5}\\.[01]\\.\\d{1,11}$" }
        - name: collection
          in: query
          description: One collection's moves alone, in the same order and by the same cursor.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: A page of the wallet's NFT moves.
          content:
            application/json:
              schema:
                type: object
                required: [address, events, next]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/WalletNftMove" }
                  next: { type: [string, "null"], description: "The `before` of the next older page; null on the last." }
        "400": { description: "`bad-address`, `bad-limit`, `bad-cursor` or `bad-collection`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable` or `store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/nft-collections/{address}:
    get:
      tags: [NFTs]
      summary: Get an NFT collection
      operationId: getNftCollection
      security: []
      description: "One NFT collection: its name and symbol, its owners and supply from its transfers, and OpenSea's verification, pictures, links, description, stats and best offer. Each key, session or (with neither) client address has 5 reads a second, a burst of 30, shared with `getNft`."
      parameters:
        - name: address
          in: path
          required: true
          description: The collection's contract.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NftCollection" }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`not-a-collection`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-unavailable` or `store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/nft-collections/{address}/image:
    get:
      tags: [NFTs]
      summary: Get an NFT collection's picture
      operationId: getNftCollectionImage
      security: []
      description: "The collection's picture as OpenSea names it, through Mancer: a raster image, or an SVG from OpenSea's own servers. A large static raster may come as a WebP that fits 640 by 640. Each key, session or (with neither) client address has 20 a second, a burst of 150."
      parameters:
        - name: address
          in: path
          required: true
          description: The collection's contract.
          schema: { $ref: "#/components/schemas/Address" }
        - name: v
          in: query
          description: "The picture's version, as the collection's `image` path names it."
          schema: { type: string }
      responses:
        "200":
          description: The picture.
          content:
            image/webp: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`no-image`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`store-busy`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/nft-collections/{address}/banner:
