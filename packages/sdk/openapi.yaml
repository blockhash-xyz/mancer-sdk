        "400": { $ref: "#/components/responses/BooksSigningBadBody" }
        "401": { $ref: "#/components/responses/BooksSigningUnauthorized" }
        "403":
          description: "`key-server-only`, `key-not-signing`, `not-a-trader`, `not-eligible-yet` or `not-an-eoa`. See [Books errors](/api/guides/books/errors)."
