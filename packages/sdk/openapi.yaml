          $ref: "#/components/responses/StoreUnavailable"
  /v1/market:
    get:
      tags: [Market data]
      summary: "Get US market hours"
      operationId: getMarketStatus
      security: []
      description: "Whether the US regular session is open now, for tokenized stocks."
      responses:
        "200":
          description: Session status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketStatus" }
  /v1/stream:
    get:
      tags: [Market data]
      summary: "Stream market events"
      operationId: getStream
      security: []
      description: "Server-sent events of market changes: one `price` per pool that traded and one `candle` per token whose chart moved, at most one a subject a second. An event is the signal to read the JSON again, not a price. See [Streaming](/api/guides/streaming)."
      parameters:
        - name: kinds
          in: query
          description: "Comma-separated event kinds. The stream emits `price` and `candle`; other names deliver nothing."
          schema: { type: string }
        - name: keys
          in: query
          description: Comma-separated subjects (token or pool ids).
          schema: { type: string }
        - name: since
          in: query
          description: Resume after this sequence number. `Last-Event-ID` does the same.
          schema: { type: integer }
      responses:
        "429": { description: "`too-many-streams`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/venues/factories:
    get:
      tags: [Market data]
      summary: "List the venues' pool factories"
      operationId: getVenueFactories
      security: []
      description: "Every pool factory Mancer knows, each with the venue id this API names its pools by. Answers are shared for ten minutes."
      responses:
        "200":
          description: The factories.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueFactoriesResponse" }
  /v1/swaps:
    get:
      tags: [Live]
      summary: "List the chain's latest swaps"
      operationId: getSwaps
      security: []
      description: "The latest priced swaps on the chain across every token and venue, newest first, each with both tokens' symbols, its venue and its own maker (`trader`). Answers are shared for two seconds, so polling faster gains nothing."
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: The swaps.
          content:
            application/json:
              schema:
                type: object
                required: [swaps, source]
                properties:
                  swaps:
                    type: array
                    items:
                      type: object
                      required: [id, txHash, logIndex, blockNumber, timestamp, token, tokenSymbol, cash, cashSymbol, pool, venue, side, amountToken, amountCash, priceUsd, volumeUsd, trader]
                      properties:
                        id: { type: string, description: "txHash:logIndex, stable across polls." }
                        txHash: { $ref: "#/components/schemas/Hash" }
                        logIndex: { type: integer }
                        blockNumber: { type: string }
                        timestamp: { type: integer, description: "Unix seconds." }
                        token: { $ref: "#/components/schemas/Address" }
                        tokenSymbol: { type: [string, "null"] }
                        cash: { $ref: "#/components/schemas/Address", description: "The pool's other side; native ETH is the zero address." }
                        cashSymbol: { type: [string, "null"] }
                        pool: { type: string }
                        venue: { type: string }
                        side: { type: string, enum: [buy, sell] }
                        amountToken: { type: [number, "null"] }
                        amountCash: { type: [number, "null"] }
                        priceUsd: { type: number }
                        volumeUsd: { type: number }
                        trader:
                          oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }]
                          description: "Who made the swap: its payer, whose money paid for it, as `/v1/transactions/{hash}` names each swap's `maker`; where the transaction is not read yet, its sender. Null only on a token's fee (`fee`)."
                        sender:
                          $ref: "#/components/schemas/Address"
                          description: "The transaction's sender. Absent on a token's fee."
                        fee:
                          type: boolean
                          enum: [true]
                          description: "Present where the swap is a token's own fee traded inside someone else's trade: nobody's swap, so `trader` is null. Its price and volume stay in the market's data."
                        deliveredTo:
                          $ref: "#/components/schemas/Address"
                          description: "Where what the swap bought went, where that is a wallet other than its trader (a solver's customer, a recipient the buyer named)."
                        solver:
                          type: boolean
                          enum: [true]
                          description: "Present where the trader is a solver's float that filled another's purchase with its own money."
                        purpose:
                          type: string
                          enum: [liquidity-add, liquidity-remove, liquidity-move]
                          description: "Present where the swap was a step of no trade of its owner's: liquidity added (a zap swaps part of a deposit), removed, or moved. Absent for a trade."
                  source: { type: string, enum: [indexer] }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/swaps/pulse:
    get:
      tags: [Live]
      summary: "Get the chain's last minute"
      operationId: getSwapPulse
      security: []
      description: "The last sixty seconds in three figures: swaps, transactions and their dollar volume."
      responses:
        "200":
          description: The pulse.
          content:
            application/json:
              schema:
                type: object
                required: [swaps, transactions, volumeUsd, asOf, source]
                properties:
                  swaps: { type: integer }
                  transactions: { type: integer }
                  volumeUsd: { type: number }
                  asOf: { type: integer, description: "Unix seconds." }
                  source: { type: string, enum: [indexer] }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/map:
    get:
      tags: [Live]
      summary: "Get the token map"
      operationId: getMap
      security: []
      description: "The tokens with the most liquidity (`nodes`) and the pools between them (`edges`): each pair's pools summed by depth and named by venue. `size` sets how many tokens."
      parameters:
        - name: size
          in: query
          required: false
          description: How many tokens, in order of liquidity.
          schema: { type: integer, minimum: 20, maximum: 800, default: 400 }
      responses:
        "200":
          description: The map.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, edges, asOf, source]
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      required: [address, symbol, decimals, isStock, liquidityUsd, priceUsd, holders]
                      properties:
                        address: { $ref: "#/components/schemas/Address" }
                        symbol: { type: string }
                        decimals: { type: [integer, "null"] }
                        isStock: { type: boolean }
                        liquidityUsd: { type: number }
                        priceUsd: { type: [number, "null"] }
                        holders: { type: integer }
                  edges:
                    type: array
                    items:
                      type: object
                      required: [a, b, depthUsd, pools, venues]
                      properties:
                        a: { $ref: "#/components/schemas/Address", description: "The lower of the two addresses." }
                        b: { $ref: "#/components/schemas/Address" }
                        depthUsd: { type: number }
                        pools: { type: integer }
                        venues: { type: array, items: { type: string } }
                  asOf: { type: integer, description: "Unix seconds." }
                  source: { type: string, enum: [indexer] }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/transactions/{hash}:
    get:
      tags: [Transactions]
      summary: "Get a transaction's token flow"
      operationId: getTransaction
      security: []
      description: "How tokens moved in one transaction: every address it touches (`nodes`), every transfer in log order (`edges`), every swap on its pool with its maker, its owner and purpose, and the sender's net flows. A block not indexed yet answers `source: node` with the head and value alone: ask again shortly."
      parameters:
        - name: hash
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Hash" }
      responses:
        "200":
          description: The flow.
          content:
            application/json:
              schema:
                type: object
                required: [hash, block, timestamp, status, from, to, valueRaw, gasUsed, nodes, edges, swaps, tokens, origin, truncated, source, explorerUrl]
                properties:
                  hash: { $ref: "#/components/schemas/Hash" }
                  block: { type: string, description: "Decimal block number." }
                  timestamp: { type: [integer, "null"], description: "Unix seconds; null while the block is not indexed yet." }
                  status: { type: string, enum: [success, reverted, unknown] }
                  from: { $ref: "#/components/schemas/Address" }
                  to: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
                  valueRaw: { $ref: "#/components/schemas/Uint" }
                  gasUsed: { type: [string, "null"] }
                  nodes:
                    type: array
                    description: Every address the flow touches.
                    items:
                      type: object
                      required: [address, kind, label, venue, pair, layer]
                      properties:
                        address: { $ref: "#/components/schemas/Address" }
                        kind:
                          type: string
                          enum: [origin, address, pool, router, zero, weth]
                          description: "`origin` is the sender, `router` a Mancer contract or the Uniswap V4 PoolManager, `zero` the mint and burn address, `weth` the WETH contract."
                        label: { type: string }
                        venue: { type: [string, "null"] }
                        pair: { type: [string, "null"], description: "The pool's pair, or the pool count on the V4 PoolManager." }
                        layer: { type: integer, description: "The step at which the flow first reaches the address from the sender; the sender is 0." }
                  edges:
                    type: array
                    description: Every movement, in log order.
                    items:
                      type: object
                      required: [id, logIndex, kind, from, to, token, amountRaw, amount, usd, tokenId]
                      properties:
                        id: { type: string }
                        logIndex: { type: integer, description: "-1 for the transaction's own value, which is not a log." }
                        kind: { type: string, enum: [native, transfer, mint, burn, wrap, unwrap, nft] }
                        from: { $ref: "#/components/schemas/Address" }
                        to: { $ref: "#/components/schemas/Address" }
                        token: { $ref: "#/components/schemas/Address", description: "Native ETH is the zero address." }
                        amountRaw: { $ref: "#/components/schemas/Uint" }
                        amount: { type: [number, "null"], description: "Scaled by the token's decimals; null when they are unknown, or for an NFT." }
                        usd: { type: [number, "null"], description: "The movement's value at the token's current price; null where the token has no price." }
                        tokenId: { type: [string, "null"] }
                  swaps:
                    type: array
                    description: Every swap, on the pool that made it.
                    items:
                      type: object
                      required: [logIndex, venue, family, node, pool, poolId, pair, tokenIn, tokenOut, amountInRaw, amountOutRaw, amountIn, amountOut, usd, sender, recipient]
                      properties:
                        logIndex: { type: integer }
                        venue: { type: string }
                        family: { type: string }
                        node: { $ref: "#/components/schemas/Address", description: "The pool address, or the V4 PoolManager for a V4 hop." }
                        pool: { $ref: "#/components/schemas/Address" }
                        poolId: { type: [string, "null"] }
                        pair: { type: [string, "null"] }
                        tokenIn: { type: string, description: "Empty where the pool is not known." }
                        tokenOut: { type: string }
                        amountInRaw: { type: string }
                        amountOutRaw: { type: string }
                        amountIn: { type: [number, "null"] }
                        amountOut: { type: [number, "null"] }
                        usd: { type: [number, "null"], description: "The swap's value: its input at the current price, or its output when the input has none." }
                        sender: { $ref: "#/components/schemas/Address" }
                        recipient: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }] }
                        maker:
                          oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }]
                          description: "Who made the swap: its payer, whose money paid for it, as the tapes name it; where that is not read yet, the transaction's maker. Null on a token's own fee (`fee`)."
                        fee: { type: boolean, enum: [true], description: "Present where the swap is a token's own fee traded inside someone else's trade: nobody's swap." }
                        deliveredTo: { $ref: "#/components/schemas/Address", description: "Where what the swap bought went, where that is a wallet other than its maker." }
                        solver: { type: boolean, enum: [true], description: "Present where the maker is a solver's float that filled another's purchase out of its own money." }
                  makers:
                    type: array
                    description: Every address that made one of its swaps, the maker of the most swaps first. Present where the transaction swapped. A token's fee counts for none.
                    items: { $ref: "#/components/schemas/Address" }
                  tokens:
                    type: object
                    description: Symbol, decimals and current price by address for every token in the flow.
                    additionalProperties:
                      type: object
                      required: [address, symbol, decimals, priceUsd]
                      properties:
                        address: { $ref: "#/components/schemas/Address" }
                        symbol: { type: [string, "null"] }
                        decimals: { type: [integer, "null"] }
                        priceUsd: { type: [number, "null"], description: "The token's current price; null where it has none. ETH carries WETH's." }
                  origin:
                    type: object
                    description: The sender's net flows.
                    required: [sent, received]
                    properties:
                      sent: { $ref: "#/components/schemas/TxNetFlows" }
                      received: { $ref: "#/components/schemas/TxNetFlows" }
                  owner:
                    description: "Whose tokens the transaction moved, and `why`: the account a bundler sent it for, its sender, an order's maker, the one trader, or the one payer. Null where none is clear."
                    oneOf:
                      - type: object
                        required: [address, why]
                        properties:
                          address: { $ref: "#/components/schemas/Address" }
                          why: { type: string, enum: [sender, account, order-maker, trader, payer] }
                      - { type: "null" }
                  liquidity:
                    type: array
                    description: "Every change of a pool's liquidity, in log order. Amounts are given for pairs and V3 pools; a V4 change names its liquidity alone, and what moved is in the transfers."
                    items:
                      type: object
                      required: [logIndex, action, venue, family, pool, poolId, pair, sender, owner, token0, token1, amount0, amount1, liquidity, tickLower, tickUpper]
                      properties:
                        logIndex: { type: integer }
                        action: { type: string, enum: [add, remove] }
                        venue: { type: string }
                        family: { type: string }
                        pool: { $ref: "#/components/schemas/Address" }
                        poolId: { type: [string, "null"] }
                        pair: { type: [string, "null"] }
                        sender: { $ref: "#/components/schemas/Address" }
                        owner: { $ref: "#/components/schemas/Address" }
                        token0: { type: [string, "null"] }
                        token1: { type: [string, "null"] }
                        amount0: { type: [number, "null"] }
                        amount1: { type: [number, "null"] }
                        liquidity: { type: string, description: "The liquidity's own change, raw and signed." }
                        tickLower: { type: [integer, "null"] }
                        tickUpper: { type: [integer, "null"] }
                  purpose:
                    oneOf: [{ type: string, enum: [liquidity-add, liquidity-remove, liquidity-move] }, { type: "null" }]
                    description: "What the transaction did for its owner where it was no trade: liquidity added (the owner holds more of a position after), removed, or both. Null for a trade."
                  truncated: { description: "Past 600 movements, the first 600 are returned.", type: boolean }
                  source: { description: "`node`: the block is not indexed yet, so only the head and the value are filled.", type: string, enum: [indexer, node] }
                  explorerUrl: { type: string, description: "The transaction on Etherscan." }
        "400":
          description: "`bad-tx-hash`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: "`transaction-not-found`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/transactions/owners:
    post:
      tags: [Transactions]
      summary: "Get the owners of transactions"
      operationId: postTransactionOwners
      security: []
      description: "The owner, the maker, each swap's maker, the sender and the purpose of 1 to 200 transactions at once, by hash. A transaction not indexed yet is left out of the answer: ask again in a few seconds. Each transaction not read recently costs one of 200 a second (a burst of 2,000)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txs]
              properties:
                txs:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [block, hash]
                    properties:
                      block: { type: integer, description: "The block the transaction landed in." }
                      hash: { $ref: "#/components/schemas/Hash" }
      responses:
        "200":
          description: Each landed transaction's owner and maker, by its hash.
          content:
            application/json:
              schema:
                type: object
                required: [owners, makers, purposes]
                properties:
                  owners:
                    type: object
                    additionalProperties:
                      oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }]
                  makers:
                    type: object
                    description: "Who made each transaction: the maker of the most of its swaps, else its owner, else the account a bundler sent it for, else its sender."
                    additionalProperties: { $ref: "#/components/schemas/Address" }
                  swapMakers:
                    type: object
                    description: "Each swap's own maker, its payer, by the swap's log index. A token's own fee is nobody's swap and is left out."
                    additionalProperties:
                      type: object
                      additionalProperties: { $ref: "#/components/schemas/Address" }
                  swapNotes:
                    type: object
                    description: "What a swap says beside its maker, by log index, only where it says something: `fee` (a token's own fee), `deliveredTo` (what it bought went to another wallet), `solver` (a solver's float)."
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          fee: { type: boolean, enum: [true] }
                          deliveredTo: { $ref: "#/components/schemas/Address" }
                          solver: { type: boolean, enum: [true] }
                  senders:
                    type: object
                    description: "Each landed transaction's sender, by its hash."
                    additionalProperties: { $ref: "#/components/schemas/Address" }
                  purposes:
                    type: object
                    description: "What a transaction did for its owner where it was no trade, named for those that had a purpose alone."
                    additionalProperties: { type: string, enum: [liquidity-add, liquidity-remove, liquidity-move] }
        "400":
          description: "`bad-request`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          $ref: "#/components/responses/StoreUnavailable"
  /v1/transfers/steps:
    post:
      tags: [Steps]
      summary: "Build a send"
      operationId: getTransferSteps
      security:
        - bearer: []
        - {}
      description: "A send of ether, a token or an NFT the wallet holds, as a ready-to-sign step simulated from the wallet at the head. `simulation.outcome.received` is what reached the recipient (a taxed token delivers less than it sends), and a revert's `message` says why in plain words."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferStepsRequest" }
            example: { to: "@friend", asset: { kind: erc20, token: "0x5fc5360d0400a0fd4f2af552add042d716f1d168" }, amount: "1000000" }
      responses:
        "200":
          description: The steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferStepsResponse" }
        "400":
          description: "`bad-body`, `bad-wallet`, `wallet-required`, `bad-amount` or `bad-recipient`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`steps-unavailable`. See [Errors](/api/guides/errors)."
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepsError" }
        "404":
          description: "`recipient-not-found`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepsError" }
        "409":
          description: "`not-an-nft`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepsError" }
  /auth/nonce:
    get:
      tags: [Sign-in]
      summary: "Get a sign-in message"
      operationId: getAuthNonce
      security: []
      description: "The message a wallet signs with `personal_sign` to sign in, and its nonce, valid ten minutes and used once. Check its domain (mancer.xyz), its address and Chain ID 4663 before signing. Send no `Origin`, or the same Mancer origin here and on the verify."
      parameters:
        - name: address
          in: query
          required: true
          description: The wallet that will sign.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The message and its nonce.
          content:
            application/json:
              schema:
                type: object
                required: [nonce, message]
                properties:
                  nonce: { type: string, description: "32 hex characters." }
                  message: { type: string, description: "The exact text to sign with `personal_sign` (EIP-191): ten lines naming mancer.xyz, the wallet's checksummed address, Chain ID 4663, the nonce and an Issued At." }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "`origin-refused`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`auth-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/verify:
    post:
      tags: [Sign-in]
      summary: "Sign in with a wallet"
      operationId: verifySignIn
      security: []
      description: "Exchanges the wallet's signature of the nonce's message for a session token, sent as `Authorization: Bearer <token>`. A wallet signs with its key, a smart account by ERC-1271 or ERC-6492, and a wallet linked into another account with its own key. See [Authentication](/api/guides/authentication)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature, nonce]
              properties:
                address: { $ref: "#/components/schemas/Address" }
                signature: { $ref: "#/components/schemas/Hex" }
                nonce: { type: string }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [token, created, account]
                properties:
                  token: { type: string, description: "The session token, an HS256 JWT. It lasts seven days from its `iat` (read `exp`), is never renewed, and its `iat` may sit a second ahead of your clock." }
                  created: { type: boolean, description: "Whether this sign-in made the account." }
                  account: { $ref: "#/components/schemas/Address", description: "The account the wallet signed in to: its own, or the one that holds it as a linked wallet." }
        "400": { description: "`bad-body`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: "`nonce-invalid`, `signature-mismatch` or `linked-wallet-key-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: "`origin-refused`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`auth-unavailable`, `chain-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/me:
    get:
      tags: [Sign-in]
      summary: "Get the session's account"
      operationId: getAuthMe
      security:
        - { bearer: [] }
      description: "The wallet that signed in, the account it signed in to and every wallet that account holds, with its API keys, its profile, whether its profile writes are open, and whether it is shown Books."
      responses:
        "200":
          description: The session's own.
          content:
            application/json:
              schema:
                type: object
                required: [address, account]
                additionalProperties: true
                properties:
                  address: { $ref: "#/components/schemas/Address", description: "The wallet that signed in." }
                  account: { type: [string, "null"], description: "The account it signed in to, or null where it could not be read." }
                  wallets: { type: [array, "null"], items: { type: object, additionalProperties: true } }
                  createdAt: { type: [integer, "null"] }
                  books: { type: boolean }
                  deletion:
                    description: "A linked wallet's request to delete the account, while one stands; null otherwise."
                    oneOf: [{ $ref: "#/components/schemas/AccountDeletionPending" }, { type: "null" }]
        "401": { $ref: "#/components/responses/SessionRefused" }
  /v1/me/sessions/revoke:
    post:
      tags: [Account]
      summary: "End every session"
      operationId: revokeSessions
      security:
        - { bearer: [] }
      description: "Ends every session issued so far and returns a fresh session for the caller. `scope` is `account` (every wallet of the account, the default) or `wallet` (this wallet alone). It pauses the webhooks the ended sessions made, and `account` every webhook, for a fresh session to resume."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: [account, wallet], default: account, description: "`account` takes a session of the account's primary wallet." }
      responses:
        "200":
          description: Ended, with a fresh session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsRevoked" }
        "400": { description: "`bad-scope`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`primary-wallet-only`: the account scope takes a session of the account's primary wallet, and a linked wallet ends its own with the wallet scope. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable` or `auth-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/wallets/link/nonce:
    post:
      tags: [Account]
      summary: "Get a wallet link message"
      operationId: createWalletLinkMessage
      security:
        - { bearer: [] }
      description: "The message a second wallet signs with its own key (`personal_sign`) to join the session's account, valid ten minutes and used once. Send the signature to `POST /v1/me/wallets/link`. Ten link attempts an hour."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The message.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema:
                type: object
                required: [nonce, message, issuedAt, expiresAt]
                properties:
                  nonce: { type: string }
                  message: { type: string }
                  issuedAt: { type: integer }
                  expiresAt: { type: integer }
        "400": { description: "`bad-address` or `idempotency-key-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "409": { description: "`wallet-already-linked`, `wallets-max`, `idempotency-in-progress` or `idempotency-key-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { description: "`link-limit` or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`profiles-unavailable`, `profiles-not-open` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/wallets/link:
    post:
      tags: [Account]
      summary: Link a wallet
      operationId: linkWallet
      security:
        - { bearer: [] }
      description: |-
        Joins the wallet at `address` to the session's account by its own key's signature of the message from `POST /v1/me/wallets/link/nonce`, and answers the account's wallets.
        A wallet with an account of its own brings it: on 409 `link-choice`, send the same signature again with what `choices` asks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, signature, message]
              properties:
                address: { $ref: "#/components/schemas/Address", description: "The wallet that joins, the one the message was issued for." }
                signature: { type: string, pattern: "^0x[0-9a-fA-F]{2,20000}$", description: "The wallet's `personal_sign` of `message`: a plain ECDSA signature of its own key, no ERC-6492 or ERC-8010 wrapper." }
                message: { type: string, maxLength: 4000, description: "The message the nonce route answered, exactly as the wallet signed it. It stands ten minutes and is used once." }
                public: { type: boolean, default: false, description: "Show the wallet on the account's profile. A new link is hidden unless true; a merge that moves what the joining account shows must be true." }
                keepUsername: { type: [string, "null"], pattern: "^@?[A-Za-z0-9_]{1,50}$", description: "Where both accounts have a username, the one to keep, matched without case or `@`. The other is released." }
                keepX: { type: [string, "null"], pattern: "^@?[A-Za-z0-9_]{1,50}$", description: "Where both accounts have an X account, the handle to keep, matched without case or `@`. The other is unlinked." }
      responses:
        "200":
          description: The account's wallets, and what the link brought.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WalletLinkResponse" }
        "400": { description: "`bad-address`, `bad-signature`, `bad-message`, `bad-public` or `bad-choice`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { choices: { $ref: "#/components/schemas/WalletLinkChoices" } } }] } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`link-signature`, `link-contract-wallet`, or `primary-wallet-only`: bringing another account in takes a session of the primary wallet. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`link-choice`, `link-expired`, `link-busy`, `wallet-already-linked`, `wallet-linked-elsewhere` or `wallets-max`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { choices: { $ref: "#/components/schemas/WalletLinkChoices" }, max: { type: integer, const: 10 } } }] } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable` or `profiles-not-open`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/events:
    get:
      tags: [Account]
      summary: "Read the account's events"
      operationId: getAccountEvents
      description: "One sequenced log of the account's order facts, notices and the Book steps that wait on it: pass the last `seq` you handled as `since`. The newest 2,000 events of the last 30 days are kept, and `truncated` says events were dropped. See [Account events](/api/guides/account-events)."
      parameters:
        - name: since
          in: query
          description: A place in the log, 0 or more, as a decimal string of up to 18 digits. The page lists the events after it.
          schema: { type: string, pattern: "^[0-9]{1,18}$", default: "0" }
        - name: limit
          in: query
          description: How many events a page holds, 1 to 500.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: "A page of the account's log."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountEventsPage" }
              example:
                account: "0x1111111111111111111111111111111111111111"
                events:
                  - seq: "4182"
                    kind: order.filled
                    account: "0x1111111111111111111111111111111111111111"
                    wallet: "0x1111111111111111111111111111111111111111"
                    key: "0x5a1c9f4e2b7d8a3c6e0f1b2d4a6c8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d"
                    at: "2026-10-30T02:31:04.512Z"
                    data:
                      order: "0x5a1c9f4e2b7d8a3c6e0f1b2d4a6c8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d"
                      contract: "0xf300a6549cd46206629e6719d3f258022d7f2da1"
                      fillIndex: 6
                      amountIn: "1000000000000000000"
                      amountOut: "3913452871"
                      feeBps: 20
                      txHash: "0x8c2e1f4a6b3d5c7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d1e"
                      block: 101208713
                      at: 1793327464
                      tokenIn: "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
                      tokenOut: "0x5fc5360d0400a0fd4f2af552add042d716f1d168"
                      totalFills: 20
                next: "4182"
                more: false
                head: "4182"
                floor: "0"
                truncated: false
        "400":
          description: "`bad-cursor` or `bad-limit`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "`auth-required`, `session-revoked` or `session-required`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`events-unavailable`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me/stream-ticket:
    post:
      tags: [Account]
      summary: "Get a stream ticket"
      operationId: postStreamTicket
      description: "A one-minute ticket that joins the account's topic on the stream: join the `topic` it names on its `socket`, with the ticket in the join's payload. The channel ends when its session ends or no longer acts for the account. See [Account events](/api/guides/account-events)."
      responses:
        "200":
          description: "A ticket."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamTicket" }
              example:
                ticket: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ2IjoxLCJhdWQiOiJtYW5jZXItc3RyZWFtIn0.c2lnbmF0dXJl"
                topic: "account:0x1111111111111111111111111111111111111111"
                expiresAt: "2026-10-30T02:32:04.000Z"
                sessionExpiresAt: "2026-11-05T19:12:40.000Z"
                socket: "wss://stream.mancer.xyz/socket/websocket?vsn=2.0.0"
                head: "4182"
        "401":
          description: "`auth-required`, `session-revoked` or `session-required`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: "`stream-tickets-unavailable` or `events-unavailable`. See [Errors](/api/guides/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me/webhooks:
    get:
      tags: [Account]
      summary: "List the account's webhooks"
      operationId: listWebhooks
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "The account's webhooks, five at the most, with the kinds a hook may take. No answer carries a hook's secret after the one that made it. See [Webhooks](/api/guides/webhooks)."
      responses:
        "200":
          description: The account's webhooks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookList" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [Account]
      summary: "Create a webhook"
      operationId: createWebhook
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "A URL each event of the account's log is POSTed to from now on, in the log's order, signed with the hook's own secret. The secret is in this answer alone. The account's inbox is told the hook was made, and its host."
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              additionalProperties: false
              properties:
                url: { type: string, maxLength: 2048, description: "An https URL on port 443 with no credentials or fragment, whose host is a public name that resolves to public addresses alone, within two seconds." }
                events:
                  type: array
                  minItems: 1
                  maxItems: 32
                  description: "The kinds to deliver: a kind of the log (`order.filled`), a family (`order.*`, `notice.*`, `book.*`), or `*` for every kind, later ones included."
                  items: { type: string }
            example: { url: "https://bot.example.com/mancer", events: ["order.*", "notice.new"] }
      responses:
        "201":
          description: "The hook, and its secret. A replay of the same `Idempotency-Key` answers `secret: null` and `secretWithheld: true`."
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookCreated" }
        "400": { description: "`bad-body`, `unknown-field`, `webhook-url-invalid`, `webhook-url-unresolvable`, `webhook-url-not-public` or `webhook-events-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope`: a wallet key needs `records` and `read`. Or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`webhooks-max`, `idempotency-in-progress` or `idempotency-key-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`webhooks-off`, `webhooks-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/webhooks/{id}:
    patch:
      tags: [Account]
      summary: "Change or pause a webhook"
      operationId: updateWebhook
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "Changes the kinds a hook takes, or pauses it with `active: false` and resumes it with `active: true`. A resume sends the event the hook waits on at once, then every event it missed. A hook paused because its credential ended resumes with a session alone."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                events: { type: array, minItems: 1, maxItems: 32, items: { type: string }, description: "The kinds to deliver, as at the hook's creation. Dropping the kind of the event the hook waits on passes that event over at once." }
                active: { type: boolean }
      responses:
        "200":
          description: The hook as it stands.
          content:
            application/json:
              schema: { type: object, required: [webhook], properties: { webhook: { $ref: "#/components/schemas/Webhook" } } }
        "400": { description: "`bad-body`, `unknown-field` or `webhook-events-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope`, `key-server-only`, or `webhook-resume-session-only`: a key resumes no hook its credential's end paused. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Delete a webhook"
      operationId: deleteWebhook
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "Deletes the hook and its delivery log. Nothing more is sent to it."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { type: object, required: [deleted, id], properties: { deleted: { type: boolean, enum: [true] }, id: { type: string } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/webhooks/{id}/rotate:
    post:
      tags: [Account]
      summary: "Rotate a webhook's secret"
      operationId: rotateWebhookSecret
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "A new signing secret, in this answer alone. Deliveries carry a signature under the old secret beside the new one for `keepPreviousSeconds` (a day unless named), so a receiver can take either while it moves."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                keepPreviousSeconds: { type: integer, minimum: 0, maximum: 86400, default: 86400, description: "How long the old secret still signs. 0 ends it at once." }
      responses:
        "200":
          description: The hook and its new secret.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, secret, previousSecretUntil]
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  secret: { type: string, description: "The new secret. Keep it on your server; no other answer carries it." }
                  previousSecretUntil: { type: [string, "null"], format: date-time, description: "Until when the old secret still signs, or null." }
        "400": { description: "`bad-body` or `unknown-field`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`webhooks-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/webhooks/{id}/test:
    post:
      tags: [Account]
      summary: "Send a test delivery"
      operationId: testWebhook
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "POSTs a `webhook.ping` to the hook now, signed as any delivery, and answers how it went. Nothing is recorded, and a paused hook takes it too."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
      responses:
        "200":
          description: "How the POST went. A receiver that failed still answers 200 here, with `delivered: false`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookTry" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`webhook-busy`: a test or a retry of the account's webhooks is running. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`webhooks-off`, `webhooks-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/webhooks/{id}/deliveries:
    get:
      tags: [Account]
      summary: "List a webhook's deliveries"
      operationId: listWebhookDeliveries
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "The 100 deliveries the hook tried last, the one tried last first: each event's state, its tries, and its last status and error."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
      responses:
        "200":
          description: The hook's deliveries.
          content:
            application/json:
              schema:
                type: object
                required: [webhook, held, heldReason, deliveries]
                properties:
                  webhook: { type: string }
                  held: { type: boolean, description: "Mancer holds the hook's deliveries now, as `GET /v1/me/webhooks` says." }
                  heldReason: { type: [string, "null"], enum: [secret, previous-secret, no-server-key, null] }
                  deliveries: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/webhooks/{id}/deliveries/{seq}/retry:
    post:
      tags: [Account]
      summary: "Redeliver an event"
      operationId: retryWebhookDelivery
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "POSTs an event the hook has passed again now, by its `seq`, and records the try in its delivery log. An event the hook has not reached yet answers 409 `webhook-event-pending`, and one from before the hook was made 409 `webhook-event-before-hook`."
      parameters:
        - { name: id, in: path, required: true, description: "The hook's id.", schema: { type: string, pattern: "^wh_[0-9a-f]{24}$" } }
        - { name: seq, in: path, required: true, description: "The event's place in the account's log.", schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" } }
      responses:
        "200":
          description: "How the POST went, and the delivery as its log now holds it."
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/WebhookTry" }
                  - { type: object, properties: { delivery: { oneOf: [{ $ref: "#/components/schemas/WebhookDelivery" }, { type: "null" }] } } }
        "400": { description: "`bad-seq`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`webhook-not-found` or `webhook-event-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`webhook-event-pending`, `webhook-event-before-hook`, `webhook-event-not-subscribed` or `webhook-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`webhooks-off`, `webhooks-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/{id}/report:
    post:
      tags: [Account]
      summary: "Report a profile"
      operationId: reportProfile
      security:
        - { bearer: [] }
      description: "Reports a profile to Mancer's moderators. A second report of the same profile by the same account answers the first, with `duplicate: true`. Ten an hour and thirty a day."
      parameters:
        - name: id
          in: path
          required: true
          description: An address, or a username with or without its `@`.
          schema: { type: string }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [impersonation, scam, spam, offensive, other] }
                details: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: The report already made.
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfileReportResponse" } } }
        "201":
          description: Reported.
          headers:
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfileReportResponse" } } }
        "400": { description: "`bad-id`, `bad-reason`, `bad-details`, `details-too-long`, `report-self` or `idempotency-key-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found` or `nothing-to-report`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`idempotency-in-progress` or `idempotency-key-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { description: "`report-limit` or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`profiles-unavailable` or `store-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/account:
    delete:
      tags: [Account]
      summary: "Delete the account"
      operationId: deleteAccount
      security:
        - { bearer: [] }
      description: "The primary wallet's session erases the account at once: its username, profile, follows, inbox, votes, theses, drafts and every session. A linked wallet's session asks instead: the account is erased seven days later unless the primary cancels. Asked again, it answers the request that stands."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean, description: "False where there was no account to erase." }
        "202":
          description: Asked by a linked wallet. The account is erased at `deletesAt` unless the request is cancelled first.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, deletion]
                properties:
                  deleted: { type: boolean, enum: [false] }
                  deletion: { $ref: "#/components/schemas/AccountDeletionPending" }
        "400": { description: "`confirm-delete`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`key-session-only`: a wallet key never deletes an account. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/account/deletion:
    delete:
      tags: [Account]
      summary: "Cancel a request to delete the account"
      operationId: cancelAccountDeletion
      security:
        - { bearer: [] }
      description: "Cancels a linked wallet's request to delete the account. The primary wallet cancels any request, and the wallet that asked cancels its own. Unlinking that wallet cancels it too."
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [cancelled, deletion]
                properties:
                  cancelled: { type: boolean, enum: [true] }
                  deletion: { $ref: "#/components/schemas/AccountDeletionPending" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`primary-wallet-only`: another linked wallet's request is the primary's to cancel. `key-session-only`: a wallet key cancels nothing. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`deletion-not-pending`: no request to delete the account stands. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users:
    get:
      tags: [Profiles]
      summary: "Search profiles"
      operationId: searchUsers
      security: []
      description: "Wallets by username prefix, X handle prefix or exact address, an exact match first, then verified accounts, then by X followers. An exact address always answers its one row. Display names are never searched."
      parameters:
        - name: q
          in: query
          required: true
          description: "A username, an X handle or an address. One leading `@` is dropped, and the rest is read lowercase, up to 64 characters."
          schema: { type: string }
        - name: limit
          in: query
          description: How many rows, 1 to 20. A value out of range reads as its nearest bound.
          schema: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        "200":
          description: The rows.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users: { type: array, items: { $ref: "#/components/schemas/UserSearchRow" } }
        "400": { description: "`q-required`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/lookup:
    get:
      tags: [Profiles]
      summary: "Look up wallets' identities"
      operationId: lookupUsers
      security: []
      description: "The short identity of up to 100 wallets at once, a row for every address asked: what a list draws beside an address. Every field but the address is null for a wallet that shows nothing. Kept 30 seconds."
      parameters:
        - name: addresses
          in: query
          required: true
          description: 1 to 100 addresses, separated by commas.
          schema: { type: string }
      responses:
        "200":
          description: The identities.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserLookupResponse" }
        "400": { description: "`bad-addresses`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/{id}:
    get:
      tags: [Profiles]
      summary: "Get a profile"
      operationId: getUser
      security:
        - bearer: []
        - {}
      description: "Any wallet's profile, by its address or a username: what it shows, its follow counts, the wallets it shows, and with a session the session's word on it. Every address has one. A released username still held for its last owner answers `renamed`."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: "The profile, or where a held username points."
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/UserProfileResponse" }
                  - { $ref: "#/components/schemas/UserRenamed" }
        "400": { description: "`bad-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`user-not-found`: no one goes by that username. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/{id}/followers:
    get:
      tags: [Profiles]
      summary: "List a wallet's followers"
      operationId: listUserFollowers
      security:
        - bearer: []
        - {}
      description: "The wallets that follow a wallet, newest follow first, with the session's word on each where a session asks. Pass `nextCursor` as `cursor` for the next page."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - name: limit
          in: query
          description: Wallets a page, 1 to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: A page's `nextCursor`.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$" }
      responses:
        "200":
          description: A page of the list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowListResponse" }
        "400": { description: "`bad-id`, `bad-limit` or `bad-cursor`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/{id}/following:
    get:
      tags: [Profiles]
      summary: "List the wallets a wallet follows"
      operationId: listUserFollowing
      security:
        - bearer: []
        - {}
      description: "The wallets a wallet follows, newest follow first, with the session's word on each where a session asks. Pass `nextCursor` as `cursor` for the next page."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - name: limit
          in: query
          description: Wallets a page, 1 to 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: A page's `nextCursor`.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$" }
      responses:
        "200":
          description: A page of the list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowListResponse" }
        "400": { description: "`bad-id`, `bad-limit` or `bad-cursor`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/users/{address}/avatar:
    get:
      tags: [Profiles]
      summary: "Get a profile's picture"
      operationId: getUserAvatar
      security: []
      description: "The picture a profile's `avatar` path names. Use that path: with its `v`, the answer is kept for a day or more, and without it five minutes."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: v
          in: query
          description: "The picture's version, as the `avatar` path names it."
          schema: { type: string }
      responses:
        "200":
          description: The picture.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`no-image`: the profile shows no picture there. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/users/{address}/banner:
    get:
      tags: [Profiles]
      summary: "Get a profile's banner"
      operationId: getUserBanner
      security: []
      description: "The banner a profile's `banner` path names. Use that path: with its `v`, the answer is kept for a day or more, and without it five minutes."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: v
          in: query
          description: "The banner's version, as the `banner` path names it."
          schema: { type: string }
      responses:
        "200":
          description: The banner.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`no-image`: the profile shows no banner. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/users/{address}/x-avatar:
    get:
      tags: [Profiles]
      summary: "Get a profile's X picture"
      operationId: getUserXAvatar
      security: []
      description: "The linked X account's picture a profile's `x.avatar` path names, for an X account its owner linked through Mancer. Use that path: with its `v`, the answer is kept a year, and without it five minutes."
      parameters:
        - name: address
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Address" }
        - name: v
          in: query
          description: "The picture's version, as the `x.avatar` path names it."
          schema: { type: string }
      responses:
        "200":
          description: The picture.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`no-image`: the profile shows no X picture. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/me/profile:
    get:
      tags: [Account]
      summary: "Get the account's own profile"
      operationId: getOwnProfile
      security:
        - { bearer: [] }
      description: "The account's profile as its owner sees it: what it shows, each field as stored, the username's clock, the X link, the settings, the mark, and whether its writes are open."
      responses:
        "200":
          description: The owner's view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    patch:
      tags: [Account]
      summary: "Edit the account's profile"
      operationId: editOwnProfile
      security:
        - { bearer: [] }
      description: "Sets any of the profile's fields and settings, each optional; `null` clears a field. A body that only clears fields is answered while the account's writes are closed. Answers the owner's view."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: [string, "null"], description: "1 to 50 characters, with no link, no address, and no word such as `mancer`, `admin`, `official` or `support`." }
                bio: { type: [string, "null"], description: "1 to 500 characters, 10 lines at the most." }
                website: { type: [string, "null"], description: "One http or https link of 2,048 characters at the most, never a social network's: link X instead. A bare host reads as https." }
                avatarSource: { type: [string, "null"], enum: [auto, x, none, null], description: "Where the picture comes from: `auto` (the default) is the profile's own, else X's." }
                showPortfolio: { type: boolean, description: "Show the wallet's holdings on its profile." }
      responses:
        "200":
          description: The owner's view, as it stands after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "400": { description: "`bad-body`, `unknown-field`, `bad-display-name`, `display-name-length`, `display-name-blank`, `display-name-link`, `display-name-word`, `display-name-address`, `bad-bio`, `bio-length`, `bio-lines`, `bad-website`, `website-social`, `bad-avatar-source` or `bad-show-portfolio`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-not-open`, which names what would open the writes, or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Delete the account's profile"
      operationId: deleteOwnProfile
      security:
        - { bearer: [] }
      description: "Unlinks X, deletes every field and picture, and releases the username into its 30-day hold. Nothing is filled from OpenSea again behind it. The account, its wallets and its follows stay: `DELETE /v1/me/account` erases those."
      responses:
        "200":
          description: The owner's view of the empty profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/profile/avatar:
    put:
      tags: [Account]
      summary: "Upload the profile's picture"
      operationId: putOwnAvatar
      security:
        - { bearer: [] }
      description: "Sets the profile's picture from the body's image bytes and answers the owner's view. It is stored as a WebP written again from its pixels, so none of the file's metadata is kept. Twenty uploads an hour for an account, the banner's included."
      requestBody:
        required: true
        description: "The image's bytes, 512 KB at the most, sent with `Content-Type` `image/png`, `image/jpeg`, `image/webp` or `image/gif`: 16 to 4,096 pixels a side, and an animation at most 200 frames and 50,000,000 pixels in all."
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The owner's view, its `profile.avatar` a new path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "400": { description: "`picture-empty`, `picture-not-raster`, `picture-type-mismatch`, `picture-dimensions`, `picture-frames` or `picture-forbidden`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "413": { description: "`picture-too-large`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "`picture-type`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`upload-limit` or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`picture-unavailable`, `profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Remove the profile's picture"
      operationId: deleteOwnAvatar
      security:
        - { bearer: [] }
      description: "Removes the profile's own picture, uploaded or filled, and answers the owner's view. With `avatarSource` `auto`, the profile then shows the linked X account's picture."
      responses:
        "200":
          description: The owner's view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`no-picture`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/profile/banner:
    put:
      tags: [Account]
      summary: "Upload the profile's banner"
      operationId: putOwnBanner
      security:
        - { bearer: [] }
      description: "Sets the profile's banner from the body's image bytes and answers the owner's view. It is stored as a WebP written again from its pixels, so none of the file's metadata is kept. Twenty uploads an hour for an account, the picture's included."
      requestBody:
        required: true
        description: "The image's bytes, 1 MB at the most, sent with `Content-Type` `image/png`, `image/jpeg`, `image/webp` or `image/gif`: 16 to 4,096 pixels a side, and an animation at most 200 frames and 50,000,000 pixels in all."
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The owner's view, its `profile.banner` a new path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "400": { description: "`picture-empty`, `picture-not-raster`, `picture-type-mismatch`, `picture-dimensions`, `picture-frames` or `picture-forbidden`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "413": { description: "`picture-too-large`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: "`picture-type`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`upload-limit` or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`picture-unavailable`, `profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Remove the profile's banner"
      operationId: deleteOwnBanner
      security:
        - { bearer: [] }
      description: "Removes the profile's banner, uploaded or filled, and answers the owner's view."
      responses:
        "200":
          description: The owner's view.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`no-picture`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/profile/refresh:
    post:
      tags: [Account]
      summary: "Refresh the profile from OpenSea"
      operationId: refreshOwnProfile
      security:
        - { bearer: [] }
      description: "Reads the wallet's OpenSea profile now and replaces each field it has a value for, leaving the rest. Where the wallet has no X link, it links the X account that profile names, as `refreshed.x` says. Once in ten minutes an account."
      responses:
        "200":
          description: The owner's view, and what changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfileRefreshed" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "409": { description: "`refresh-nothing`: OpenSea has no profile for the wallet. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: "`refresh-wait` (with `nextAt`) or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`refresh-unavailable` (with `retryAt` where OpenSea did not answer), `profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/username:
    put:
      tags: [Account]
      summary: "Claim a username"
      operationId: claimUsername
      security:
        - { bearer: [] }
      description: "Claims or changes the account's username: 3 to 20 of a to z and 0 to 9, once every seven days, the old name held 30 days for the account. A claim needs an X account linked through Mancer or a staked Chain Mancer. Asking for the name the account holds changes nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, description: "With or without its `@`, any case: it is stored lowercase." }
      responses:
        "200":
          description: Claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsernameClaimed" }
        "400": { description: "`username-format` or `username-length`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`username-needs-x-or-stake`, or `username-opened-elsewhere`: what opens the claim opened another account's in the last 30 days, and the answer says when it frees. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`username-taken`, `username-reserved`, `username-held` (with `availableAt`), `username-cooldown` (with `nextChangeAt`), `username-prefix`, `username-staff-word`, `username-lookalike`, `username-symbol` or `username-x-handle`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Release the username"
      operationId: releaseUsername
      security:
        - { bearer: [] }
      description: "Releases the account's username into a 30-day hold for the account, or frees it at once within ten minutes of its claim. The seven-day wait between changes does not move."
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { $ref: "#/components/schemas/UsernameReleasedName" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`no-username`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/usernames/{name}:
    get:
      tags: [Account]
      summary: "Check a username"
      operationId: checkUsername
      security:
        - { bearer: [] }
      description: "Whether the session's account could claim a name now, and why not, by every rule a claim reads. A malformed name is answered too. Three a second, a burst of 20."
      parameters:
        - name: name
          in: path
          required: true
          description: The name, with or without its `@`.
          schema: { type: string }
      responses:
        "200":
          description: The name's availability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsernameAvailability" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/wallets:
    get:
      tags: [Account]
      summary: "List the account's wallets"
      operationId: listAccountWallets
      security:
        - { bearer: [] }
      description: "Every wallet of the session's account, hidden ones and labels included, the account's own first. Link another with `POST /v1/me/wallets/link/nonce`."
      responses:
        "200":
          description: The account's wallets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWalletsResponse" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/wallets/{address}:
    patch:
      tags: [Account]
      summary: "Show, hide or label a wallet"
      operationId: editAccountWallet
      security:
        - { bearer: [] }
      description: "Shows or hides a linked wallet on the account's profile, and sets its private label. A hidden wallet reads to everyone else as a wallet no account holds. Answers the account's wallets."
      parameters:
        - name: address
          in: path
          required: true
          description: A wallet of the account.
          schema: { $ref: "#/components/schemas/Address" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                public: { type: boolean, description: "Show the wallet on the profile. Showing one needs the account's writes open; hiding one does not." }
                label: { type: [string, "null"], description: "1 to 32 characters, seen by the owner alone; null or empty clears it." }
      responses:
        "200":
          description: The account's wallets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWalletsResponse" }
        "400": { description: "`bad-address`, `bad-body`, `unknown-field`, `bad-public` or `bad-label`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`primary-wallet-only`: a wallet shows or hides itself, and another wallet is the primary wallet's to show or hide. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`wallet-not-linked`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`primary-wallet`: the account's own wallet is always public. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Unlink a wallet"
      operationId: unlinkAccountWallet
      security:
        - { bearer: [] }
      description: "Lets a linked wallet go: it is then a wallet no account holds, and its sessions and wallet keys end for good. A wallet unlinks itself, and another is the primary wallet's to let go. Answers the account's wallets."
      parameters:
        - name: address
          in: path
          required: true
          description: A linked wallet of the account.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The account's wallets, and the one let go.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountWalletsResponse" }
        "400": { description: "`bad-address`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`primary-wallet-only`: another wallet is the primary wallet's to unlink. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`wallet-not-linked`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`primary-wallet`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/x/start:
    post:
      tags: [Account]
      summary: "Start an X link"
      operationId: startXLink
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "Starts linking an X account and answers X's page, which the person opens in a browser to approve. With `return: device`, a bot gets a device code for `POST /auth/x/confirm` in place of a ticket. Five starts an hour."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return: { type: string, enum: [app, device], description: "`app`: the ticket comes back to the phone app. `device`: the person confirms on Mancer's page after X, and the bot finishes with its device code. Leave it out for the website." }
      responses:
        "200":
          description: X's page to open.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XLinkStart" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`origin-refused`, `key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`x-link-busy`: five links started this hour. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`x-unavailable`, `profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/x/confirm:
    post:
      tags: [Account]
      summary: "Finish an X link"
      operationId: confirmXLink
      security:
        - { bearer: [] }
        - { walletKey: [] }
      description: "Links the X account a ticket or a device code names to the account whose caller started the link, and answers the owner's view. A device code answers 202 until the person confirms on Mancer's page. An X account another wallet held moves to this one."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - { required: [ticket] }
                - { required: [deviceCode] }
              properties:
                ticket: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "The `x=` value in the fragment X sent the browser back with. It lasts ten minutes and works once." }
                deviceCode: { type: string, pattern: "^[A-Za-z0-9_-]{43}$", description: "A bot's: the `deviceCode` its `return: device` start answered. Ask again after `Retry-After` while the answer is 202." }
      responses:
        "200":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "202":
          description: A device code's link is not finished yet.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XLinkPending" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`x-ticket-not-yours`: another caller started this link, which ends it; or `origin-refused`, `key-scope` or `key-server-only`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`x-ticket-unknown`: the ticket is unknown, used or past its ten minutes; `x-device-unknown`: no link holds the device code. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`x-device-used`, `x-link-denied` or `x-link-failed`: the device code's link is done, turned down, or failed. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "410": { description: "`x-device-expired`: the device code's link ran out before it was confirmed. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/x/refresh:
    post:
      tags: [Account]
      summary: "Read the linked X account again"
      operationId: refreshXLink
      security:
        - { bearer: [] }
      description: "Reads the linked X account's handle, name, picture and followers from X now, which may earn or keep the verified mark. Once an hour. Answers the owner's view."
      responses:
        "200":
          description: Read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`origin-refused`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`x-not-linked`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`x-refresh-wait` (with `nextAt`): X was read less than an hour ago. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`x-unavailable` (with `retryAt` where X did not answer), `profiles-not-open` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/x:
    delete:
      tags: [Account]
      summary: "Unlink X"
      operationId: unlinkX
      security:
        - { bearer: [] }
      description: "Removes the account's X link and its picture at once, and answers the owner's view. A mark the link earned goes with it."
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerProfile" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`origin-refused`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`x-not-linked`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/following/{id}:
    put:
      tags: [Account]
      summary: "Follow a wallet"
      operationId: followWallet
      security:
        - { bearer: [] }
      description: "Follows any wallet, an account or not, and answers its counts and the session's word on it. Following a wallet followed already writes nothing. Pays `follow-write` (5 a second, burst 30), and an account makes 100 follows an hour and 400 a day, and follows 5,000 wallets, at the most."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Followed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id` or `follow-self`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "403": { description: "`follow-blocked`: a block stands between the two, either way. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`following-max`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { max: { type: integer, const: 5000 } } }] } } } }
        "429": { description: "`follow-limit` (`retryAfterSeconds` says when the next follow is taken) or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "`follows-paused` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Unfollow a wallet"
      operationId: unfollowWallet
      security:
        - { bearer: [] }
      description: "Stops following a wallet, and ends its trade alerts with the follow. Unfollowing a wallet not followed deletes nothing. An unfollow is never paused or held by the hourly and daily follow limits, and pays `follow-write` (5 a second, burst 30)."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Not followed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/following/{id}/alerts:
    put:
      tags: [Account]
      summary: "Turn on a wallet's trade alerts"
      operationId: turnOnTradeAlerts
      security:
        - { bearer: [] }
      description: "Turns on a notification for every trade a followed wallet makes from now on; a run of its trades within ten minutes is one notice while unread. It needs the follow, and an account has alerts on for 50 wallets at the most. Pays `follow-write` (5 a second, burst 30)."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Alerts on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id` or `follow-self`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`not-following` or `alerts-max`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { max: { type: integer, const: 50, description: "On `alerts-max`." } } }] } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`follows-paused` or `profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Turn off a wallet's trade alerts"
      operationId: turnOffTradeAlerts
      security:
        - { bearer: [] }
      description: "Turns off a followed wallet's trade alerts, and the follow stays. It is never refused for the follow's state or paused, and pays `follow-write` (5 a second, burst 30)."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Alerts off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/blocks:
    get:
      tags: [Account]
      summary: "List blocked wallets"
      operationId: listBlocks
      security:
        - { bearer: [] }
      description: "The wallets the session's account blocked, newest first, each with when. Pass a page's `nextCursor` as `cursor` until it is null; `count` is the whole list's length."
      parameters:
        - name: limit
          in: query
          description: How many wallets a page holds.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          description: "A page's `nextCursor`, as this route wrote it. Omit it for the newest page."
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,200}$" }
      responses:
        "200":
          description: A page of the blocked wallets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlocksPage" }
        "400": { description: "`bad-limit` or `bad-cursor`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/blocks/{id}:
    put:
      tags: [Account]
      summary: "Block a wallet"
      operationId: blockWallet
      security:
        - { bearer: [] }
      description: "Blocks any wallet: the follows between the two end both ways, its notices to the account go, and neither can follow the other while the block stands. Nothing tells the wallet blocked. Pays `follow-write` (5 a second, burst 30), and an account blocks 5,000 wallets at the most."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Blocked, or blocked already.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id` or `block-self`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`blocking-max`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { max: { type: integer, const: 5000 } } }] } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Unblock a wallet"
      operationId: unblockWallet
      security:
        - { bearer: [] }
      description: "Lifts a block, and the follows it ended stay ended. Unblocking a wallet not blocked deletes nothing. Pays `follow-write` (5 a second, burst 30)."
      parameters:
        - { $ref: "#/components/parameters/UserId" }
      responses:
        "200":
          description: Not blocked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FollowState" }
        "400": { description: "`bad-id`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`user-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/feed:
    get:
      tags: [Account]
      summary: "Read the Following feed"
      operationId: getFollowingFeed
      security:
        - { bearer: [] }
      description: "The trades of the wallets the session's account follows, newest first, a row a transaction. Pass a page's `nextBefore` as `before` until it is null. A wallet followed for the first time is filled with its 30 newest trades, and the feed keeps each wallet's newest 200."
      parameters:
        - name: limit
          in: query
          description: How many trades a page holds.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          description: "A page's `nextBefore`, as this route wrote it. Omit it for the newest page."
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,300}$" }
      responses:
        "200":
          description: A page of the feed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedPage" }
        "400": { description: "`bad-limit` or `bad-cursor`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/people/suggested:
    get:
      tags: [Account]
      summary: "List people you may know"
      operationId: listSuggestedPeople
      security:
        - { bearer: [] }
      description: "People the session's account may know, the strongest first, each with the reasons it is named for: tokens sent either way, a follower not followed back, wallets those it follows follow, a Book in common. Never its own wallets, a wallet it follows, or one blocked either way."
      parameters:
        - name: limit
          in: query
          description: How many people the answer names at the most.
          schema: { type: integer, minimum: 1, maximum: 20, default: 20 }
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestedPeopleResponse" }
        "400": { description: "`bad-limit`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/notifications:
    get:
      tags: [Account]
      summary: "List notifications"
      operationId: listNotifications
      security:
        - { bearer: [] }
      description: "The session's notifications, newest first: each wallet that followed the account, and each run of trades of a wallet it has trade alerts on for. Pass a page's `nextBefore` as `before` until it is null. The newest 500 of the last 90 days are kept."
      parameters:
        - name: limit
          in: query
          description: How many notices a page holds.
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          description: "A page's `nextBefore`: a notice's id. The page holds the notices older than it. Omit it for the newest page."
          schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
        - name: unread
          in: query
          description: "`1` lists the unread notices alone."
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: A page of notifications.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoticesPage" }
        "400": { description: "`bad-limit` or `bad-cursor`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/notifications/unread:
    get:
      tags: [Account]
      summary: "Count unread notifications"
      operationId: countUnreadNotifications
      security:
        - { bearer: [] }
      description: "How many of the session's notifications are unread, counted to 100: read 100 as 100 or more."
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                type: object
                required: [unread]
                properties:
                  unread: { type: integer, minimum: 0, maximum: 100 }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/notifications/read:
    post:
      tags: [Account]
      summary: "Mark notifications read"
      operationId: markNotificationsRead
      security:
        - { bearer: [] }
      description: "Marks the session's notifications read: `ids`, every one `through` an id (a page's newest), or `all: true`. A body that names none of the three marks nothing and answers 400 `bad-read`. Pays `account-write` (2 a second, burst 10)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: These notices
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      minItems: 1
                      maxItems: 100
                      description: "Notice ids, each a number or a decimal string."
                      items: { type: [string, integer] }
                - type: object
                  title: Through a notice
                  required: [through]
                  properties:
                    through: { type: [string, integer], description: "A notice id: it and every older notice are marked." }
                - type: object
                  title: All of them
                  required: [all]
                  properties:
                    all: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema:
                type: object
                required: [marked, unread]
                properties:
                  marked: { type: integer, minimum: 0, description: "How many unread notices this marked." }
                  unread: { type: integer, minimum: 0, maximum: 100, description: "The unread left, counted to 100." }
        "400": { description: "`bad-read`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/push-devices:
    post:
      tags: [Account]
      summary: "Register a phone for pushes"
      operationId: registerPushDevice
      security:
        - { bearer: [] }
      description: "Registers a phone's Expo push token for the account's notifications; a token another account registered moves to this one. An account keeps its ten newest phones, and a phone not registered again within 30 days is let go. Pays `account-write` (2 a second, burst 10)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, pattern: "^Expo(nent)?PushToken\\[[A-Za-z0-9_-]{8,128}\\]$", description: "The phone's Expo push token, as Expo hands it out." }
                platform: { type: string, enum: [ios, android] }
      responses:
        "200":
          description: Registered.
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered: { type: boolean, enum: [true] }
        "400": { description: "`bad-push-token` or `bad-platform`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [Account]
      summary: "Remove a phone"
      operationId: removePushDevice
      security:
        - { bearer: [] }
      description: "Lets one phone's push token go from the account, and none of its other phones. Pays `account-write` (2 a second, burst 10)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, pattern: "^Expo(nent)?PushToken\\[[A-Za-z0-9_-]{8,128}\\]$", description: "The phone's Expo push token." }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: boolean, description: "False where the account had no such phone." }
        "400": { description: "`bad-push-token`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`profiles-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/app-access:
    get:
      tags: [Account]
      summary: "Get the account's app access"
      operationId: getAppAccess
      security:
        - { bearer: [] }
      description: "Whether the phone app lets the session's account in, how and since when, and the account's invite codes. An account not yet in has its wallets read for a staked Chain Mancer or an activated StonkBroker, and is let in with five codes where one holds one."
      responses:
        "200":
          description: The account's access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccessResponse" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`app-access-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/app-access/check:
    post:
      tags: [Account]
      summary: "Check the account's stake again"
      operationId: checkAppAccess
      security:
        - { bearer: [] }
      description: "The account's access, with its wallets' stakes read again from the chain, once in three seconds an account. A wallet that does not answer in time answers 503 `stake-unread`. It pays the account writes' bucket: 2 a second, with bursts of 10."
      responses:
        "200":
          description: The account's access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccessResponse" }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`stake-unread` or `app-access-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/me/app-access/redeem:
    post:
      tags: [Account]
      summary: "Redeem an invite code"
      operationId: redeemAppInvite
      security:
        - { bearer: [] }
      description: "Lets the session's account into the phone app by an invite code, used once and never by the account that holds it. An account already in, or let in by its stake, answers 409 `already-in` and the code stays unused. Ten failed codes an hour an account."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 64, description: "Eight letters and digits, shown XXXX-XXXX, matched without case, spaces or dashes." }
      responses:
        "200":
          description: Let in by the code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppAccessResponse" }
        "400": { description: "`invite-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`invite-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`already-in` (its body carries the account's access), `invite-used` or `invite-own`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { access: { $ref: "#/components/schemas/AppAccessResponse" } } }] } } } }
        "429": { description: "`invite-tries` (with `retryAfter`, the seconds to wait) or `rate-limited`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { allOf: [{ $ref: "#/components/schemas/Error" }, { type: object, properties: { retryAfter: { type: integer } } }] } } } }
        "503": { description: "`app-access-unavailable`. See [Errors](/api/guides/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/books:
    get:
      tags: [Books]
      summary: "List Books"
      operationId: listBooks
      security:
        - {}
        - { bearer: [] }
      description: "The board: one summary a Book, filtered by phase, searched, sorted and paged. Every sort lists trusted Books first, flagged Books last and cancelled Books after the rest. See [Reading Books](/api/guides/books/reading)."
      parameters:
        - name: phase
          in: query
          description: "A comma list of `raising`, `graduated`, `trading`, `frozen`, `settled` and `aborted` (cancelled); every phase but `aborted` by default. A Book waiting to arm is never listed."
          schema: { type: string, example: "trading,frozen" }
        - name: sort
          in: query
          description: "Default `return` where every phase asked is `trading`, `frozen` or `settled`, `progress` where `raising` alone is, else `newest`. `votes` ranks up less down votes; `value`, `bookValueWei`."
          schema: { type: string, enum: [return, progress, timeLeft, newest, marketCap, votes, value] }
        - name: order
          in: query
          description: "`asc` by default for `timeLeft`, `desc` otherwise."
          schema: { type: string, enum: [asc, desc] }
        - name: q
          in: query
          description: A name or symbol substring, or the exact address of a Book's token, vault, creator or trader.
          schema: { type: string, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        "200":
          description: A page of the board.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksBoardResponse" }
        "400": { $ref: "#/components/responses/BooksBadQuery" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/stats:
    get:
      tags: [Books]
      summary: "Get Books totals"
      operationId: getBooksStats
      security:
        - {}
        - { bearer: [] }
      description: "Totals across every Book and by deployment: Books by phase, raises, curve trades, vault trades and orders, the close fee accrued, claimed and owed, and the NFT markets' moves and fees. The close fee owed is a deployment's figure, never a Book's."
      responses:
        "200":
          description: The figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksStatsResponse" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/activity:
    get:
      tags: [Books]
      summary: "List activity across Books"
      operationId: getBooksActivity
      security:
        - {}
        - { bearer: [] }
      description: "The newest curve trades, vault trades and bonded markets' swaps across every Book, newest first. A page ends at a block's end and can run past `limit`: pass `nextBefore` as `before` for the next. `partial: true` means the market swaps did not read."
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
        - { $ref: "#/components/parameters/BooksBefore" }
      responses:
        "200":
          description: The activity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksActivityResponse" }
        "400": { $ref: "#/components/responses/BooksBadQuery" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/traders:
    get:
      tags: [Books]
      summary: "List top Books traders"
      operationId: getBooksTraders
      security:
        - {}
        - { bearer: [] }
      description: "The top traders over the ranked Books: their Books, live and settled, their best returns, and the traders' cut they earned."
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The traders.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksTradersResponse" }
        "400": { $ref: "#/components/responses/BooksBadQuery" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/creators:
    get:
      tags: [Books]
      summary: List top creators
      operationId: listBookCreators
      security:
        - {}
        - { bearer: [] }
      description: |-
        The creators of the Books the board lists, a cancelled Book counting for none: each creator's Books, live and settled, their value in ETH, its best settled return after fees, and its mark.
        The verified come first, then the most value.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The creators.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksCreatorsResponse" }
        "400": { $ref: "#/components/responses/BooksBadQuery" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/traders/{address}:
    get:
      tags: [Books]
      summary: "Get a trader's record"
      operationId: getBookTraderRecord
      security:
        - {}
        - { bearer: [] }
      description: "A wallet's record as a Books trader: the Books it created or acted in, with their returns, and its own trading. Only a Book's party has figures; any other wallet answers `unavailable`. While figures are computed it answers `status: computing` with `Retry-After`."
      parameters:
        - name: address
          in: path
          required: true
          description: The wallet.
          schema: { $ref: "#/components/schemas/Address" }
      responses:
        "200":
          description: The record.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Sent while `status` is `computing`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookTraderRecordResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/traders/{address}/history:
    get:
      tags: [Books]
      summary: "List a trader's history"
      operationId: getBookTraderHistory
      security:
        - {}
        - { bearer: [] }
      description: "The wallet's own trades and the executed vault trades it proposed, newest first, each with what its sales realized. A page can hold fewer items than `limit`, even none, while `nextBefore` goes on. It shares the wallet trades route's allowance: 1 a second, a burst of 20."
      parameters:
        - name: address
          in: path
          required: true
          description: The wallet.
          schema: { $ref: "#/components/schemas/Address" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: before
          in: query
          description: A page's `nextBefore`, as it was given.
          schema: { type: string }
      responses:
        "200":
          description: The history.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Sent while `status` is `computing`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookTraderHistoryResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/deployments:
    get:
      tags: [Books]
      summary: "List Books deployments"
      operationId: getBooksDeployments
      security:
        - {}
        - { bearer: [] }
      description: "Each Books deployment: its addresses, whether its contracts passed Mancer's checks, the factory's signer, Mancer's signing switch by purpose, its base pairs with their price feeds, and pending proposals. Read the addresses here at runtime rather than pinning them."
      responses:
        "200":
          description: The deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksDeploymentsResponse" }
        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/{token}:
    get:
      tags: [Books]
      summary: "Get a Book"
      operationId: getBook
      security:
        - {}
        - { bearer: [] }
      description: "One Book read at one block, so its figures agree: its summary, terms, raise, vault, locked market, staking, settlement and NFT market. Name a receipt's block in `minBlock` to read it as of that step. A Book opened seconds ago may answer 503 `book-indexing`: retry after a second."
      parameters: [{ $ref: "#/components/parameters/BookToken" }, { $ref: "#/components/parameters/BooksMinBlock" }]
      responses:
        "200":
          description: The Book.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDetailResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/trades:
    get:
      tags: [Books]
      summary: "List a vault's trades"
      operationId: getBookTrades
      security:
        - {}
        - { bearer: [] }
      description: "The vault's trades, one row a proposal, newest first: executed, pending, replaced or expired, with who proposed and who confirmed each. A page ends at a block's end."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - { $ref: "#/components/parameters/BooksBefore" }
      responses:
        "200":
          description: The trades.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookTradesResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/pnl:
    get:
      tags: [Books]
      summary: "Get a vault's PnL"
      operationId: getBookPnl
      security:
        - {}
        - { bearer: [] }
      description: "The vault's positions in WETH: each one's cost, what its sales realized, what it holds and its unrealized figure, and each executed trade's value. A sale of `s` units of `u` held is charged the cost times the lesser of `s` and `u`, over `u`."
      parameters: [{ $ref: "#/components/parameters/BookToken" }]
      responses:
        "200":
          description: "The vault's positions."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookVaultPnlResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/buys:
    get:
      tags: [Books]
      summary: "List a Book's curve trades"
      operationId: getBookBuys
      security:
        - {}
        - { bearer: [] }
      description: "The curve's buys and sales, newest first, each with its tax and the market cap after it, and in `history` every one in time order for a chart. A page ends at a block's end."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 60 }
        - { $ref: "#/components/parameters/BooksBefore" }
      responses:
        "200":
          description: The curve's trades.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookBuysResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/history:
    get:
      tags: [Books]
      summary: "List a Book's history"
      operationId: getBookHistory
      security:
        - {}
        - { bearer: [] }
      description: "The Book's life, newest first: its open, arm, cancellation, graduation and bond, its vault's orders, its settlement, sweeps, redemptions and cut claims, its fees, and its NFT market. A page ends at a block's end."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - { $ref: "#/components/parameters/BooksBefore" }
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookHistoryResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/raise-quote:
    get:
      tags: [Books]
      summary: "Quote a raise trade"
      operationId: getBookRaiseQuote
      security:
        - {}
        - { bearer: [] }
      description: "A buy or a sale on the Book's curve as a direct call to the raise contract from the taker's wallet, with the raise contract's own math and that minute's tax. `tx` and `approval` need a session, an API key or `steps=1`. A quote in a closing window's last 30 seconds is refused `window-closing`."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: side
          in: query
          schema: { type: string, enum: [buy, sell], default: buy }
        - name: amountIn
          in: query
          required: true
          description: A buy's base pair in its raw units (wei of ETH when paying with `eth`); a sale's Book tokens in raw units.
          schema: { $ref: "#/components/schemas/Uint" }
        - name: payWith
          in: query
          description: "What a buy pays with, or what a sale pays out: `eth` (a WETH Book alone, and its default) or `quote` (the base pair)."
          schema: { type: string, enum: [eth, quote] }
        - name: taker
          in: query
          required: true
          description: The wallet that sends the trade.
          schema: { $ref: "#/components/schemas/Address" }
        - name: slippageBps
          in: query
          description: The floor under the quote.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - { $ref: "#/components/parameters/Steps" }
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookRaiseQuoteResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409":
          description: "`not-raising`, `book-cancelled`, `window-closed`, `window-closing`, `sells-disabled`, `sell-exceeds-curve`, `sell-exceeds-balance`, `feed-stale`, `zero-trade` or `slippage-exceeded`. See [Books errors](/api/guides/books/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/liquidation:
    get:
      tags: [Books]
      summary: "Preview a Book's settlement"
      operationId: getBookLiquidation
      security:
        - {}
        - { bearer: [] }
      description: "A frozen Book's settlement as it would run now: whether the caller may settle it and from when, each tracked token as a leg, the sync it needs first, and what it would pay. `preSync` needs a session or an API key. The signed sales are `POST /v1/books/{token}/liquidation-quotes`."
      parameters:
        - { $ref: "#/components/parameters/BookToken" }
        - name: caller
          in: query
          description: The wallet that would settle.
          schema: { $ref: "#/components/schemas/Address" }
        - name: slippageBps
          in: query
          description: "The floor of this estimate's legs alone: the signed sales carry their own."
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: The settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookLiquidationResponse" }
        "400": { $ref: "#/components/responses/BooksBadRequest" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409":
          description: "`not-frozen`. See [Books errors](/api/guides/books/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/wallets/{address}/books:
    get:
      tags: [Books]
      summary: "List a wallet's Books"
      operationId: getWalletBooks
      security:
        - {}
        - { bearer: [] }
      description: "One row a Book the wallet touches (it holds or staked the token, created it, trades it, is owed a cut, or bought on its curve), with what it holds, can redeem and can do next (`next`). A figure named in a row's `unread` did not read: never take it for none."
      parameters:
        - name: address
          in: path
          required: true
          description: The wallet.
          schema: { $ref: "#/components/schemas/Address" }
        - { $ref: "#/components/parameters/BooksMinBlock" }
        - name: books
          in: query
          description: "With `minBlock`: the Books the receipt's step was on, a comma list of up to 8 token addresses, so the answer waits for those alone. Empty for a step on no Book."
          schema: { type: string }
      responses:
        "200":
          description: The wallet's Books.
          content:
