          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDraftResponse" }
        "400": { description: "`logo-empty`, `logo-not-raster`, `logo-type-mismatch`, `logo-dimensions` or `logo-forbidden`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
