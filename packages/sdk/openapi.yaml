        "503": { description: "`logo-unavailable` or `books-index-unavailable`. See [Books errors](/api/guides/books/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
