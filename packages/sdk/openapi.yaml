            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "409":
          description: "`wrong-phase`, `budget-exhausted`, `reversal-cooldown`, `reverses-live-order`, `amount-exceeds-tracked`, `vault-tracks-16`, `weth-spot`, `deadline-past-unlock`, `token-refused`, `stock-not-receivable`, `no-reference`, `no-route`, `route-pool-refused`, `middle-refused`, `route-touches-book-token`, `middle-not-swept`, `unknown-leg`, `route-mismatch`, `price-moved`, `pool-take-too-high`, `vault-simulation-failed` or `pending-mismatch`. See [Books errors](/api/guides/books/errors)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BooksError" }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { $ref: "#/components/responses/BooksSigningUnavailable" }
