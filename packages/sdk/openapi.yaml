        "503": { $ref: "#/components/responses/BooksUnavailable" }
  /v1/books/drafts/{id}:
    patch:
      tags: [Books]
      summary: Attach a saved Book's open
      operationId: updateBookDraft
      security:
        - { bearer: [] }
      description: |-
        Names the open's transaction on a Book saved by `POST /v1/books/drafts`, and answers the record, its `state` now `sent`.
        The session of the wallet that saved it alone.
