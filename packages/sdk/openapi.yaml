        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { description: "`not-a-book` or `thesis-not-found`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: "`idempotency-in-progress` or `idempotency-key-busy`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/IdempotencyKeyReused" }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { description: "`book-indexing`, `books-index-unavailable`, `books-state-unavailable`, `books-deployment-unverified` or `store-unavailable`. See [Books errors](/api/guides/books/errors).", headers: { Retry-After: { $ref: "#/components/headers/RetryAfter" } }, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/books/{token}/steps:
    post:
