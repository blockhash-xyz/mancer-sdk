            application/json:
              schema: { $ref: "#/components/schemas/BookVoteResponse" }
        "400": { description: "`bad-address`. See [Books errors](/api/guides/books/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/BooksError" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
        "404": { $ref: "#/components/responses/BooksNotABook" }
        "429": { $ref: "#/components/responses/BooksRateLimited" }
        "503": { $ref: "#/components/responses/BookUnavailable" }
  /v1/books/{token}/theses/{voter}/report:
