            properties:
              token: { $ref: "#/components/schemas/BooksAddress" }
              amount: { $ref: "#/components/schemas/BooksUnits" }
            required: [token, amount]
        stillSelling: { type: boolean, description: "A held token waits for a sweep: the pot can still grow." }
    BookSettlementState:
