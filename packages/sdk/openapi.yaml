      required: [holderPotWei, cutsOwedWei, totalWei]
      properties:
        holderPotWei: { $ref: "#/components/schemas/BooksUnits" }
        cutsOwedWei: { $ref: "#/components/schemas/BooksUnits" }
        totalWei: { $ref: "#/components/schemas/BooksUnits" }
    BookSettlementEstimate:
      type: object
      description: "What a settlement now would fix: the close fee first, then the traders' cut of what is left over the cost basis."
      required:
        - navWei
        - lpPotWei
        - owedLpFeesWei
        - closeFeeWei
        - closeFeeMancerWei
        - closeFeeProtocolWei
        - costBasisWei
        - profitWei
        - creatorCutWei
        - holderPotWei
        - circulating
        - circulatingParts
        - payoutPerTokenWei
        - partial
        - asOf
      properties:
        navWei: { $ref: "#/components/schemas/BooksUnits", description: The vault's value in WETH. }
        lpPotWei:
          description: What the locked market would return to holders, inside `holderPotWei`.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        owedLpFeesWei: { $ref: "#/components/schemas/BooksUnits" }
        closeFeeWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeMancerWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeProtocolWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        costBasisWei: { $ref: "#/components/schemas/BooksUnits" }
        profitWei: { $ref: "#/components/schemas/BooksUnits", description: "The value less the close fee, over the cost basis." }
        creatorCutWei: { $ref: "#/components/schemas/BooksUnits", description: The traders' cut. }
        holderPotWei: { $ref: "#/components/schemas/BooksUnits" }
        circulating:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        circulatingParts: { $ref: "#/components/schemas/BookCirculatingParts" }
        payoutPerTokenWei:
          description: What a whole token would redeem for.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        partial: { type: boolean, description: "Always false: a Book's value always reads whole. Kept for clients built before it." }
        asOf: { $ref: "#/components/schemas/BooksHead" }
    BookSettlementFinal:
