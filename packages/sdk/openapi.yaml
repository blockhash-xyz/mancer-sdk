        "400": { description: "`bad-body`, `factory-not-open`, `draft-name`, `draft-symbol`, `targets-required`, `bad-targets`, `target-unverified` or `idempotency-key-invalid`. See [Errors](/api/guides/errors).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SessionRefused" }
