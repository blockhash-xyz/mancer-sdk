                  tf: { type: integer }
                  source: { type: string, enum: [indexer-token] }
                  candles:
                    type: array
                    items: { $ref: "#/components/schemas/Candle" }
                  hasMore: { type: boolean }
                  nextBefore: { type: integer, description: "Pass as `before` for the previous page." }
