        - lpPotWei
        - lpQuotePending
        - closeFeeWei
        - closeFeeMancerWei
        - closeFeeProtocolWei
        - holderPotLeftWei
        - circulatingLeft
        - circulatingParts
        - unredeemable
        - creatorCutTotalWei
        - creatorCutClaimedWei
        - reserved
        - unliquidated
        - stillSelling
      properties:
        navTotalWei: { $ref: "#/components/schemas/BooksUnits" }
        lpPotWei: { $ref: "#/components/schemas/BooksUnits", description: What the locked market returned to the holders' pot. }
        lpQuotePending: { $ref: "#/components/schemas/BooksUnits", description: "A Book of another base pair: the market's base pair still to sell." }
        closeFeeWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeMancerWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeProtocolWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        holderPotLeftWei: { $ref: "#/components/schemas/BooksUnits", description: The holders' pot not yet redeemed. }
        circulatingLeft: { $ref: "#/components/schemas/BooksUnits", description: The tokens not yet redeemed. }
        circulatingParts: { $ref: "#/components/schemas/BookCirculatingParts" }
        unredeemable:
          anyOf: [{ $ref: "#/components/schemas/BookUnredeemable" }, { type: "null" }]
        creatorCutTotalWei: { $ref: "#/components/schemas/BooksUnits" }
        creatorCutClaimedWei: { $ref: "#/components/schemas/BooksUnits" }
        reserved: { $ref: "#/components/schemas/BookReserved" }
        unliquidated:
          type: array
