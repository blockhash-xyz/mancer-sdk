      properties:
        mode: { type: string, enum: [stake, burn] }
        totalStaked: { $ref: "#/components/schemas/BooksUnits" }
        periodFinish: { type: number, description: "When the fees stop paying out: the unlock." }
        lastUpdate: { type: number, description: "The staking contract's last payout, in chain seconds." }
        pendingQuote: { $ref: "#/components/schemas/BooksUnits" }
        pendingBook: { $ref: "#/components/schemas/BooksUnits" }
        drippedQuote: { $ref: "#/components/schemas/BooksUnits" }
        drippedBook: { $ref: "#/components/schemas/BooksUnits" }
        burnedQuote: { $ref: "#/components/schemas/BooksUnits" }
        burnedBook: { $ref: "#/components/schemas/BooksUnits" }
    BookStep:
      type: string
      enum: [arm, buy, graduate, bond, trade, liquidate, redeem, none]
      description: The Book's next step, for whoever the contracts allow.
    BookStepFlags:
      type: object
      description: A Book's flags at the head's second, beside its step.
      required: [pastWindow, graduatable, markWaitsForBondGap, feedStale]
      properties:
        pastWindow: { type: boolean, description: "An open-ended raise past its window: still raising, at the falling tax." }
        graduatable: { type: boolean, description: "The market cap reached the mark while the curve is open, and the curve may close: anyone may graduate the Book." }
        markWaitsForBondGap: { type: boolean, description: "The market cap reached the mark before the curve may close, an hour after the tax reaches 1%." }
        feedStale: { type: boolean, description: "The ETH/USD feed is more than 48 hours old, answers zero or less, or is stamped after the block. A WETH Book's raise stops, and a Book of another base pair cannot note its tax or bond." }
    BookSummary:
      type: object
      description: One Book on the board, and the head of its page.
      required:
        - token
        - deployment
        - bookId
        - vault
        - name
        - displayName
        - symbol
        - decimals
        - nameFlag
        - quote
        - venue
        - creator
        - traders
        - trust
        - votes
        - profile
        - traderCount
        - phase
        - step
        - launchPhase
        - flags
        - launchMode
        - lpFeeMode
        - durationSecs
        - times
        - timeLeftSecs
        - raise
        - market
        - value
        - bookValueWei
        - final
        - rank
        - holdings
        - nftMarket
      properties:
        creatorVerified: { type: boolean, description: "The creator's profile carries Mancer's verified mark now. The Book's X (`profile.links.x`) is that creator's own." }
        token: { $ref: "#/components/schemas/BooksAddress", description: "The Book token, which names the Book." }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string, description: "The Book's id on its deployment. Name a Book by its token." }
        vault: { $ref: "#/components/schemas/BooksAddress", description: The Book's vault. }
        name: { type: string, description: "The display name where the deployment names one, else the chain's name; the same as `displayName`." }
        displayName: { type: string }
        symbol: { type: string }
        decimals: { type: number, const: 18, description: Every Book token has 18 decimals. }
        nameFlag:
          type: [string, "null"]
          enum: [impersonator, null]
          description: "`impersonator` where the Book's symbol is a verified token's symbol, or its name or symbol holds a protected name as a whole word (Mancer, StonkBrokers, TOKENIZE): such a Book is never ranked."
        quote: { $ref: "#/components/schemas/BookQuoteRef", description: The Book's base pair. }
        venue: { $ref: "#/components/schemas/BookVenueState" }
        creator: { $ref: "#/components/schemas/BooksAddress", description: The wallet that opened the Book. }
        traders:
          type: array
          description: The Book's traders, one to eight.
          items:
            type: object
            properties:
              address: { $ref: "#/components/schemas/BooksAddress" }
              acted: { type: boolean, description: "The creator's own seat, or seen confirming, cancelling or revoking on chain." }
              verified: { type: boolean, description: The trader's wallet carries Mancer's verified mark now. }
              ethos:
                description: The trader's Ethos reading, at most 30 minutes old; null where none is held.
                anyOf: [{ $ref: "#/components/schemas/BookTraderEthos" }, { type: "null" }]
            required: [address, acted, verified, ethos]
        trust:
          $ref: "#/components/schemas/BookTrust"
          description: "`flagged` where the creator or a trader who acted has an Ethos score under 800; else `trusted` where one carries the verified mark or an Ethos score of 1,600 or more; else `plain`."
        votes: { $ref: "#/components/schemas/BookVoteCounts", description: The verified accounts' votes on the Book. }
        profile: { $ref: "#/components/schemas/BookProfile", description: "What its creator set of it." }
        traderCount: { type: number }
        phase: { $ref: "#/components/schemas/BookPhase" }
        step: { $ref: "#/components/schemas/BookStep" }
        launchPhase: { $ref: "#/components/schemas/BookLaunchPhase" }
        flags: { $ref: "#/components/schemas/BookStepFlags" }
        launchMode:
          anyOf: [{ $ref: "#/components/schemas/BookLaunchMode" }, { type: "null" }]
        lpFeeMode: { type: string, enum: [stake, burn], description: "Where the locked market's fees go: to stakers, or burned." }
        durationSecs: { type: number, description: "The term, from the bond." }
        times:
          type: object
          required: [openedAt, armedAt, antiSnipeEndsAt, minBondAt, deadline, forcedBond, bondedAt, unlockAt, openToAllAt, settledAt, cancelledAt]
          properties:
            openedAt: { type: number }
            armedAt: { type: [number, "null"] }
            antiSnipeEndsAt: { type: [number, "null"], description: When the opening tax reaches its 1% floor. }
            minBondAt: { type: [number, "null"], description: "The earliest second the mark closes the curve: an hour after the tax reaches 1%." }
            deadline: { type: [number, "null"], description: "The window's end, or a buys-only Book's bond clock. It closes the curve where `forcedBond`." }
            forcedBond: { type: [boolean, "null"], description: The window's end closes the curve. }
            bondedAt: { type: [number, "null"] }
            unlockAt: { type: [number, "null"], description: The term's end. }
            openToAllAt: { type: [number, "null"], description: "When anyone may settle: the unlock and the 2-day grace." }
            settledAt: { type: [number, "null"] }
            cancelledAt: { type: [number, "null"], description: When its creator cancelled it. }
        timeLeftSecs: { type: [number, "null"], description: "To the deadline while raising (null once an open-ended raise is past it), to the unlock while trading." }
        raise:
          description: The raise while the Book waits, raises or has graduated; null after.
          anyOf: [{ $ref: "#/components/schemas/BookRaiseSummary" }, { type: "null" }]
        market:
          type: object
          description: "The Book token's market: before the bond, the curve's price and market cap, and no pool; after it, the locked market (the v3 pool, or the PoolManager and the pool id on v4). Priced in the base pair."
          required: [pool, poolId, pricePerTokenQuote, priceUsd, marketCapUsd]
          properties:
            pool:
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
            poolId:
              anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
            pricePerTokenQuote:
              description: The base pair's raw units per whole token.
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            priceUsd: { type: [number, "null"] }
            marketCapUsd: { type: [number, "null"] }
        value:
          description: What a settlement now would fix, while the Book trades or is frozen.
          anyOf: [{ $ref: "#/components/schemas/BookValue" }, { type: "null" }]
        bookValueWei:
          description: "The Book's value in WETH: its raise before the bond; then its vault and the ETH its locked LP returns holders; once settled, what the settlement took in. Null if cancelled or unread."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        final:
          description: What its settlement fixed, once settled.
          anyOf: [{ $ref: "#/components/schemas/BookFinal" }, { type: "null" }]
        rank:
          type: object
          required: [ranked, why, transfersInWei, tradingReturnBps]
          properties:
            ranked: { type: boolean, description: "Raised at least 0.1 ETH, a name not flagged, and a trader who acted." }
            why:
              anyOf: [{ $ref: "#/components/schemas/BookRankWhy" }, { type: "null" }]
            transfersInWei: { $ref: "#/components/schemas/BooksUnits", description: What was sent to the vault from outside. }
            tradingReturnBps: { type: [number, "null"], description: "What the board ranks by: while the Book trades or is frozen, its return net of what was sent to the vault from outside; once settled, its settlement's `returnBps`." }
        holdings: { $ref: "#/components/schemas/BookHoldings", description: The tracked holdings. A settled Book's leave out what the settlement emptied. }
        trackedTokens:
          type: array
          description: "A settled Book alone: every token its vault tracked, its own token among them."
          items: { $ref: "#/components/schemas/BooksAddress" }
        nftMarket:
          description: Its Book NFT market, where one passed its checks.
          anyOf: [{ $ref: "#/components/schemas/BookNftMarketSummary" }, { type: "null" }]
    BookTakerKind:
      type: string
      enum: [eoa, delegated-eoa, contract]
      description: "A wallet by its code: none is `eoa`, an EIP-7702 delegation `delegated-eoa`, anything else `contract`."
    BookTerms:
      type: object
      description: A launch's terms, with the close fee and the traders' share.
      required:
        - startMcapUsd8
        - gradMcapUsd8
        - startTaxBps
        - taxDecayPerMinBps
        - windowSecs
        - buysOnly
        - bondAfterSecs
        - guaranteedBond
        - antiSnipeSecs
        - bondGapSecs
        - quote
        - venue
        - hook
        - closeFeeBps
        - closeFeeMancerShareBps
        - traderProfitShareBps
      properties:
        startMcapUsd8: { $ref: "#/components/schemas/BooksUnits" }
        gradMcapUsd8: { $ref: "#/components/schemas/BooksUnits" }
        startTaxBps: { type: number }
        taxDecayPerMinBps: { type: number }
        windowSecs: { type: number, description: "The raise window, or a buys-only Book's bond clock." }
        buysOnly: { type: [boolean, "null"] }
        bondAfterSecs: { type: [number, "null"] }
        guaranteedBond: { type: [boolean, "null"] }
        antiSnipeSecs: { type: [number, "null"], description: How long the opening tax takes to reach 1%. }
        bondGapSecs: { type: [number, "null"], description: The hour after that before the mark may close the curve. }
        quote: { $ref: "#/components/schemas/BooksAddress", description: The base pair. }
        venue: { $ref: "#/components/schemas/BookVenue" }
        hook:
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        closeFeeBps: { type: [number, "null"], description: "The close fee on a Book's closing value: 200." }
        closeFeeMancerShareBps: { type: [number, "null"], description: "Mancer's share of the close fee: 5,000 of 10,000." }
        traderProfitShareBps: { type: number, description: "The traders' share of the profit left after the close fee: 2,000." }
    BookThesesResponse:
      type: object
      description: A page of a Book's theses.
      required: [votes, theses, nextCursor, mine, users]
      properties:
        viewerRole: { type: [string, "null"], enum: [creator, trader, null], description: "What the session's profile is to the Book, by `role`'s rule: where it is set, the session's vote counts in neither number. Null without a session." }
        votes: { $ref: "#/components/schemas/BookVoteCounts" }
        theses:
          type: array
          items: { $ref: "#/components/schemas/BookThesis" }
        nextCursor: { type: [string, "null"], description: The next page's `cursor`; null on the last page. }
        mine:
          description: "The session's own vote; null without a session."
          anyOf: [{ $ref: "#/components/schemas/BookMyVote" }, { type: "null" }]
        users:
          type: object
          description: The short identity of each listed voter who shows something.
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
          propertyNames: {}
    BookThesis:
      type: object
      description: One wallet's thesis on a Book.
      required: [voter, side, text, trader, verified, at]
      properties:
        role: { type: [string, "null"], enum: [creator, trader, null], description: "What the voter's profile is to the Book: `trader` for a trader who acted on chain, else `creator`; null where it is not the Book's own." }
        voter: { $ref: "#/components/schemas/BooksAddress" }
        side: { $ref: "#/components/schemas/BookVoteSide" }
        text: { type: string, description: "Plain text, line breaks as `\\n`." }
        trader: { type: boolean, description: "The voter is the Book's own: its creator, or a trader who acted. Its vote counts in no number." }
        verified: { type: boolean, description: The voter's account carries Mancer's verified mark now. }
        at: { type: number, description: Unix seconds of its last change. }
    BookTokenMeta:
      type: object
      description: A token an answer names, with what the market knows of it.
      required: [symbol, name, decimals, isStock, verified, priceUsd]
      properties:
        symbol: { type: [string, "null"] }
        name: { type: [string, "null"] }
        decimals: { type: [number, "null"] }
        isStock: { type: boolean, description: An issued stock. }
        verified: { type: boolean, description: On Mancer's verified list. }
        priceUsd: { type: [number, "null"] }
    BookTokenMetaMap:
      type: object
      description: Every token an answer names, by address.
      additionalProperties: { $ref: "#/components/schemas/BookTokenMeta" }
      propertyNames: {}
    BookTraderBook:
      type: object
      description: One Book the wallet created or traded on chain.
      required: [token, name, symbol, role, phase, returnBps, holderReturnBps, vaultReturnBps, final, asOf]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        name: { type: string }
        symbol: { type: string }
        role: { type: string, enum: [creator, trader, creator-trader], description: "`creator`, `trader` (acted, not the creator), or `creator-trader`." }
        phase: { $ref: "#/components/schemas/BookPhase" }
        returnBps: { type: [number, "null"], description: "Trading or frozen: the vault's value less its cost basis, over the cost basis, at the Book's last reading. Null otherwise." }
        holderReturnBps:
          type: [number, "null"]
          description: "Settled: the trading return a holder kept, the settlement's `afterFeesBps` (its NAV after the close fee and the traders' cut, over the cost basis). Null otherwise."
        vaultReturnBps:
          type: [number, "null"]
          description: "Settled: the vault's NAV less its cost basis, over the cost basis, as the settler's `Liquidated` told it, gross of the close fee and the cut, before any later sweep. Null otherwise."
        final: { type: boolean, description: The Book is settled. }
        asOf: { type: [number, "null"], description: Unix seconds of the figure. }
    BookTraderBooksRecord:
      type: object
      description: The wallet's Books, created or traded on chain.
      required: [count, created, traded, settled, live, averageHolderReturnBps, bestHolderReturnBps, averageVaultReturnBps, bestVaultReturnBps, books]
      properties:
        count: { type: number }
        created: { type: number }
        traded: { type: number }
        settled: { type: number }
        live: { type: number }
        averageHolderReturnBps: { type: [number, "null"], description: The settled Books' mean holder return; null where none settled. }
        bestHolderReturnBps: { type: [number, "null"], description: The settled Books' best holder return. }
        averageVaultReturnBps: { type: [number, "null"], description: The settled Books' mean vault return. }
        bestVaultReturnBps: { type: [number, "null"], description: The settled Books' best vault return. }
        books:
          type: array
          description: Every one, newest first.
          items: { $ref: "#/components/schemas/BookTraderBook" }
    BookTraderEthos:
      type: object
      description: A trader's Ethos (ethos.network) reading.
      required: [score, level, reviews, vouches, url]
      properties:
        score: { type: number, description: "The credibility score, 0 to 2,800." }
        level: { $ref: "#/components/schemas/BookEthosLevel" }
        reviews:
          type: object
          required: [positive, neutral, negative]
          properties:
            positive: { type: number }
            neutral: { type: number }
            negative: { type: number }
        vouches: { type: number, description: The vouches it received. }
        url: { type: [string, "null"], description: Its Ethos profile's page; null where it has no Ethos user. }
    BookTraderFiguresStatus:
      type: string
      enum: [ready, computing, unavailable]
      description: "`ready`, `computing` (ask again after `Retry-After`), or `unavailable`."
    BookTraderHistoryItem:
      description: "One item of a trader's history: a trade of its own, or a vault trade it proposed."
      anyOf: [{ $ref: "#/components/schemas/BookTraderSwapItem" }, { $ref: "#/components/schemas/BookTraderVaultItem" }]
    BookTraderHistoryResponse:
      type: object
      description: A trader's own trades and the executed vault trades it proposed, newest first.
      required: [address, status, computedAt, salesCutBlock, partial, items, nextBefore, tokens]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        status: { $ref: "#/components/schemas/BookTraderFiguresStatus" }
        computedAt: { type: [number, "null"] }
        salesCutBlock: { type: [number, "null"], description: "At or below this block, an own trade with no figure may have sold." }
        partial: { type: boolean, description: Some vault trades carry no figure this time. }
        items:
          type: array
          items: { $ref: "#/components/schemas/BookTraderHistoryItem" }
        nextBefore: { type: [string, "null"], description: The next page's `before`; null on the last page. }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookTraderRecordResponse:
      type: object
      description: A wallet's record as a Books trader.
      required: [address, books, status, trading, computedAt]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        books: { $ref: "#/components/schemas/BookTraderBooksRecord" }
        status: { $ref: "#/components/schemas/BookTraderFiguresStatus" }
        trading:
          description: Null unless `status` is `ready`.
          anyOf: [{ $ref: "#/components/schemas/BookTraderTradingRecord" }, { type: "null" }]
        computedAt: { type: [number, "null"], description: Unix seconds; null unless `status` is `ready`. }
    BookTraderRow:
      type: object
      description: One of the top traders.
      required: [address, books, live, settled, bestReturnBps, liveBestReturnBps, cutEarnedWei, latestBook]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        books: { type: number }
        live: { type: number }
        settled: { type: number }
        bestReturnBps: { type: [number, "null"], description: The best settled Book's return. }
        liveBestReturnBps: { type: [number, "null"], description: "The best trading return (`rank.tradingReturnBps`) of its live Books, at their last readings." }
        cutEarnedWei: { $ref: "#/components/schemas/BooksUnits", description: This trader's share of the traders' cut over settled Books. }
        latestBook: { $ref: "#/components/schemas/BooksAddress", description: The newest Book of the trader. }
    BookTraderSwapItem:
      type: object
      description: One of the wallet's own trades.
      required:
        - kind
        - txHash
        - blockNumber
        - timestamp
        - token
        - tokenSymbol
        - cash
        - cashSymbol
        - side
        - amountToken
        - amountCash
        - priceUsd
        - volumeUsd
        - venue
        - realized
      properties:
        kind: { type: string, const: swap }
        txHash: { $ref: "#/components/schemas/BooksHex" }
        blockNumber: { type: number }
        timestamp: { type: number }
        token: { $ref: "#/components/schemas/BooksAddress" }
        tokenSymbol: { type: [string, "null"] }
        cash: { $ref: "#/components/schemas/BooksAddress" }
        cashSymbol: { type: [string, "null"] }
        side: { type: string, enum: [buy, sell] }
        amountToken: { type: [number, "null"] }
        amountCash: { type: [number, "null"] }
        priceUsd: { type: number }
        volumeUsd: { type: number }
        venue: { type: string }
        realized:
          anyOf: [{ $ref: "#/components/schemas/BookRealized" }, { type: "null" }]
    BookTraderTradingRecord:
      type: object
      description: The wallet's own trading. WETH and USDG are cash, and liquidity moves are no trades.
      required: [realizedUsd, realizedEth, winRateBps, tokensWon, tokensSold, trades, tokensTraded, firstTradeAt, thin, estimated, truncated]
      properties:
        realizedUsd: { type: number }
        realizedEth: { type: [number, "null"], description: Null where ETH's prices did not read. }
        winRateBps: { type: [number, "null"], description: The tokens sold at a gain over the tokens sold; null where the record is thin or nothing was sold. }
        tokensWon: { type: number }
        tokensSold: { type: number }
        trades: { type: number }
        tokensTraded: { type: number }
        firstTradeAt: { type: [number, "null"], description: Unix seconds of its first trade. }
        thin: { type: boolean, description: "Fewer than 20 trades: no rate is shown." }
        estimated: { type: boolean, description: Some moves were priced at an estimate. }
        truncated: { type: boolean, description: The record is not whole. }
    BookTraderVaultItem:
      type: object
      description: One vault trade the wallet proposed, executed.
      required: [kind, book, digest, txHash, blockNumber, timestamp, tokenIn, tokenOut, amountIn, amountOut, realized]
      properties:
        kind: { type: string, const: vault-trade }
        book:
          type: object
          required: [token, name, symbol]
          properties:
            token: { $ref: "#/components/schemas/BooksAddress" }
            name: { type: string }
            symbol: { type: string }
        digest: { $ref: "#/components/schemas/BooksHex" }
        txHash: { $ref: "#/components/schemas/BooksHex" }
        blockNumber: { type: number }
        timestamp: { type: number }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        amountOut: { $ref: "#/components/schemas/BooksUnits" }
        realized:
          anyOf: [{ $ref: "#/components/schemas/BookRealized" }, { type: "null" }]
    BookTradesResponse:
      type: object
      description: A vault's trades, newest first.
      required: [trades, nextBefore, tokens]
      properties:
        trades:
          type: array
          items: { $ref: "#/components/schemas/BookVaultTrade" }
        nextBefore: { type: [number, "null"] }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookTrust:
      type: string
      enum: [trusted, plain, flagged]
      description: A Book's trust, read of its creator and the traders who acted.
    BookUnredeemable:
      type: object
      description: "What never redeems once a Book settled: the tokens behind NFTs stuck in the market's vault and tokens sent to it, and the pot they keep."
      required: [tokens, potShareWei]
      properties:
        tokens: { $ref: "#/components/schemas/BooksUnits" }
        potShareWei: { $ref: "#/components/schemas/BooksUnits" }
    BookValue:
      type: object
      description: "What a settlement now would fix, while a Book trades or is frozen: the close fee first, then the traders' cut."
      required:
        - navWei
        - lpPotWei
        - owedLpFeesWei
        - closeFeeWei
        - closeFeeMancerWei
        - closeFeeProtocolWei
        - holderPotWei
        - circulating
        - backingPerTokenWei
        - returnBps
        - afterFeesBps
        - priceToBackingBps
        - partial
        - approx
        - asOf
      properties:
        navWei: { $ref: "#/components/schemas/BooksUnits", description: The vault's value in WETH wei. }
        lpPotWei:
          description: "What the locked market would return to holders now, in WETH: it takes no close fee and no cut, and is inside `holderPotWei`."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        owedLpFeesWei: { $ref: "#/components/schemas/BooksUnits", description: "The locked market's base-pair fees not yet harvested, in WETH." }
        closeFeeWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeMancerWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeProtocolWei:
          description: StonkBrokers' half of the close fee.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        holderPotWei: { $ref: "#/components/schemas/BooksUnits", description: "The holders' pot, the locked market's return included." }
        circulating:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        backingPerTokenWei:
          description: "The holders' pot over circulating: WETH wei per whole token."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        returnBps: { type: [number, "null"], description: "The vault's gain over its cost basis in basis points, (value less cost basis) over cost basis, gross of the close fee and the traders' cut." }
        afterFeesBps:
          type: [number, "null"]
          description: "The trading pot's return after the close fee and the traders' cut: the holders' pot less the LP pot, over the cost basis. The LP pot is the locked liquidity's own principal."
        priceToBackingBps: { type: [number, "null"], description: The market price over the backing. }
        partial: { type: boolean, description: "Always false: a Book's value always reads whole. Kept for clients built before it." }
        approx: { type: boolean, description: "A holding is valued at a reference price, not a route, or at a sale priced for another amount and scaled." }
        asOf: { $ref: "#/components/schemas/BooksHead" }
    BookValueSource:
      type: string
      enum: [weth, burned-at-settlement, mancer-plan, reference, none]
      description: "How a holding is valued: `weth`, `burned-at-settlement` (the Book's own token), `mancer-plan` (a route Mancer planned), `reference` (a reference price), or `none`."
    BookVaultHolding:
      type: object
      description: One token the vault tracks.
      required: [token, symbol, decimals, isWeth, isBook, tracked, balance, valueWei, valueSource, sellable, policy, readFailed]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        symbol: { type: [string, "null"] }
        decimals: { type: [number, "null"] }
        isWeth: { type: boolean }
        isBook: { type: boolean }
        tracked:
          description: The vault's tracked balance.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        balance:
          description: What the vault holds.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        valueWei:
          description: What it sells for, in WETH wei.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        valueSource: { $ref: "#/components/schemas/BookValueSource" }
        sellable: { type: boolean, description: "A settlement can sell it now." }
        policy: { type: [string, "null"], description: "Always null on a Book's page: each token's verdict is the policy route's." }
        readFailed: { type: [string, "null"], description: "Why this token's value did not read, where it did not: its read failed, or it has no plan to WETH." }
    BookVaultIntent:
      type: object
      description: The `TradeIntent` `proposeTrade` takes, at the vault's `tradeNonce()`.
      required: [adapter, tokenIn, tokenOut, amountIn, minOut, route, nonce, deadline, quoteSalt, mancerSig]
      properties:
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minOut: { $ref: "#/components/schemas/BooksUnits" }
        route: { $ref: "#/components/schemas/BooksHex" }
        nonce: { type: string }
        deadline: { type: string }
        quoteSalt: { type: string }
        mancerSig: { $ref: "#/components/schemas/BooksHex" }
    BookVaultPnl:
      type: object
      description: "The vault's positions and trades in WETH wei."
      required: [realizedWei, unrealizedWei, positions, trades, partial, asOf]
      properties:
        realizedWei: { $ref: "#/components/schemas/BooksSignedUnits" }
        unrealizedWei:
          description: Null where the Book has no valuation of its holdings.
          anyOf: [{ $ref: "#/components/schemas/BooksSignedUnits" }, { type: "null" }]
        positions:
          type: array
          items: { $ref: "#/components/schemas/BookVaultPosition" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/BookVaultTradePnl" }
        partial: { type: boolean, description: A figure did not read whole; a later read may carry it. }
        asOf:
          description: The valuation the unrealized figure reads.
          anyOf:
            - type: object
              properties:
                block: { type: number }
                timestamp: { type: number }
              required: [block, timestamp]
            - { type: "null" }
    BookVaultPnlResponse:
      type: object
      description: "A vault's PnL."
      required: [pnl, tokens]
      properties:
        pnl: { $ref: "#/components/schemas/BookVaultPnl" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookVaultPosition:
      type: object
      description: "One of the vault's positions."
      required: [token, boughtUnits, spentWei, soldUnits, receivedWei, realizedWei, heldUnits, valueWei, unrealizedWei]
      properties:
        token: { $ref: "#/components/schemas/BooksAddress" }
        boughtUnits: { $ref: "#/components/schemas/BooksUnits" }
        spentWei: { $ref: "#/components/schemas/BooksUnits" }
        soldUnits: { $ref: "#/components/schemas/BooksUnits" }
        receivedWei: { $ref: "#/components/schemas/BooksUnits" }
        realizedWei: { $ref: "#/components/schemas/BooksSignedUnits", description: What its sales received less the cost of what they sold. }
        heldUnits:
          description: "What the vault holds of it, at the Book's last reading."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        valueWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        unrealizedWei:
          description: "Its value less the cost of what is held, at the Book's last reading."
          anyOf: [{ $ref: "#/components/schemas/BooksSignedUnits" }, { type: "null" }]
    BookVaultQuotePlan:
      type: object
      description: The route decoded, with what it delivers.
      required:
        - amountIn
        - deadline
        - expectedOut
        - feeAsset
        - feeBps
        - feeMode
        - legs
        - middlesSwept
        - minAmountOut
        - priceImpactBps
        - recipient
        - route
        - tokenIn
        - tokenOut
      properties:
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minAmountOut: { $ref: "#/components/schemas/BooksUnits", description: The route's floor. }
        recipient: { $ref: "#/components/schemas/BooksAddress", description: "Who the route pays: the vault." }
        deadline: { type: number }
        feeBps: { type: number, description: Mancer's swap fee inside the route. }
        feeMode: { type: string, enum: [input, output, mid] }
        legs:
          type: array
          description: The route's legs.
          items:
            type: object
            properties:
              tokenIn: { $ref: "#/components/schemas/BooksAddress" }
              tokenOut: { $ref: "#/components/schemas/BooksAddress" }
              amountIn: { $ref: "#/components/schemas/BooksUnits" }
            required: [tokenIn, tokenOut, amountIn]
        expectedOut: { $ref: "#/components/schemas/BooksUnits", description: "The route's output, gross of Mancer's fee." }
        priceImpactBps: { type: number }
        feeAsset: { $ref: "#/components/schemas/BooksAddress" }
        middlesSwept: { type: boolean, description: Every middle token is spent whole. }
        route: { $ref: "#/components/schemas/BookQuoteRoute" }
    BookVaultQuoteRequest:
      type: object
      description: A vault quote request. A field it does not name is refused.
      required: [purpose, tokenIn]
      properties:
        wallet:
          $ref: "#/components/schemas/Address"
          description: "The wallet that will send the transaction, which your servers vouch for (`wallet-required` without it): a trader of the Book for a trade, and a wallet that may settle it for a sweep."
        purpose: { type: string, enum: [trade, sweep], description: "`trade` while the Book trades, or `sweep` once it settled." }
        tokenIn: { $ref: "#/components/schemas/Address", description: An ERC-20 the vault tracks (a trade) or holds (a sweep). }
        tokenOut: { $ref: "#/components/schemas/Address", description: Required for a trade. A sweep sells for WETH. }
        amountIn: { type: string, pattern: "^[1-9][0-9]*$", description: "Raw units above zero. A trade's amount, at most what the vault tracks. A sweep's, at most what it holds, all of it by default." }
        slippageBps: { type: number, description: "The floor's band under what the route delivered: 10 to 30 with one trader, 30 to 100 with several, 50 to 150 for a sweep." }
        deadlineSec: { type: number, description: "The quote's life in seconds, its purpose's shortest: 300 with one trader or for a sweep, and 900 with several traders. It may name only that, and any other is 400 `bad-body`." }
        vault: { $ref: "#/components/schemas/Address", description: Optional; the Book's vault. }
        preview: { type: boolean, const: true, description: "Every check and the simulation, and no signature." }
        pendingDigest: { type: string, pattern: "^0x[0-9a-fA-F]{64}$", description: "With `preview`, the vault's `pendingDigest()`, 32 bytes of hex: a preview of the pending trade." }
    BookVaultQuoteResponse:
      type: object
      description: "A signed vault quote: the `MancerQuote` at the top level, and its intent, plan, simulation and policy beside it."
      required:
        - purpose
        - preview
        - adapter
        - tokenIn
        - tokenOut
        - amountIn
        - minOut
        - route
        - deadline
        - salt
        - signature
        - digest
        - intent
        - plan
        - simulation
        - policy
        - replaces
        - closeFeeDeltaWei
        - closeFeeDeltaMancerWei
        - closeFeeDeltaProtocolWei
        - signer
        - deployment
        - bookId
        - vault
        - head
        - tokens
      properties:
        purpose: { type: string, enum: [trade, sweep] }
        preview: { type: boolean }
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minOut: { $ref: "#/components/schemas/BooksUnits" }
        route: { $ref: "#/components/schemas/BooksHex" }
        deadline: { type: string }
        salt: { type: string }
        signature:
          description: Mancer's signature; null on a preview, and `0x` on a sweep of WETH or of the Book token, which is unsigned.
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        digest:
          description: The quote's EIP-712 digest, equal to the vault's `hashQuote`; null on a preview and on a sweep of WETH or of the Book token.
          anyOf: [{ $ref: "#/components/schemas/BooksHex" }, { type: "null" }]
        intent:
          description: The trade's intent; null on a preview and for a sweep.
          anyOf: [{ $ref: "#/components/schemas/BookVaultIntent" }, { type: "null" }]
        plan:
          description: The route decoded; null for a sweep of WETH or the Book token.
          anyOf: [{ $ref: "#/components/schemas/BookVaultQuotePlan" }, { type: "null" }]
        simulation:
          description: "The vault's own call simulated at the head, and its gas: for a trade, what the vault gained; for a sweep, the WETH it added to the holders' pot. Null on a sweep of WETH or of the Book token."
          anyOf:
            - type: object
              properties:
                amountOut: { $ref: "#/components/schemas/BooksUnits" }
                proposeGas: { type: [number, "null"] }
                executeGas: { type: [number, "null"] }
                block: { type: number }
              required: [amountOut, proposeGas, executeGas, block]
            - { type: "null" }
        policy:
          type: object
          required: [bandBps, deadlineSec, impactBps, divergenceBps, solo, access, budget, notionalWei]
          properties:
            bandBps: { type: number }
            deadlineSec: { type: number }
            impactBps: { type: number }
            divergenceBps: { type: [number, "null"], description: "How far the route's rate sits under the reference prices, after the route's own pool fees up to the policy's allowance; null for a sweep of WETH or of the Book token." }
            solo: { type: boolean }
            access: { $ref: "#/components/schemas/BookSigningAccess" }
            budget: { $ref: "#/components/schemas/BookSignBudget" }
            notionalWei:
              description: What the budget counts for this trade, in WETH; null for a sweep.
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        replaces:
          description: The pending trade a proposal of this quote replaces, and who had confirmed it.
          anyOf:
            - type: object
              properties:
                digest: { $ref: "#/components/schemas/BooksHex" }
                confirmedBy:
                  type: array
                  items: { $ref: "#/components/schemas/BooksAddress" }
              required: [digest, confirmedBy]
            - { type: "null" }
        closeFeeDeltaWei:
          description: A sweep's close fee on the WETH it adds to the pot; null for a trade.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeDeltaMancerWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        closeFeeDeltaProtocolWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        signer:
          description: The address that signed; null on a preview and on a sweep of WETH or of the Book token.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string, description: "The Book's id on its factory." }
        vault: { $ref: "#/components/schemas/BooksAddress", description: "The vault the quote is signed for: the one the Book's factory names. Read it on your own node before you sign." }
        head: { $ref: "#/components/schemas/BooksHead" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookVaultState:
      type: object
      description: The Book's vault.
      required: [address, tradeNonce, trackedCount, maxTracked, holdings, untracked, pending, orders, budget]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        tradeNonce: { type: string, description: The vault's `tradeNonce()`. }
        trackedCount: { type: number, description: How many tokens it tracks. }
        maxTracked: { type: number, description: "The most it may track: 16." }
        holdings:
          type: array
          items: { $ref: "#/components/schemas/BookVaultHolding" }
        untracked:
          type: array
          description: Tokens it holds and does not track, which only a sweep sells.
          items:
            type: object
            properties:
              token: { $ref: "#/components/schemas/BooksAddress" }
              symbol: { type: [string, "null"] }
              balance: { $ref: "#/components/schemas/BooksUnits" }
            required: [token, symbol, balance]
        pending:
          description: The pending trade, where one waits.
          anyOf: [{ $ref: "#/components/schemas/BookPendingIntent" }, { type: "null" }]
        orders:
          description: The pending order and every order granted.
          anyOf:
            - type: object
              properties:
                orderNonce: { type: string }
                pending:
                  anyOf: [{ $ref: "#/components/schemas/BookPendingOrder" }, { type: "null" }]
                grants:
                  type: array
                  items: { $ref: "#/components/schemas/BookGrantRow" }
              required: [orderNonce, pending, grants]
            - { type: "null" }
        budget:
          description: "Always null on a Book's page: the vault's signed budget is the policy route's (`GET /v1/books/{token}/policy`)."
          anyOf:
            - type: object
              properties:
                hourUsedBps: { type: number }
                dayUsedBps: { type: number }
              required: [hourUsedBps, dayUsedBps]
            - { type: "null" }
    BookVaultTrade:
      type: object
      description: One vault trade, one row a proposal.
      required: [digest, status, proposed, confirmations, executed, adapter, adapterKind, tokenIn, tokenOut, amountIn, minOut, route]
      properties:
        digest: { $ref: "#/components/schemas/BooksHex" }
        status: { type: string, enum: [executed, pending, replaced, expired] }
        proposed:
          type: object
          required: [block, time, tx, by]
          properties:
            block: { type: number }
            time: { type: number }
            tx: { $ref: "#/components/schemas/BooksHex" }
            by:
              description: The trader who proposed it.
              anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        confirmations:
          type: array
          items:
            type: object
            properties:
              trader: { $ref: "#/components/schemas/BooksAddress" }
              block: { type: number }
              tx: { $ref: "#/components/schemas/BooksHex" }
            required: [trader, block, tx]
        executed:
          anyOf:
            - type: object
              properties:
                block: { type: number }
                time: { type: number }
                tx: { $ref: "#/components/schemas/BooksHex" }
                amountOut: { $ref: "#/components/schemas/BooksUnits" }
              required: [block, time, tx, amountOut]
            - { type: "null" }
        adapter: { $ref: "#/components/schemas/BooksAddress" }
        adapterKind: { type: string, enum: [uniswap, mancer, unknown] }
        tokenIn: { $ref: "#/components/schemas/BooksAddress" }
        tokenOut: { $ref: "#/components/schemas/BooksAddress" }
        amountIn: { $ref: "#/components/schemas/BooksUnits" }
        minOut: { $ref: "#/components/schemas/BooksUnits" }
        route:
          type: object
          description: The route by its legs.
          required: [kind, legs]
          properties:
            kind: { type: string, enum: [one-hop-1pct, uniswap-path, mancer-plan] }
            legs:
              type: array
              items:
                type: object
                properties:
                  tokenIn: { $ref: "#/components/schemas/BooksAddress" }
                  tokenOut: { $ref: "#/components/schemas/BooksAddress" }
                required: [tokenIn, tokenOut]
    BookVaultTradePnl:
      type: object
      description: "One executed vault trade, as the PnL counts it."
      required: [digest, tx, priced, valueWei, realizedWei]
      properties:
        digest: { $ref: "#/components/schemas/BooksHex" }
        tx: { $ref: "#/components/schemas/BooksHex" }
        priced: { type: string, enum: [exact, estimated, unpriced], description: "`exact` (a WETH leg), `estimated` (priced in US dollars over that day's ETH price) or `unpriced`." }
        valueWei:
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        realizedWei:
          description: "What a sale realized, in WETH wei; null on a purchase, a trade of cash, a trade nothing priced, and a sale of a token the vault held none of."
          anyOf: [{ $ref: "#/components/schemas/BooksSignedUnits" }, { type: "null" }]
    BookVenue:
      type: string
      enum: [uniswap-v3, uniswap-v4]
      description: "Where a Book's market is locked: Uniswap v3, or Uniswap v4."
    BookVenueState:
      type: object
      description: The venue a Book named at its open, and where it bonded.
      required: [requested, bonded, fellBack, hook]
      properties:
        requested: { $ref: "#/components/schemas/BookVenue" }
        bonded:
          description: Null until bonded.
          anyOf: [{ $ref: "#/components/schemas/BookVenue" }, { type: "null" }]
        fellBack: { type: boolean, description: A v4 lock that fell back to v3. }
        hook:
          description: The v4 hook the Book named; null for none.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
    BookVoteCounts:
      type: object
      description: "A Book's votes: the wallets on each side that carry Mancer's verified mark now, the Book's own creator and acted traders left out."
      required: [up, down]
      properties:
        up: { type: number }
        down: { type: number }
    BookVoteSide:
      type: string
      enum: [up, down]
      description: A wallet's side on a Book.
    BookWalletNext:
      type: string
      enum: [arm, graduate, bond, liquidate, unstake-then-redeem, redeem, unwrap-then-redeem, claim-cut, claim-fees, confirm]
      description: "What the wallet can do next on a Book: the first that applies, in the order arm, graduate or bond, confirm, liquidate, unstake-then-redeem, redeem, unwrap-then-redeem, claim-cut, claim-fees."
    BookWalletNfts:
      type: object
      description: The Book NFTs the wallet holds of the Book's market.
      required: [collection, count, ids, truncated, tokens, redeemAfterUnwrap]
      properties:
        collection: { $ref: "#/components/schemas/BooksAddress" }
        count: { type: number }
        ids:
          type: array
          description: At most 100, lowest first.
          items: { type: string }
        truncated: { type: boolean }
        tokens: { $ref: "#/components/schemas/BooksUnits", description: The Book tokens behind them. }
        redeemAfterUnwrap:
          description: "A settled Book: what those tokens redeem for once unwrapped, and the unwraps' fee now."
          anyOf:
            - type: object
              properties:
                tokens: { $ref: "#/components/schemas/BooksUnits" }
                payoutWei: { $ref: "#/components/schemas/BooksUnits" }
                unwrapFeeWei:
                  anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
              required: [tokens, payoutWei, unwrapFeeWei]
            - { type: "null" }
    BookWalletResponse:
      type: object
      description: A wallet's Books.
      required: [head, wallet, partial, books, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        wallet: { $ref: "#/components/schemas/BooksAddress" }
        partial: { type: boolean, description: "A part of the answer did not read: a row names what it lacks in `unread`." }
        indexedBlock: { type: [number, "null"], description: The block the answer's figures have read through; null where one did not say. }
        ledgerUnread: { type: boolean, const: true, description: "What the wallet holds did not read, and the Books it only holds are left out. Present only where it did not." }
        books:
          type: array
          items: { $ref: "#/components/schemas/BookWalletRow" }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BookWalletRow:
      type: object
      description: One Book the wallet touches.
      required:
        - token
        - deployment
        - bookId
        - displayName
        - symbol
        - phase
        - step
        - flags
        - quote
        - raise
        - nameFlag
        - logo
        - roles
        - held
        - staked
        - earned
        - boughtOnCurve
        - atBackingWei
        - atPriceWei
        - redeemable
        - cutOwedWei
        - pendingOnYou
        - nfts
        - next
      properties:
        listed: { type: boolean, description: "The board lists the Book: it is armed and names a target beyond WETH, USDG and its base pair." }
        token: { $ref: "#/components/schemas/BooksAddress", description: "The Book token, which names the Book." }
        deployment: { $ref: "#/components/schemas/BookDeploymentRef" }
        bookId: { type: string, description: "The Book's id on its deployment. Name a Book by its token." }
        displayName: { type: string }
        symbol: { type: string }
        phase: { $ref: "#/components/schemas/BookPhase" }
        step: { $ref: "#/components/schemas/BookStep" }
        flags: { $ref: "#/components/schemas/BookStepFlags" }
        quote: { $ref: "#/components/schemas/BookQuoteRef", description: The Book's base pair. }
        raise:
          description: The raise while the Book waits, raises or has graduated; null after.
          anyOf: [{ $ref: "#/components/schemas/BookRaiseSummary" }, { type: "null" }]
        nameFlag:
          type: [string, "null"]
          enum: [impersonator, null]
          description: "`impersonator` where the Book's symbol is a verified token's symbol, or its name or symbol holds a protected name as a whole word (Mancer, StonkBrokers, TOKENIZE): such a Book is never ranked."
        logo: { type: [string, "null"], description: The Book's logo path; null where none was set. }
        roles:
          type: object
          description: The wallet's roles on the Book.
          required: [creator, trader, operatorNftId, operatorNft, marketMaker]
          properties:
            traderActed: { type: boolean, description: "The wallet acted in its seat on chain (confirmed a trade or an order, or settled the Book), or is the creator in its own seat." }
            creator: { type: boolean }
            trader: { type: boolean }
            operatorNftId: { type: [string, "null"] }
            operatorNft:
              anyOf:
                - type: object
                  properties:
                    address: { $ref: "#/components/schemas/BooksAddress" }
                    tokenId: { type: string }
                  required: [address, tokenId]
                - { type: "null" }
            marketMaker: { type: boolean, description: "The wallet made the Book's NFT market, and may change its image." }
        held: { $ref: "#/components/schemas/BooksUnits", description: The Book tokens it holds. }
        staked: { $ref: "#/components/schemas/BooksUnits", description: The Book tokens it staked. }
        earned:
          type: object
          description: "Its staking fees: the base pair's and the Book token's."
          required: [quote, bookWei]
          properties:
            quote: { $ref: "#/components/schemas/BooksUnits" }
            bookWei: { $ref: "#/components/schemas/BooksUnits" }
        boughtOnCurve:
          description: What the curve will buy back from it.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        atBackingWei:
          description: "Its held and staked tokens at a token's worth, in WETH wei: what each would redeem for if the Book settled now, or once settled `final.payoutPerTokenWei`. Null before the bond, if cancelled or unread."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        atPriceWei:
          description: What its tokens are worth at the market price.
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
        redeemable:
          description: "A settled Book: the tokens it holds and what they redeem for."
          anyOf:
            - type: object
              properties:
                amount: { $ref: "#/components/schemas/BooksUnits" }
                payoutWei: { $ref: "#/components/schemas/BooksUnits" }
              required: [amount, payoutWei]
            - { type: "null" }
        cutOwedWei: { $ref: "#/components/schemas/BooksUnits", description: The traders' cut it is owed. }
        pendingOnYou:
          description: A vault trade or order that waits on this trader's confirmation.
          anyOf:
            - type: object
              properties:
                kind: { type: string, enum: [trade, order] }
                digest: { $ref: "#/components/schemas/BooksHex" }
              required: [kind, digest]
            - { type: "null" }
        nfts:
          description: Its Book NFTs; null where it holds none.
          anyOf: [{ $ref: "#/components/schemas/BookWalletNfts" }, { type: "null" }]
        next:
          anyOf: [{ $ref: "#/components/schemas/BookWalletNext" }, { type: "null" }]
        unread:
          type: array
          description: The figures of this row that did not read, never to be read as none. Present only where one did not.
          items: { $ref: "#/components/schemas/BookWalletUnread" }
    BookWalletUnread:
      type: string
      enum: [held, staked, earned, cutOwed, boughtOnCurve, redeemable, operatorNft, pendingOnYou]
      description: A row's figure that did not read.
    BooksActivityResponse:
      type: object
      description: Activity across every Book, newest first, a page cut at a block's end.
      required: [head, items, partial, nextBefore, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        items:
          type: array
          items: { $ref: "#/components/schemas/BookActivityItem" }
        partial: { type: boolean, description: "The market swaps did not read, and are left out." }
        nextBefore: { type: [number, "null"], description: The next page's `before`; null on the last page. }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap" }
    BooksAddress:
      type: string
      pattern: ^0x[0-9a-f]{40}$
      description: A lowercase 20-byte hex address.
      example: "0x0bd7d308f8e1639fab988df18a8011f41eacad73"
    BooksBoardResponse:
      type: object
      description: A page of the board.
      required: [head, indexedBlock, counts, books, nextOffset, tokens]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        indexedBlock: { type: [number, "null"], description: The lowest block the index has read every deployment through; null where no deployment passed Mancer's checks. }
        counts:
          type: object
          description: Each phase's count over the search, before the phase filter.
          required: [waiting, raising, graduated, trading, frozen, settled, aborted]
          properties:
            waiting: { type: number }
            raising: { type: number }
            graduated: { type: number }
            trading: { type: number }
            frozen: { type: number }
            settled: { type: number }
            aborted: { type: number }
        books:
          type: array
          items: { $ref: "#/components/schemas/BookSummary" }
        nextOffset: { type: [number, "null"], description: The next page's offset; null on the last page. }
        tokens: { $ref: "#/components/schemas/BookTokenMetaMap", description: "Every token the page names: its Books, their holdings and their targets." }
    BooksDeploymentsResponse:
      type: object
      description: Every deployment of the Books contracts Mancer serves.
      required: [deployments]
      properties:
        deployments:
          type: array
          items: { $ref: "#/components/schemas/BookDeploymentView" }
    BooksHead:
      type: object
      description: The chain head a figure was read at.
      required: [block, timestamp]
      properties:
        block: { type: number }
        timestamp: { type: number, description: Chain seconds. }
    BooksHex:
      type: string
      pattern: ^0x[0-9a-fA-F]*$
      description: "`0x`-prefixed hex."
    BooksShortIdentity:
      type: object
      description: A wallet as a list shows it. Every field but the address is null where the wallet shows nothing of it.
      required: [address, username, displayName, avatar, verified, x]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        username: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        avatar: { type: [string, "null"], description: The picture's path on the API. }
        verified:
          description: The verified mark, and what earned it.
          anyOf:
            - type: object
              properties:
                basis: { type: string, enum: [x-followers, mancer] }
              required: [basis]
            - { type: "null" }
        x:
          anyOf:
            - type: object
              properties:
                username: { type: string }
              required: [username]
            - { type: "null" }
    BooksSignedUnits:
      type: string
      pattern: ^-?[0-9]+$
      description: An integer of raw units as a decimal string, negative where a fee or a loss is more than what it is set against.
    BooksStats:
      type: object
      description: The figures of a set of Books.
      required: [books, raise, vaults, closeFee, nftMarket]
      properties:
        books:
          type: object
          required: [total, byPhase]
          properties:
            total: { type: number }
            byPhase:
              type: object
              required: [waiting, raising, graduated, trading, frozen, settled, aborted]
              properties:
                waiting: { type: number }
                raising: { type: number }
                graduated: { type: number }
                trading: { type: number }
                frozen: { type: number }
                settled: { type: number }
                aborted: { type: number }
        raise:
          type: object
          description: The bonded Books' raises in WETH, and the curve's buys and sales.
          required: [raisedEthWei, buys, sells]
          properties:
            raisedEthWei: { $ref: "#/components/schemas/BooksUnits" }
            buys: { type: number }
            sells: { type: number }
        vaults:
          type: object
          description: The vaults' executed trades and granted orders.
          required: [trades, ordersGranted]
          properties:
            trades: { type: number }
            ordersGranted: { type: number }
        closeFee:
          type: object
          description: The close fee accrued across every Book, claimed by each recipient, and owed.
          required: [bps, accruedWei, mancerWei, protocolWei, claimedWei, owedWei]
          properties:
            bps: { type: number }
            accruedWei: { $ref: "#/components/schemas/BooksUnits" }
            mancerWei: { $ref: "#/components/schemas/BooksUnits" }
            protocolWei: { $ref: "#/components/schemas/BooksUnits" }
            claimedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
            owedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
        nftMarket:
          type: object
          description: "The Book NFT markets that passed their checks: the NFTs moved through them, and their fees."
          required: [markets, nftsMoved, wrapped, unwrapped, sold, bought, feesWei, mancerWei, protocolWei, flushedWei, owedWei]
          properties:
            markets: { type: number }
            nftsMoved: { type: number }
            wrapped: { type: number }
            unwrapped: { type: number }
            sold: { type: number }
            bought: { type: number }
            feesWei: { $ref: "#/components/schemas/BooksUnits" }
            mancerWei: { $ref: "#/components/schemas/BooksUnits" }
            protocolWei: { $ref: "#/components/schemas/BooksUnits" }
            flushedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
            owedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
    BooksStatsDeployment:
      type: object
      description: One deployment's figures.
      required: [books, closeFee, factory, label, nftMarket, raise, settlerReservedWethWei, vaults]
      properties:
        books:
          type: object
          required: [total, byPhase]
          properties:
            total: { type: number }
            byPhase:
              type: object
              required: [waiting, raising, graduated, trading, frozen, settled, aborted]
              properties:
                waiting: { type: number }
                raising: { type: number }
                graduated: { type: number }
                trading: { type: number }
                frozen: { type: number }
                settled: { type: number }
                aborted: { type: number }
        raise:
          type: object
          description: The bonded Books' raises in WETH, and the curve's buys and sales.
          required: [raisedEthWei, buys, sells]
          properties:
            raisedEthWei: { $ref: "#/components/schemas/BooksUnits" }
            buys: { type: number }
            sells: { type: number }
        vaults:
          type: object
          description: The vaults' executed trades and granted orders.
          required: [trades, ordersGranted]
          properties:
            trades: { type: number }
            ordersGranted: { type: number }
        closeFee:
          type: object
          description: The close fee accrued across every Book, claimed by each recipient, and owed.
          required: [bps, accruedWei, mancerWei, protocolWei, claimedWei, owedWei]
          properties:
            bps: { type: number }
            accruedWei: { $ref: "#/components/schemas/BooksUnits" }
            mancerWei: { $ref: "#/components/schemas/BooksUnits" }
            protocolWei: { $ref: "#/components/schemas/BooksUnits" }
            claimedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
            owedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
        nftMarket:
          type: object
          description: "The Book NFT markets that passed their checks: the NFTs moved through them, and their fees."
          required: [markets, nftsMoved, wrapped, unwrapped, sold, bought, feesWei, mancerWei, protocolWei, flushedWei, owedWei]
          properties:
            markets: { type: number }
            nftsMoved: { type: number }
            wrapped: { type: number }
            unwrapped: { type: number }
            sold: { type: number }
            bought: { type: number }
            feesWei: { $ref: "#/components/schemas/BooksUnits" }
            mancerWei: { $ref: "#/components/schemas/BooksUnits" }
            protocolWei: { $ref: "#/components/schemas/BooksUnits" }
            flushedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
            owedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
        factory: { $ref: "#/components/schemas/BooksAddress" }
        label: { type: string }
        settlerReservedWethWei:
          description: "What the settlement contract holds now: every settled Book's pot, unclaimed cuts and unclaimed close fees together."
          anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
    BooksStatsResponse:
      type: object
      description: Books in numbers, in total and by each deployment that has a listed Book.
      required: [head, indexedBlock, total, deployments]
      properties:
        head: { $ref: "#/components/schemas/BooksHead" }
        indexedBlock: { type: [number, "null"], description: The lowest block the index has read every deployment through. }
        total: { $ref: "#/components/schemas/BooksStats" }
        deployments:
          type: array
          items: { $ref: "#/components/schemas/BooksStatsDeployment" }
    BooksTradersResponse:
      type: object
      description: The top traders over the ranked Books.
      required: [traders]
      properties:
        traders:
          type: array
          items: { $ref: "#/components/schemas/BookTraderRow" }
    BooksUnits:
      type: string
      pattern: ^[0-9]+$
      description: A non-negative integer of raw units, as a decimal string.
      example: "1000000000000000000"
    NftArtReason:
      type: string
      enum: [held, host-not-allowed, not-an-image, too-large, copies-verified-art, off, unverified]
      description: Why the collection's picture is not served.
    NftMarketAction:
      type: string
      enum: [open, wrap, unwrap, sell, buy-oldest, buy-specific, set-image]
      description: A market call.
    NftMarketNone:
      type: object
      description: A Book with no market yet.
      required: [exists, operators, canOpen]
      properties:
        exists: { type: boolean, const: false }
        operators:
          type: array
          description: "Who may open it: the creator, and the operator NFT's holder once it moved after settlement."
          items: { $ref: "#/components/schemas/BooksAddress" }
        canOpen: { type: boolean, description: False once the Book is cancelled. }
    NftMarketOpen:
      type: object
      description: A Book's NFT market.
      required:
        - exists
        - verified
        - vault
        - nft
        - name
        - symbol
        - nameFlag
        - maker
        - art
        - tokensPerNft
        - created
        - nfts
        - inventory
        - escrow
        - lockedForGood
        - fee
        - fees
        - perNft
        - moves
        - readFailed
      properties:
        exists: { type: boolean, const: true }
        verified: { type: boolean, description: It passed Mancer's checks. An unverified market's routes answer 503 `nft-market-unverified`. }
        vault: { $ref: "#/components/schemas/BooksAddress" }
        nft: { $ref: "#/components/schemas/BooksAddress" }
        name: { type: string }
        symbol: { type: string }
        nameFlag: { type: [string, "null"], enum: [impersonator, null] }
        maker: { $ref: "#/components/schemas/BooksAddress", description: The only address that may change the image. }
        art:
          type: object
          description: The collection's picture on Mancer's own route, never the maker's URL.
          required: [path, reason]
          properties:
            path: { type: [string, "null"] }
            reason:
              anyOf: [{ $ref: "#/components/schemas/NftArtReason" }, { type: "null" }]
        tokensPerNft: { $ref: "#/components/schemas/BooksUnits" }
        created:
          description: Its opening; null for some seconds after it.
          anyOf:
            - type: object
              properties:
                block: { type: number }
                time: { type: number }
                tx: { $ref: "#/components/schemas/BooksHex" }
              required: [block, time, tx]
            - { type: "null" }
        nfts:
          type: object
          description: NFTs not burned and not for sale (`backed`), held by wallets (`outside`), for sale (`inventory`), and stuck in the vault (`stuck`).
          required: [backed, outside, inventory, stuck]
          properties:
            backed: { type: number }
            outside: { type: number }
            inventory: { type: number }
            stuck: { type: number }
        inventory:
          type: object
          description: Ids for sale, oldest first, at most 100 here.
          required: [oldest, truncated]
          properties:
            oldest:
              type: array
              items: { type: string }
            truncated: { type: boolean }
        escrow:
          type: object
          required: [tokens, shareOfCirculatingBps]
          properties:
            tokens: { $ref: "#/components/schemas/BooksUnits" }
            shareOfCirculatingBps: { type: [number, "null"] }
        lockedForGood:
          type: object
          description: "Tokens that never redeem: behind stuck NFTs, and sent to the vault."
          required: [stuckNfts, donatedTokens, tokens]
          properties:
            stuckNfts: { type: number }
            donatedTokens: { $ref: "#/components/schemas/BooksUnits" }
            tokens: { $ref: "#/components/schemas/BooksUnits" }
        fee:
          type: object
          description: "The fee for one NFT moved: $1 in ETH."
          required: [perNftWei, usd, bufferBps, paused, feed]
          properties:
            perNftWei:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            usd: { type: number, const: 1 }
            bufferBps: { type: number }
            paused: { type: boolean, description: "The feed is more than 48 hours old, answers zero or less, or is stamped after the block: every move reverts." }
            feed:
              type: object
              required: [updatedAt, ageSecs, stale]
              properties:
                updatedAt: { type: number }
                ageSecs: { type: number }
                stale: { type: boolean }
        fees:
          type: object
          description: "This market's own fees: paid, each half, flushed, and owed."
          required: [paidWei, mancerWei, protocolWei, flushedWei, owedWei]
          properties:
            paidWei: { $ref: "#/components/schemas/BooksUnits" }
            mancerWei: { $ref: "#/components/schemas/BooksUnits" }
            protocolWei: { $ref: "#/components/schemas/BooksUnits" }
            flushedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
            owedWei:
              type: object
              required: [mancer, protocol]
              properties:
                mancer: { $ref: "#/components/schemas/BooksUnits" }
                protocol: { $ref: "#/components/schemas/BooksUnits" }
        perNft:
          type: object
          description: One NFT's tokens at the backing while the Book trades or is frozen, and what they would redeem for now once it settled.
          required: [backingWei, redeemWei, feeExceedsValue]
          properties:
            backingWei:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            redeemWei:
              anyOf: [{ $ref: "#/components/schemas/BooksUnits" }, { type: "null" }]
            feeExceedsValue: { type: [boolean, "null"] }
        moves:
          type: object
          required: [wrapped, unwrapped, sold, bought]
          properties:
            wrapped: { type: number }
            unwrapped: { type: number }
            sold: { type: number }
            bought: { type: number }
        readFailed: { type: [string, "null"], description: "Why a read failed, where one did: its figures are partial." }
    NftMarketState:
      description: "The market: none yet, or open."
      anyOf: [{ $ref: "#/components/schemas/NftMarketNone" }, { $ref: "#/components/schemas/NftMarketOpen" }]
    BooksError:
      type: object
      description: "Every Books refusal and outage, in the one envelope every error answer is (`Error`)."
      required: [error, code, retryable]
      properties:
        error: { type: string, description: A sentence naming what was wrong. }
        code:
          type: string
          enum:
            - bad-query
            - bad-address
            - not-a-book
            - book-indexing
            - books-index-unavailable
            - books-state-unavailable
            - books-deployment-unverified
            - not-raising
            - book-cancelled
            - window-closed
            - window-closing
            - sells-disabled
            - sell-exceeds-curve
            - sell-exceeds-balance
            - feed-stale
            - zero-trade
            - slippage-exceeded
            - not-frozen
            - nft-market-unverified
            - no-nft-market
            - nft-market-exists
            - not-book-operator
            - not-market-maker
            - nft-market-paused
            - book-not-armed
            - book-settled
            - zero-count
            - batch-too-large
            - not-owner
            - not-in-inventory
            - inventory-short
            - insufficient-tokens
            - bad-tokens-per-nft
            - bad-image-url
            - bad-name
            - bad-symbol
            - bad-body
            - unknown-field
            - key-server-only
            - key-not-signing
            - wallet-required
            - not-a-trader
            - not-eligible-yet
            - not-an-eoa
            - wrong-phase
            - books-signing-off
            - books-signer-unavailable
            - books-signer-stopped
            - books-signer-has-code
            - books-signer-not-current
            - books-chain-stale
            - books-rate-limited
            - budget-exhausted
            - reversal-cooldown
            - reverses-live-order
            - amount-exceeds-tracked
            - vault-tracks-16
            - weth-spot
            - deadline-past-unlock
            - token-refused
            - stock-not-receivable
            - no-reference
            - no-route
            - route-pool-refused
            - middle-refused
            - route-touches-book-token
            - middle-not-swept
            - unknown-leg
            - route-mismatch
            - price-moved
            - impact-too-high
            - pool-take-too-high
            - vault-simulation-failed
            - books-sign-log-unavailable
            - pending-mismatch
            - order-fills-unavailable
            - logo-not-found
          description: A stable code. The Books errors guide lists every one with its status.
        retryable: { type: boolean, description: "Whether the same request, sent again unchanged after `Retry-After`, may succeed." }
        retryAfterSeconds: { type: integer, minimum: 0, description: "The `Retry-After` header's seconds, where the answer carries one." }
        detail: { type: object, additionalProperties: true, description: "What the refusal names, by code." }
    AccountEventsPage:
      type: object
      required: [account, events, next, more, head, floor, truncated]
      properties:
        account: { $ref: "#/components/schemas/Address" }
        events:
          type: array
          items: { $ref: "#/components/schemas/AccountEvent" }
        next: { type: string, description: "The cursor to read on from: the last event's `seq`, or `since` where the page is empty." }
        more: { type: boolean, description: "More events past `next` now." }
        head: { type: string, description: "The account's newest event's `seq`, or 0 where it has none." }
        floor: { type: string, description: "The newest `seq` dropped from the account's log by its retention, or 0." }
        truncated: { type: boolean, description: "`since` is under `floor`: events between the two were dropped." }
    AccountEvent:
      type: object
      required: [seq, kind, account, wallet, key, at, data]
      description: "One event of an account's log, the same on the route and on the stream. `kind` says what `data` holds; skip a kind you do not know. [Account events](/api/guides/account-events) lists each kind."
      properties:
        seq: { type: string, description: "The event's place in the log, a decimal string. Pass it as `since` to read past it." }
        kind:
          type: string
          enum: [order.placed, order.filled, order.completed, order.cancelled, order.expired, order.reopened, order.refused, notice.new, notice.counted, book.next, book.pending, book.redeemable, book.cut-owed, account.deletion-requested, account.deletion-cancelled]
        account: { $ref: "#/components/schemas/Address" }
        wallet: { description: "The account's wallet the event is about: the order's maker, the notice's recipient, the Book's party, or the account's own.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        key: { type: string, description: "The event's subject: an order's hash, a notice's id, a Book's token, or the account." }
        at: { type: string, format: date-time, description: "When the fact was written." }
        data:
          oneOf:
            - $ref: "#/components/schemas/AccountOrderEventData"
            - $ref: "#/components/schemas/AccountOrderFillData"
            - $ref: "#/components/schemas/AccountNoticeEventData"
            - $ref: "#/components/schemas/AccountBookEventData"
            - $ref: "#/components/schemas/AccountDeletionEventData"
    AccountDeletionEventData:
      type: object
      description: "`account.deletion-requested` and `account.deletion-cancelled`: a linked wallet's request to delete the account."
      required: [requestedBy, requestedAt, deletesAt]
      properties:
        requestedBy: { $ref: "#/components/schemas/Address" }
        requestedAt: { type: integer, description: "Unix seconds the wallet asked." }
        deletesAt: { type: integer, description: "Unix seconds the account is erased, had the request stood." }
        cancelledBy: { description: "`account.deletion-cancelled` alone: the wallet that cancelled it.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        reason: { type: string, enum: [primary, requester, unlinked], description: "`account.deletion-cancelled` alone: the primary wallet, the wallet that asked, or that wallet's unlink." }
    AccountOrderEventData:
      type: object
      description: "`order.placed`, `order.completed`, `order.cancelled`, `order.expired`, `order.reopened` and `order.refused`."
      required: [order, contract, status, fillsDone]
      properties:
        order: { $ref: "#/components/schemas/Hash" }
        contract: { description: "The order book contract.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        status: { type: string, enum: [open, filled, cancelled, expired], description: "The order's status after the fact." }
        previous: { type: string, description: "The status before it, on every event but `order.placed` and `order.refused`." }
        tokenIn: { $ref: "#/components/schemas/Address" }
        tokenOut: { $ref: "#/components/schemas/Address" }
        amountPerFill: { type: string, description: "Raw units of `tokenIn` a fill sells." }
        totalFills: { type: integer }
        fillsDone: { type: integer }
        code: { type: string, description: "`order.refused` alone: the executor's reason, as `GET /v1/orders/{hash}` names it (`maker-funds`, `no-route`, `sell-blocked` and the rest)." }
        message: { type: string, description: "`order.refused` alone: the reason in a sentence." }
    AccountOrderFillData:
      type: object
      description: "`order.filled`: one fill."
      required: [order, contract, fillIndex, amountIn, amountOut, txHash, block, at]
      properties:
        order: { $ref: "#/components/schemas/Hash" }
        contract: { $ref: "#/components/schemas/Address" }
        fillIndex: { type: integer, description: "The fill's place among the order's fills." }
        amountIn: { type: string, description: "Raw units of `tokenIn` the fill sold." }
        amountOut: { type: string, description: "Raw units of `tokenOut` it delivered." }
        feeBps: { type: integer }
        txHash: { $ref: "#/components/schemas/Hash" }
        block: { type: integer }
        at: { type: integer, description: "The block's unix time." }
        tokenIn: { $ref: "#/components/schemas/Address" }
        tokenOut: { $ref: "#/components/schemas/Address" }
        totalFills: { type: integer }
    AccountNoticeEventData:
      type: object
      description: "`notice.new` and `notice.counted`: the notice as the inbox holds it."
      required: [id, kind, actor, at, trades]
      properties:
        id: { type: string, description: "The notice's id in the account's inbox." }
        kind: { type: string, enum: [follow, trade, webhook, account-deletion] }
        actor: { description: "Who followed, or whose trades these are; for a webhook notice, the account's own wallet; for a deletion's, the wallet that asked or cancelled.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        at: { type: integer, description: "Unix seconds: the follow's time, or the newest trade's block time." }
        trades: { type: integer, description: "A trade notice's count of trades (1 for a follow)." }
        txHash: { type: [string, "null"], description: "The newest trade's transaction." }
        trade: { type: [object, "null"], additionalProperties: true, description: "The newest trade, as the wallet's own trades list it (`GET /v1/wallets/{address}/swaps`)." }
        webhook: { description: "A webhook notice's hook, in place of `trade`: a hook made or paused.", allOf: [{ $ref: "#/components/schemas/WebhookNotice" }] }
        deletion: { description: "An account deletion's notice, in place of `trade`: the request made or cancelled.", allOf: [{ $ref: "#/components/schemas/DeletionNotice" }] }
    AccountBookEventData:
      type: object
      description: "`book.next`, `book.pending`, `book.redeemable` and `book.cut-owed`: the Book, its phase at the block it was read at, and the kind's own fields."
      required: [token, bookId, deployment, symbol, phase, step, block]
      properties:
        token: { $ref: "#/components/schemas/Address" }
        bookId: { type: string }
        deployment: { type: string }
        symbol: { type: string }
        phase: { type: string, description: "The Book's phase at `block`, as `GET /v1/books/{token}` names it." }
        step: { type: string }
        block: { type: string, description: "The block the Book was read at." }
        next:
          type: [string, "null"]
          enum: [arm, graduate, bond, confirm, liquidate, unstake-then-redeem, redeem, unwrap-then-redeem, claim-cut, claim-fees, null]
          description: "`book.next` alone: what the wallet does next, or null where nothing waits on it now."
        previous: { type: [string, "null"], description: "`book.next` alone: the step before." }
        kind: { type: string, enum: [trade, order], description: "`book.pending` alone: a vault trade or a vault order waits on this trader." }
        digest: { type: string, description: "`book.pending` alone: the proposal's digest, which the confirmation names." }
        trade:
          type: object
          description: "`book.pending` of a trade alone: what the proposal trades."
          properties:
            tokenIn: { $ref: "#/components/schemas/Address" }
            tokenOut: { $ref: "#/components/schemas/Address" }
            amountIn: { type: string }
            minOut: { type: string }
            deadline: { type: string }
        amount: { type: string, description: "`book.redeemable` alone: the wallet's tokens." }
        payoutWei: { type: string, description: "`book.redeemable` alone: what they redeem for, in wei." }
        cutOwedWei: { type: string, description: "`book.cut-owed` alone: the cut owed the trader now, in wei." }
    StreamTicket:
      type: object
      required: [ticket, topic, expiresAt, sessionExpiresAt, socket, head]
      properties:
        ticket: { type: string, description: "Send it as `ticket` in the join's payload, before `expiresAt`. Never put it in a URL." }
        topic: { type: string, description: "`account:<address>`, the account's primary wallet's." }
        expiresAt: { type: string, format: date-time, description: "The ticket's end: a minute on, or the session's end where that comes first." }
        sessionExpiresAt: { type: string, format: date-time, description: "When the session ends, and the channel with it." }
        socket: { type: string, description: "The socket to join on." }
        head: { type: string, description: "The account's newest event's `seq` now." }
    Webhook:
      type: object
      description: "One of the account's webhooks. No answer carries its secret after the one that made it."
      required: [id, url, events, active, paused, lastSeq, lastDeliveredAt, failing, previousSecretUntil, createdBy, createdAt, held, heldReason]
      properties:
        id: { type: string, pattern: "^wh_[0-9a-f]{24}$" }
        url: { type: string }
        events: { type: array, items: { type: string }, description: "The kinds it delivers: kinds of the log, families such as `order.*`, or `*`." }
        active: { type: boolean }
        paused:
          type: [object, "null"]
          description: "Why and when it was paused. `revoked`, `key`, `unlinked` and `merged`: the credential it stood on ended, or a merge brought it in, and a session alone resumes it."
          required: [reason, at]
          properties:
            reason: { type: string, enum: [owner, failing, revoked, key, unlinked, merged] }
            at: { type: string, format: date-time }
        lastSeq: { type: string, description: "The last event of the account's log it delivered or passed over." }
        lastDeliveredAt: { type: [string, "null"], format: date-time }
        failing:
          type: [object, "null"]
          description: "The run of failures it is in, where it is in one."
          required: [since, attempts, nextAttemptAt, lastStatus, lastError]
          properties:
            since: { type: string, format: date-time }
            attempts: { type: integer, description: "The tries of the event it waits on." }
            nextAttemptAt: { type: [string, "null"], format: date-time, description: "The next try of the event it waits on, or null while the hook is paused." }
            lastStatus: { type: [integer, "null"], description: "The receiver's last HTTP status, or null where none came." }
            lastError: { type: [string, "null"], description: "Why the last try failed, with an excerpt of the answer's body." }
        previousSecretUntil: { type: [string, "null"], format: date-time, description: "Until when the secret before its last rotation still signs." }
        createdBy: { $ref: "#/components/schemas/WebhookCredential" }
        createdAt: { type: string, format: date-time }
        held: { type: boolean, description: "Mancer holds its deliveries for a fault of its own, never counted against the hook. Its events wait, and go out in order once mended." }
        heldReason:
          type: [string, "null"]
          enum: [secret, previous-secret, no-server-key, null]
          description: "Why it is held: its secret, or the secret before its rotation, cannot be opened, or the server signs nothing. Null while it is not held."
    WebhookCredential:
      type: object
      description: "The credential a hook stands on: the one that made it, or the session that resumed it after that one ended."
      required: [wallet, key, sessionIssuedAt]
      properties:
        wallet: { type: [string, "null"], description: "The credential's wallet." }
        key: { type: [string, "null"], description: "A key's name, or null for a session." }
        sessionIssuedAt: { type: [string, "null"], format: date-time, description: "When the session was issued, or null for a key." }
    PausedWebhook:
      type: object
      description: "A webhook paused because a credential ended: its id and its URL's host, never its path."
      required: [id, host]
      properties:
        id: { type: string }
        host: { type: string }
    WebhookCreated:
      type: object
      required: [webhook, secret]
      properties:
        webhook: { $ref: "#/components/schemas/Webhook" }
        secret: { type: [string, "null"], description: "`whsec_…`, the hook's signing secret. Keep it on your server; no other answer carries it." }
        secretWithheld: { type: boolean, description: "True on an `Idempotency-Key` replay, which never carries the secret." }
    WebhookList:
      type: object
      required: [account, webhooks, max, kinds, on]
      properties:
        account: { $ref: "#/components/schemas/Address" }
        webhooks: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
        max: { type: integer, const: 5 }
        kinds: { type: array, items: { type: string }, description: "Every kind of the account's log." }
        on: { type: boolean, description: "False while Mancer has deliveries switched off; they resume where they stopped." }
    WebhookTry:
      type: object
      required: [webhook, delivered, status, error, ms]
      properties:
        webhook: { type: string }
        delivered: { type: boolean, description: "The receiver answered a 2xx within ten seconds." }
        status: { type: [integer, "null"], description: "The receiver's HTTP status, or null where none came." }
        error: { type: [string, "null"], description: "Why it failed: the status with an excerpt of the body, a refused redirect, a host that is not public, or no answer." }
        ms: { type: integer }
    WebhookDelivery:
      type: object
      required: [seq, kind, state, attempts, status, lastError, firstAttemptAt, lastAttemptAt, deliveredAt, nextAttemptAt, redeliveries]
      properties:
        seq: { type: string, description: "The event's place in the account's log." }
        kind: { type: string }
        state: { type: string, enum: [delivered, retrying, failed, skipped], description: "`failed`: the hook was paused on it after a day of failures. `skipped`: it waited on a retry and the hook stopped taking its kind." }
        attempts: { type: integer, description: "Every try, redeliveries among them." }
        status: { type: [integer, "null"], description: "The last try's HTTP status." }
        lastError: { type: [string, "null"], description: "The last failure's reason, kept after a later try lands." }
        firstAttemptAt: { type: string, format: date-time }
        lastAttemptAt: { type: string, format: date-time }
        deliveredAt: { type: [string, "null"], format: date-time }
        nextAttemptAt: { type: [string, "null"], format: date-time, description: "The next try of a delivery that waits on a retry, while its hook is active; null otherwise." }
        redeliveries: { type: integer }
    TokenVoteSummary:
      type: object
      description: A token's votes and how many theses stand on it.
      required: [votes, theses]
      properties:
        votes: { $ref: "#/components/schemas/BookVoteCounts" }
        theses: { type: integer, minimum: 0, description: "The theses standing on the token, one a profile." }
    BookVoteResponse:
      type: object
      description: A Book's counts and the session's vote, as they stand after the write.
      required: [votes, mine]
      properties:
        votes: { $ref: "#/components/schemas/BookVoteCounts" }
        mine:
          description: The vote of the profile the session votes as; null where it has none.
          anyOf: [{ $ref: "#/components/schemas/BookMyVote" }, { type: "null" }]
    BookProfileResponse:
      type: object
      required: [profile]
      properties:
        profile: { $ref: "#/components/schemas/BookProfile" }
    BookDraft:
      type: object
      description: A Book saved before its open, pending deployment or deployed.
      required: [id, factory, creator, name, symbol, description, links, targets, logo, txHash, state, token, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-f]{32}$" }
        factory: { $ref: "#/components/schemas/BooksAddress" }
        creator: { $ref: "#/components/schemas/BooksAddress", description: The wallet that saved the record. }
        name: { type: string }
        symbol: { type: string }
        description: { type: [string, "null"] }
        links:
          type: object
          required: [website, x, telegram]
          properties:
            website: { type: [string, "null"] }
            x: { type: [string, "null"] }
            telegram: { type: [string, "null"] }
        targets:
          type: array
          items: { $ref: "#/components/schemas/BooksAddress" }
        logo: { type: boolean, description: Whether a logo is held for the record. }
        txHash: { type: [string, "null"], description: "The open's transaction, once `PATCH /v1/books/drafts/{id}` names it." }
        state: { type: string, enum: [pending, sent, deployed], description: "`sent` once the open's transaction is named, `deployed` once the Book it opened took the record." }
        token:
          description: The Book's token, once deployed.
          anyOf: [{ $ref: "#/components/schemas/BooksAddress" }, { type: "null" }]
        createdAt: { type: integer, description: Unix seconds. }
    BookDraftResponse:
      type: object
      required: [draft]
      properties:
        draft: { $ref: "#/components/schemas/BookDraft" }
    BookDraftsResponse:
      type: object
      required: [drafts]
      properties:
        drafts:
          type: array
          items: { $ref: "#/components/schemas/BookDraft" }
    BookCreatorRow:
      type: object
      description: One of the top creators, over the Books the board lists that were not cancelled.
      required: [address, verified, books, live, settled, valueWei, bestReturnBps, latestBook]
      properties:
        address: { $ref: "#/components/schemas/BooksAddress" }
        verified: { type: boolean, description: "The creator carries Mancer's verified mark." }
        books: { type: integer }
        live: { type: integer, description: Raising, graduated, trading or frozen. }
        settled: { type: integer }
        valueWei: { $ref: "#/components/schemas/BooksUnits", description: "Each Book's `bookValueWei` summed: a raise's funds, a live vault's value, what a settled Book paid out." }
        bestReturnBps: { type: [number, "null"], description: "The best settled Book's return after the close fee and the traders' cut; null where none settled." }
        latestBook: { $ref: "#/components/schemas/BooksAddress", description: "The creator's newest such Book." }
    BooksCreatorsResponse:
      type: object
      required: [creators]
      properties:
        creators:
          type: array
          items: { $ref: "#/components/schemas/BookCreatorRow" }
    BookThesisReportResponse:
      type: object
      required: [report, duplicate]
      properties:
        report:
          type: object
          required: [id, status, createdAt]
          properties:
            id: { type: integer }
            status: { type: string, enum: [open, reviewing, actioned, dismissed] }
            createdAt: { type: integer, description: Unix seconds. }
        duplicate: { type: boolean, description: "True where the wallet's open report of the same thesis is answered, and nothing new was written." }
    AccountWallet:
      type: object
      description: One wallet of an account.
      required: [address, primary, public, label, linkedAt]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        primary: { type: boolean, description: "The account's own wallet, the one that first signed in." }
        public: { type: boolean, description: "Shown on the account's profile. A hidden wallet answers every public read as a wallet no account holds." }
        label: { type: [string, "null"], description: "The owner's private label." }
        linkedAt: { type: integer, description: Unix seconds. }
    WalletLinkChoices:
      type: object
      description: What a merge needs the owner to choose before it can land.
      properties:
        usernames: { type: array, minItems: 2, maxItems: 2, items: { type: string }, description: "Both accounts' usernames: name one as `keepUsername`." }
        x: { type: array, minItems: 2, maxItems: 2, items: { type: string }, description: "Both accounts' X handles: name one as `keepX`." }
        public:
          type: object
          description: "The merge moves what the joining account shows, so it lands only with `public` true."
          required: [required, because]
          properties:
            required: { type: boolean, const: true }
            because: { type: array, items: { type: string, enum: [follows, blocks, username, x, wallets] } }
        webhooks: { $ref: "#/components/schemas/MergedWebhooks" }
    MergedWebhooks:
      type: object
      description: "The joining account's webhooks: those that come in paused, for a session to resume, and those past the five, which go with it."
      required: [paused, left]
      properties:
        paused: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" } }
        left: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" } }
    WalletLinkResponse:
      type: object
      required: [account, wallet, wallets, max, linked]
      properties:
        account: { $ref: "#/components/schemas/Address", description: "The account's primary wallet." }
        wallet: { $ref: "#/components/schemas/Address", description: "The session's wallet." }
        wallets:
          type: array
          description: Every wallet of the account, the primary first.
          items: { $ref: "#/components/schemas/AccountWallet" }
        max: { type: integer, const: 10, description: The most wallets an account holds. }
        linked:
          type: object
          required: [address, merged, wallets, username, x, leftOut]
          properties:
            address: { $ref: "#/components/schemas/Address" }
            merged: { type: boolean, description: "The wallet brought an account of its own." }
            wallets: { type: array, items: { $ref: "#/components/schemas/Address" }, description: "The wallets that joined: the one linked, or every wallet of the account it brought." }
            username:
              description: "A merge's usernames: the one kept and the one released; null for a plain link."
              anyOf:
                - type: object
                  required: [kept, released]
                  properties:
                    kept: { type: [string, "null"] }
                    released: { type: [string, "null"] }
                - { type: "null" }
            x:
              description: "A merge's X accounts: the handle kept and the one unlinked; null for a plain link."
              anyOf:
                - type: object
                  required: [kept, unlinked]
                  properties:
                    kept: { type: [string, "null"] }
                    unlinked: { type: [string, "null"] }
                - { type: "null" }
            leftOut:
              description: "A merge's follows, trade alerts and blocks past the account's caps, which it did not bring; null for a plain link."
              anyOf:
                - type: object
                  required: [follows, alerts, blocks]
                  properties:
                    follows: { type: integer }
                    alerts: { type: integer }
                    blocks: { type: integer }
                - { type: "null" }
            webhooks:
              description: "A merge's webhooks; null for a plain link."
              anyOf:
                - { $ref: "#/components/schemas/MergedWebhooks" }
                - { type: "null" }
    FollowCounts:
      type: object
      description: "How many wallets follow this one, and how many it follows."
      required: [followers, following]
      properties:
        followers: { type: integer, minimum: 0 }
        following: { type: integer, minimum: 0 }
    ViewerFollow:
      type: object
      description: "The session's word on one wallet. Whether the wallet blocked the session is said nowhere."
      required: [following, followsYou, alerts, blocked]
      properties:
        following: { type: boolean, description: "The session's account follows the wallet." }
        followsYou: { type: boolean, description: "The wallet follows the session's account, or one of its wallets." }
        alerts: { type: boolean, description: "The follow carries the wallet's trade alerts." }
        blocked: { type: boolean, description: "The session's account blocked the wallet." }
    FollowState:
      type: object
      description: "A wallet's counts and the session's word on it, as they stand after the write."
      required: [address, follows, viewer]
      properties:
        address: { $ref: "#/components/schemas/Address", description: "The wallet the path named." }
        follows: { $ref: "#/components/schemas/FollowCounts" }
        viewer: { $ref: "#/components/schemas/ViewerFollow" }
    PublicProfile:
      type: object
      description: "What a wallet's profile shows. Every field is null where it shows nothing, and every picture is a path on this API."
      required: [username, displayName, bio, website, avatar, banner, x, verified, joinedAt, showPortfolio]
      properties:
        username: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        website: { type: [string, "null"], description: "An http or https link." }
        avatar: { type: [string, "null"], description: "The picture's path, with its version as `v`." }
        banner: { type: [string, "null"], description: "The banner's path, with its version as `v`." }
        x:
          description: "The linked X account. `name` and `avatar` are null until the wallet's owner links it through Mancer's X login."
          anyOf:
            - type: object
              required: [username, name, url, followers, avatar, checkedAt]
              properties:
                username: { type: string }
                name: { type: [string, "null"] }
                url: { type: string, description: "The account's page on x.com." }
                followers: { type: integer }
                avatar: { type: [string, "null"], description: "The X picture's path on this API." }
                checkedAt: { type: integer, description: "Unix seconds X was last read." }
            - { type: "null" }
        verified:
          description: "The verified mark, what earned it and since when; null without one."
          anyOf:
            - type: object
              required: [basis, since]
              properties:
                basis: { type: string, enum: [x-followers, mancer], description: "`x-followers`: an X account of 500 followers or more, linked through Mancer. `mancer`: granted by Mancer." }
                since: { type: integer, description: Unix seconds. }
            - { type: "null" }
        joinedAt: { type: [integer, "null"], description: "The first second of the month the account was made, on a profile that shows something; null otherwise." }
        showPortfolio: { type: boolean, description: "The owner shows the wallet's holdings." }
    UserProfileResponse:
      type: object
      description: "A wallet's profile, its counts, and the session's word on it."
      required: [address, profile, pending, follows, viewer, wallets]
      properties:
        address: { $ref: "#/components/schemas/Address", description: "The wallet the path named, or the one its username names." }
        profile: { $ref: "#/components/schemas/PublicProfile" }
        pending: { type: boolean, description: "The answer may still change on its own while the wallet's OpenSea profile is still to be read. Ask again in a few seconds." }
        follows: { $ref: "#/components/schemas/FollowCounts" }
        viewer:
          description: "The session's word on the wallet; null without a session."
          anyOf: [{ $ref: "#/components/schemas/ViewerFollow" }, { type: "null" }]
        wallets: { type: array, items: { $ref: "#/components/schemas/Address" }, description: "The wallets the profile shows: the account's own wallet first, then its public linked wallets." }
    UserRenamed:
      type: object
      description: "A released username still held for its last owner: who held it, and the name it goes by now."
      required: [renamed]
      properties:
        renamed:
          type: object
          required: [username, address]
          properties:
            username: { type: [string, "null"], description: "The holder's username now; null where it has none." }
            address: { $ref: "#/components/schemas/Address" }
    UserSearchRow:
      description: "A wallet a search found, and what it matched."
      allOf:
        - { $ref: "#/components/schemas/BooksShortIdentity" }
        - type: object
          required: [match]
          properties:
            match: { type: string, enum: [username, x, address] }
    UserLookupResponse:
      type: object
      required: [users, pending]
      properties:
        users:
          type: object
          description: "Every address asked, lowercase, to its short identity."
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
        pending: { type: array, items: { $ref: "#/components/schemas/Address" }, description: "The addresses whose identity may still change on their own: ask again in a few seconds." }
    FollowListResponse:
      type: object
      required: [address, kind, count, users, nextCursor]
      properties:
        address: { $ref: "#/components/schemas/Address", description: "The wallet the path named." }
        kind: { type: string, enum: [followers, following] }
        count: { type: integer, description: "The whole list's length." }
        users:
          type: array
          description: "Newest follow first."
          items:
            allOf:
              - { $ref: "#/components/schemas/BooksShortIdentity" }
              - type: object
                required: [viewer]
                properties:
                  viewer:
                    description: "The session's word on this wallet; null without a session."
                    anyOf: [{ $ref: "#/components/schemas/ViewerFollow" }, { type: "null" }]
        nextCursor: { type: [string, "null"], description: "The next page's `cursor`; null on the last page." }
    OwnerProfile:
      type: object
      description: "The account's own view of its profile: what it shows, what it stores, and what it may change and when."
      required: [address, profile, username, fields, x, refresh, settings, verification, hiddenByMancer, open, opening, usernameClaim]
      properties:
        address: { $ref: "#/components/schemas/Address", description: "The account's own wallet." }
        profile: { $ref: "#/components/schemas/PublicProfile" }
        username:
          type: object
          required: [current, claimedAt, nextChangeAt, fixUntil, changeWaitSec, held]
          properties:
            current: { type: [string, "null"] }
            claimedAt: { type: [integer, "null"], description: Unix seconds. }
            nextChangeAt: { type: [integer, "null"], description: "When the name may next change; null for now." }
            fixUntil: { type: [integer, "null"], description: "Until when a change is a typo fix that frees the old name at once and keeps the clock." }
            changeWaitSec: { type: integer, description: "The wait between two changes: seven days." }
            held:
              description: "A released name held for this account, and until when; null with none."
              anyOf:
                - type: object
                  required: [username, until]
                  properties:
                    username: { type: string }
                    until: { type: integer }
                - { type: "null" }
        fields:
          type: object
          description: "Each field as stored, a name the display rules hide included."
          required: [displayName, bio, website, avatar, banner]
          properties:
            displayName: { type: [string, "null"] }
            bio: { type: [string, "null"] }
            website: { type: [string, "null"] }
            avatar: { type: boolean, description: "The profile has a picture of its own." }
            banner: { type: boolean, description: "The profile has a banner of its own." }
        x:
          type: object
          required: [available, refreshAvailable, linked]
          properties:
            available: { type: boolean, description: "X linking is on." }
            refreshAvailable: { type: boolean, description: "`POST /auth/x/refresh` is on." }
            linked:
              anyOf:
                - type: object
                  required: [username, name, followers, linkedAt, checkedAt, nextCheckAt, checkAgainAt, confirmed]
                  properties:
                    username: { type: string }
                    name: { type: [string, "null"] }
                    followers: { type: integer }
                    linkedAt: { type: integer }
                    checkedAt: { type: integer, description: "Unix seconds X was last read." }
                    nextCheckAt: { type: [integer, "null"], description: "When Mancer reads it again on its own; null where it does not." }
                    checkAgainAt: { type: [integer, "null"], description: "When `POST /auth/x/refresh` may next read it; null for now." }
                    confirmed: { type: boolean, description: "The owner linked it through Mancer's X login. False for the X account the wallet's OpenSea profile named, which earns no mark." }
                - { type: "null" }
        refresh:
          type: object
          required: [available, nextAt]
          properties:
            available: { type: boolean, description: "`POST /v1/me/profile/refresh` is on." }
            nextAt: { type: [integer, "null"], description: "When it may next run; null for now." }
        settings:
          type: object
          required: [avatarSource, showPortfolio]
          properties:
            avatarSource: { type: string, enum: [auto, x, none], description: "`auto`: the profile's own picture, else X's. `x`: X's alone. `none`: no picture." }
            showPortfolio: { type: boolean }
        verification:
          type: object
          required: [verified, basis, followersNeeded, lapsesAt]
          properties:
            verified: { type: boolean }
            basis: { type: [string, "null"], enum: [x-followers, mancer, null] }
            followersNeeded: { type: integer, description: "The X followers that earn the mark: 500." }
            lapsesAt: { type: [integer, "null"], description: "When a mark whose X account fell under the bar lapses; null otherwise." }
        hiddenByMancer:
          type: array
          description: "The fields Mancer hid on this profile."
          items: { type: string, enum: [displayName, bio, website, avatar, banner, xAvatar] }
        open: { type: boolean, description: "The account's profile writes are open." }
        opening: { type: string, enum: [everyone, beta, staked, stake, unread, closed], description: "Why the writes are open, or what would open them: `stake` (a staked Chain Mancer) or `closed`. `unread`: the stake could not be read just now." }
        usernameClaim: { type: string, enum: [everyone, x, staked, needs-x-or-stake, opened-elsewhere, unread], description: "Whether a username claim is open, and by which, or what it needs. See `PUT /v1/me/username`." }
        deletion:
          description: "A linked wallet's request to delete the account, while one stands; null otherwise."
          oneOf: [{ $ref: "#/components/schemas/AccountDeletionPending" }, { type: "null" }]
    AccountDeletionPending:
      type: object
      description: "A linked wallet's request to delete the account. The account is erased at `deletesAt` unless the primary wallet cancels it, the wallet that asked cancels it, or that wallet is unlinked first."
      required: [requestedBy, deletesAt]
      properties:
        requestedBy: { description: "The linked wallet that asked.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        requestedAt: { type: integer, description: "Unix seconds it asked. On the request's own answers." }
        deletesAt: { type: integer, description: "Unix seconds the account is erased: seven days after the request." }
    OwnerProfileRefreshed:
      description: "The account's own view, and what the refresh changed."
      allOf:
        - { $ref: "#/components/schemas/OwnerProfile" }
        - type: object
          required: [refreshed]
          properties:
            refreshed:
              type: object
              required: [fields, x]
              properties:
                fields: { type: array, items: { type: string, enum: [displayName, bio, website, avatar, banner] }, description: "The fields OpenSea's profile replaced." }
                x: { type: [string, "null"], enum: [linked, taken, unknown, young, had-link, pending, null], description: "The X account OpenSea named: linked, held by another wallet, unknown to X, made in the last 90 days, passed over for the wallet's own link, or still to be read." }
    UsernameClaimed:
      type: object
      required: [username, claimedAt, nextChangeAt, fixUntil, released]
      properties:
        username: { type: string }
        claimedAt: { type: integer, description: Unix seconds. }
        nextChangeAt: { type: [integer, "null"], description: "When the name may next change; null for now." }
        fixUntil: { type: [integer, "null"], description: "Until when a change is a typo fix." }
        released: { $ref: "#/components/schemas/UsernameReleasedName" }
    UsernameReleasedName:
      description: "The name the account let go: held for it until `heldUntil`, or freed at once (`heldUntil` null) inside the typo-fix window. Null where none was."
      anyOf:
        - type: object
          required: [username, heldUntil]
          properties:
            username: { type: string }
            heldUntil: { type: [integer, "null"] }
        - { type: "null" }
    UsernameAvailability:
      type: object
      required: [username, available]
      properties:
        username: { type: string, description: "The name as a claim reads it: trimmed, `@` dropped, lowercase." }
        available: { type: boolean }
        reason: { type: string, enum: [format, length, reserved, taken, held, prefix, staff-word, lookalike, symbol, x-handle, cooldown, yours, not-open, opened-elsewhere, needs-x-or-stake, unread], description: "Why it is not available: each is its `username-` code's rule, `yours` the account's own name, `not-open` writes closed." }
        availableAt: { type: integer, description: "When a held name frees, the account's wait ends, or an opener frees." }
        word: { type: string, description: "The word a name may not contain." }
    AccountWalletsResponse:
      type: object
      required: [account, wallet, wallets, max]
      properties:
        account: { $ref: "#/components/schemas/Address", description: "The account's own wallet." }
        wallet: { $ref: "#/components/schemas/Address", description: "The session's wallet." }
        wallets:
          type: array
          description: Every wallet of the account, the account's own first.
          items: { $ref: "#/components/schemas/AccountWallet" }
        max: { type: integer, const: 10, description: The most wallets an account holds. }
        unlinked: { $ref: "#/components/schemas/Address", description: "An unlink: the wallet let go." }
        sessionEnded: { type: boolean, description: "An unlink: the session's own wallet was the one let go, so this session acts for nothing more." }
        pausedWebhooks: { type: array, items: { $ref: "#/components/schemas/PausedWebhook" }, description: "An unlink: the webhooks the wallet's sessions and keys made, paused." }
        deletionCancelled: { type: boolean, description: "An unlink: the wallet's request to delete the account ended with it." }
    XLinkStart:
      type: object
      required: [authorizeUrl, expiresAt]
      properties:
        authorizeUrl: { type: string, description: "X's page where the person approves the link, opened in a browser." }
        expiresAt: { type: integer, description: "Unix seconds the link's start runs out: ten minutes on." }
        returnTo: { type: string, description: "With `return: app`: where X sends the browser back with the ticket, `mancer://x-link`." }
        deviceCode: { type: string, description: "With `return: device`: the code the bot sends to `POST /auth/x/confirm`. Keep it secret: it is the link's only proof." }
        interval: { type: integer, description: "With `return: device`: the seconds to wait between asks." }
    XLinkPending:
      type: object
      required: [status, awaiting, expiresAt, interval]
      properties:
        status: { type: string, enum: [pending] }
        awaiting: { type: string, enum: [x, confirmation], description: "`x`: nobody has approved at X yet. `confirmation`: the person approved at X and has not confirmed on Mancer's page." }
        expiresAt: { type: integer, description: "Unix seconds this step runs out." }
        interval: { type: integer, description: "The seconds to wait before asking again." }
    BlockedWallet:
      description: "A wallet the account blocked, as a list shows it, with when."
      allOf:
        - $ref: "#/components/schemas/BooksShortIdentity"
        - type: object
          required: [blockedAt]
          properties:
            blockedAt: { type: integer, description: "Unix seconds the block was made." }
    BlocksPage:
      type: object
      required: [count, users, nextCursor]
      properties:
        count: { type: integer, minimum: 0, description: "How many wallets the account blocks in all." }
        users:
          type: array
          description: The page's wallets, newest block first.
          items: { $ref: "#/components/schemas/BlockedWallet" }
        nextCursor: { type: [string, "null"], description: "The cursor of the next page, opaque. Null on the last page." }
    FeedPage:
      type: object
      required: [swaps, users, following, nextBefore]
      properties:
        swaps:
          type: array
          description: "The page's trades, newest first, each as the wallet's own trades list it; `trader` is the wallet followed. A transaction two followed wallets each traded in is listed once."
          items: { $ref: "#/components/schemas/WalletTrade" }
        users:
          type: object
          description: "The short identity of each listed trader who shows a name, a picture, a mark or an X handle, by lowercase address."
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
        following: { type: integer, minimum: 0, description: "How many wallets the account follows." }
        nextBefore: { type: [string, "null"], description: "The cursor of the next older page, opaque. Null once the feed ends." }
    Notice:
      type: object
      description: "One notification: a follow (`follow`), a trade alert (`trade`), a webhook made or paused (`webhook`), or a linked wallet's request to delete the account made or cancelled (`account-deletion`)."
      required: [id, kind, at, actor, unread]
      properties:
        id: { type: string, description: "The notice's id, a decimal string: higher is newer." }
        kind: { type: string, enum: [follow, trade, webhook, account-deletion] }
        at: { type: integer, description: "Unix seconds: the follow's time, or the newest trade's block time." }
        actor: { description: "Who followed, or whose trades these are.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        unread: { type: boolean }
        trades: { type: integer, minimum: 1, description: "A trade notice's count of trades: a wallet's trades within ten minutes are one notice while it is unread. Absent on a follow." }
        trade: { description: "A trade notice's newest trade, as the wallet's own trades list it. Absent on a follow.", allOf: [{ $ref: "#/components/schemas/WalletTrade" }] }
        webhook: { description: "A webhook notice's hook. Its actor is the account's own wallet.", allOf: [{ $ref: "#/components/schemas/WebhookNotice" }] }
        deletion: { description: "An account deletion's notice: the request. Its actor is the wallet that asked or cancelled.", allOf: [{ $ref: "#/components/schemas/DeletionNotice" }] }
    DeletionNotice:
      type: object
      required: [state, requestedBy, deletesAt, cancelledBy, reason]
      properties:
        state: { type: string, enum: [requested, cancelled] }
        requestedBy: { description: "The linked wallet that asked.", allOf: [{ $ref: "#/components/schemas/Address" }] }
        deletesAt: { type: integer, description: "Unix seconds the account goes, had the request stood." }
        cancelledBy: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }], description: "A cancel's wallet." }
        reason: { type: [string, "null"], enum: [primary, requester, unlinked, null], description: "A cancel's cause: the primary wallet, the wallet that asked, or that wallet's unlink." }
    WebhookNotice:
      type: object
      required: [id, host, reason, lastError, seq]
      properties:
        id: { type: string, description: "The hook's id." }
        host: { type: string, description: "The host of the hook's URL, never its path." }
        reason: { type: string, enum: [failing, created], description: "`created`: the hook was made. `failing`: it was paused after a day of failed deliveries." }
        lastError: { type: [string, "null"] }
        seq: { type: [string, "null"], description: "The event it was paused on, which it sends first once resumed." }
        by: { description: "A made hook's credential.", allOf: [{ $ref: "#/components/schemas/WebhookCredential" }] }
    NoticesPage:
      type: object
      required: [notifications, users, viewer, unread, nextBefore]
      properties:
        notifications:
          type: array
          description: The page's notices, newest first.
          items: { $ref: "#/components/schemas/Notice" }
        users:
          type: object
          description: "The short identity of each notice's actor, by lowercase address."
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
        viewer:
          type: object
          description: "The session's word on each actor, by lowercase address, so a follower can be followed back."
          additionalProperties: { $ref: "#/components/schemas/ViewerFollow" }
        unread: { type: integer, minimum: 0, maximum: 100, description: "How many notices are unread, counted to 100: read 100 as 100 or more." }
        nextBefore: { type: [string, "null"], description: "The id the next older page reads before. Null on the last page." }
    SuggestedReason:
      description: "Why a person is named, as data to word."
      oneOf:
        - type: object
          title: Transfers
          description: "The account's wallets and this wallet sent each other tokens in the last 60 days."
          required: [kind, sent, received, tokens, lastAt]
          properties:
            kind: { type: string, enum: [transfers] }
            sent: { type: integer, description: "Sends from the account's wallets to this one." }
            received: { type: integer, description: "Sends from this wallet to the account's." }
            tokens:
              type: array
              maxItems: 3
              description: "The tokens sent, the most worth first."
              items:
                type: object
                required: [address, symbol]
                properties:
                  address: { $ref: "#/components/schemas/Address" }
                  symbol: { type: [string, "null"] }
            lastAt: { type: integer, description: "Unix seconds of the newest send." }
        - type: object
          title: Follows you
          description: "It follows the account, which does not follow it back."
          required: [kind, at]
          properties:
            kind: { type: string, enum: [follows-you] }
            at: { type: integer, description: "Unix seconds it followed." }
        - type: object
          title: Followed by
          description: "At least two of the wallets the account follows follow it."
          required: [kind, count, via]
          properties:
            kind: { type: string, enum: [followed-by] }
            count: { type: integer, minimum: 2 }
            via:
              type: array
              maxItems: 3
              description: "Up to three of them, the newest first; `users` names each."
              items: { $ref: "#/components/schemas/Address" }
        - type: object
          title: A Book
          description: "It answers for a Book the account holds or runs, or holds one the account runs."
          required: [kind, book, theirRole, yourRole]
          properties:
            kind: { type: string, enum: [book] }
            book:
              type: object
              required: [token, symbol, name]
              properties:
                token: { $ref: "#/components/schemas/Address" }
                symbol: { type: string }
                name: { type: string }
            theirRole: { type: string, enum: [creator, trader, holder] }
            yourRole: { type: string, enum: [creator, trader, holder] }
    SuggestedPerson:
      type: object
      required: [address, identity, reasons]
      properties:
        address: { $ref: "#/components/schemas/Address", description: "The profile the person's page shows, and the one a follow from the list follows." }
        identity: { $ref: "#/components/schemas/BooksShortIdentity" }
        reasons:
          type: array
          description: The reasons, strongest first.
          items: { $ref: "#/components/schemas/SuggestedReason" }
    SuggestedPeopleResponse:
      type: object
      required: [people, users, sources, at]
      properties:
        people:
          type: array
          description: The people, strongest first.
          items: { $ref: "#/components/schemas/SuggestedPerson" }
        users:
          type: object
          description: "The short identity of each wallet a `followed-by` reason names, by lowercase address."
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
        sources:
          type: object
          description: "What each source came to: read whole, in part, not at all, skipped for load (`busy`), or with nothing to read (`none`)."
          required: [transfers, follows, books]
          properties:
            transfers: { type: string, enum: [read, partial, unread, busy, none] }
            follows: { type: string, enum: [read, partial, unread, busy, none] }
            books: { type: string, enum: [read, partial, unread, busy, none] }
        at: { type: integer, description: "Unix seconds the transfers and the Books were read. They are kept ten minutes, or 30 seconds where they could not be read; the follows are read at every request." }
    AppAccessInvite:
      type: object
      description: One of the account's invite codes.
      required: [code, mintedAt, redeemedBy, redeemedAt]
      properties:
        code: { type: string, description: "The code, shown XXXX-XXXX." }
        mintedAt: { type: integer, description: Unix seconds. }
        redeemedBy:
          description: "The account that used the code, as its profile shows it; null while the code is unused."
          anyOf:
            - type: object
              required: [address, username, displayName]
              properties:
                address: { $ref: "#/components/schemas/Address" }
                username: { type: [string, "null"] }
                displayName: { type: [string, "null"] }
            - { type: "null" }
        redeemedAt: { type: [integer, "null"], description: Unix seconds; null while the code is unused. }
    AppAccessResponse:
      type: object
      description: The account's access to the phone app.
      required: [required, granted, via, since, code, invites, stake]
      properties:
        required: { type: boolean, description: "Whether the phone app is invite-only now. While false, every signed-in account may use it." }
        granted: { type: boolean, description: "Whether the account is in. Access once granted stays." }
        via: { type: [string, "null"], enum: [stake, invite, admin, null], description: "How the account came in: its stake, an invite code, or Mancer's hand; null while it is not in." }
        since: { type: [integer, "null"], description: "Unix seconds it came in; null while it is not in." }
        code: { type: [string, "null"], description: "The invite code it came in by, shown XXXX-XXXX; null for any other way in." }
        invites:
          type: array
          description: "The account's own codes to give out, oldest first. A stake mints five, once."
          items: { $ref: "#/components/schemas/AppAccessInvite" }
        stake:
          type: [string, "null"]
          enum: ["yes", "no", unread, null]
          description: "This answer's read of the account's stake: `unread` where a wallet did not answer in time; null where none was read (the account is in, or the app is open)."
    WalletTrade:
      type: object
      description: One transaction's trade, read from what left the wallet and what reached it; a route's middle steps never show.
      required: [id, txHash, logIndex, blockNumber, timestamp, token, tokenSymbol, cash, cashSymbol, pool, venue, side, amountToken, amountCash, priceUsd, volumeUsd, trader]
      properties:
        id: { $ref: "#/components/schemas/Hash", description: "The transaction's hash: a row a transaction." }
        txHash: { $ref: "#/components/schemas/Hash" }
        logIndex: { type: integer, description: "The log index of the trade's largest swap." }
        blockNumber: { type: string }
        timestamp: { type: integer, description: "Unix seconds." }
        token: { $ref: "#/components/schemas/Address", description: "The token traded. For liquidity, the largest swap's token." }
        tokenSymbol: { type: [string, "null"] }
        cash: { $ref: "#/components/schemas/Address", description: "The other side: the dollar over ether over any other token, and between two tokens the one given up. For liquidity, the largest swap's other side. Native ether is the zero address." }
        cashSymbol: { type: [string, "null"] }
        pool: { type: string, description: "The pool of the trade's largest swap, or its id for a pool-manager venue." }
        venue: { type: string, description: "`mancer` where the transaction called Mancer's router or its orders; else the venue of the largest swap." }
        side:
          type: string
          enum: [buy, sell, add, remove, move]
          description: "`buy` or `sell` of `token`; `add`, `remove` or `move` where the wallet put liquidity in, took it out or moved it."
        amountToken: { type: number, description: "How much of `token` moved, in whole tokens." }
        amountCash: { type: number, description: "How much of `cash` moved, in whole tokens." }
        priceUsd: { type: number, description: "`volumeUsd` over `amountToken`; 0 for liquidity." }
        volumeUsd: { type: number, description: "What the cash side was worth in dollars, else the token side; for liquidity, what moved in all." }
        trader: { $ref: "#/components/schemas/Address", description: "The wallet." }
        purpose:
          type: string
          enum: [liquidity-add, liquidity-remove, liquidity-move]
          description: "Present where the transaction added, removed or moved the wallet's liquidity and was no trade. Absent for a trade."
        moved:
          type: array
          description: "Present with `purpose`: what the wallet put in or took out, the most worth first."
          items:
            type: object
            required: [token, symbol, amount, usd]
            properties:
              token: { $ref: "#/components/schemas/Address" }
              symbol: { type: [string, "null"] }
              amount: { type: number, description: "Whole tokens." }
              usd: { type: number }
    WalletNftMove:
      type: object
      description: One move of a piece into or out of the wallet.
      required: [type, at, tx, block, collection, tokenId, name, image, quantity, counterparty, price, priceUsd, currency]
      properties:
        type:
          type: string
          enum: [received, sent, minted, airdropped, burned, bought, sold]
          description: "`minted` where the wallet made the mint, `airdropped` where another wallet's transaction gave it, `received` where neither was read; `bought` and `sold` where the move's transaction sold the piece."
        at: { type: integer, description: "Unix seconds." }
        tx: { $ref: "#/components/schemas/Hash" }
        block: { type: integer }
        collection:
          type: object
          required: [address, name, verified, image]
          properties:
            address: { $ref: "#/components/schemas/Address" }
            name: { type: [string, "null"], description: "The contract's own `name()`, else OpenSea's name." }
            verified: { type: [boolean, "null"], description: "OpenSea verified the collection; null where OpenSea has no word on it." }
            image: { type: [string, "null"], description: "The API's path for the collection's picture." }
        tokenId: { type: string }
        name: { type: [string, "null"], description: "The piece's name from its metadata." }
        image: { type: [string, "null"], description: "The API's path for the piece's picture." }
        quantity: { type: string, description: "How many of the piece moved: 1 for an ERC-721." }
        counterparty:
          oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }]
          description: "Who sent or took the piece, sold or bought it, or sent an airdrop's transaction. Null for a mint, a burn and a move whose other side was not read."
        price: { type: [number, "null"], description: "What a sale paid for the move's pieces, in `currency`." }
        priceUsd: { type: [number, "null"], description: "`price` in dollars, at ether's price now where the sale was in ether." }
        currency: { type: [string, "null"], description: "The sale's currency by its symbol." }
    NftPrice:
      type: object
      description: An order's price for one item.
      required: [price, priceUsd, currency]
      properties:
        price: { type: number, description: "In `currency`, whole units." }
        priceUsd: { type: [number, "null"], description: "In dollars, at ether's price where it is in ether; null where it cannot be valued." }
        currency: { type: [string, "null"], description: "The currency's symbol: ETH, WETH, USDG, or the token's own." }
    NftCollection:
      type: object
      description: An NFT collection, its contract's own words and holders beside OpenSea's identity and market.
      required: [address, standard, name, symbol, slug, verified, safelist, description, image, banner, links, category, nsfw, disabled, stats, bestOffer, source]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        standard: { type: string, enum: [erc721, erc1155] }
        name: { type: [string, "null"], description: "The contract's own `name()`, else OpenSea's name." }
        symbol: { type: [string, "null"], description: "The contract's own `symbol()`." }
        slug: { type: [string, "null"], description: "OpenSea's slug for the collection." }
        verified: { type: [boolean, "null"], description: "OpenSea verified the collection; null where OpenSea has no word on it." }
        safelist: { type: [string, "null"], description: "OpenSea's safelist status, as OpenSea names it." }
        description: { type: [string, "null"] }
        image: { type: [string, "null"], description: "The API's path for the collection's picture." }
        banner: { type: [string, "null"], description: "The API's path for the collection's banner." }
        links:
          type: object
          required: [website, x, discord, telegram, instagram, wiki, opensea]
          properties:
            website: { type: [string, "null"] }
            x: { type: [string, "null"] }
            discord: { type: [string, "null"] }
            telegram: { type: [string, "null"] }
            instagram: { type: [string, "null"] }
            wiki: { type: [string, "null"] }
            opensea: { type: [string, "null"] }
        category: { type: [string, "null"] }
        nsfw: { type: [boolean, "null"] }
        disabled: { type: [boolean, "null"], description: "OpenSea disabled the collection." }
        stats:
          description: "Null where neither a floor, OpenSea's stats nor the holder count could be read."
          oneOf:
            - type: object
              required: [floor, floorUsd, floorFrom, volume, sales, owners, supply, intervals, at]
              properties:
                floor: { type: [number, "null"], description: "The floor in ether." }
                floorUsd: { type: [number, "null"] }
                floorFrom:
                  type: [string, "null"]
                  enum: [listings, opensea, null]
                  description: "`listings`: the cheapest live listing of the collection's whole market. `opensea`: OpenSea's own stats."
                volume: { type: [number, "null"], description: "OpenSea's all-time volume, in ether." }
                sales: { type: [number, "null"], description: "OpenSea's all-time sales." }
                owners: { type: integer, description: "Wallets holding a piece now, counted from the collection's transfers." }
                supply: { type: integer, description: "Pieces that exist now, held by anyone but the dead address." }
                intervals:
                  type: object
                  description: OpenSea's volume and sales over the last day, week and month.
                  required: [day, week, month]
                  properties:
                    day: { $ref: "#/components/schemas/NftInterval" }
                    week: { $ref: "#/components/schemas/NftInterval" }
                    month: { $ref: "#/components/schemas/NftInterval" }
                at: { type: [integer, "null"], description: "Unix seconds OpenSea's stats were read." }
            - { type: "null" }
        bestOffer:
          description: "The collection's best live offer for one item; null where there is none, or the collection's whole market is not read."
          oneOf: [{ $ref: "#/components/schemas/NftPrice" }, { type: "null" }]
        source:
          type: object
          description: Which fields came from OpenSea.
          required: [identity, stats]
          properties:
            identity: { type: [string, "null"], enum: [opensea, null] }
            stats: { type: [string, "null"], enum: [opensea, null] }
    NftInterval:
      type: object
      required: [volume, sales]
      properties:
        volume: { type: [number, "null"] }
        sales: { type: [number, "null"] }
    Nft:
      type: object
      description: One NFT, its own metadata beside its holders, rank, market and history.
      required: [collection, tokenId, standard, name, description, image, traits, owners, rarity, market, history, links, pending]
      properties:
        collection:
          type: object
          required: [address, name, slug, verified, image]
          properties:
            address: { $ref: "#/components/schemas/Address" }
            name: { type: [string, "null"] }
            slug: { type: [string, "null"], description: "OpenSea's slug for the collection." }
            verified: { type: [boolean, "null"], description: "OpenSea verified the collection; null where OpenSea has no word on it." }
            image: { type: [string, "null"], description: "The API's path for the collection's picture." }
        tokenId: { type: string }
        standard: { type: string, enum: [erc721, erc1155] }
        name: { type: [string, "null"] }
        description: { type: [string, "null"] }
        image: { type: [string, "null"], description: "The API's path for the piece's picture." }
        traits:
          type: array
          items:
            type: object
            required: [type, value, displayType]
            properties:
              type: { type: string }
              value: { type: string }
              displayType: { type: [string, "null"] }
        owners:
          type: array
          description: Up to 20 holders, the largest first.
          items:
            type: object
            required: [address, quantity]
            properties:
              address: { $ref: "#/components/schemas/Address" }
              quantity: { type: string, description: "How many of the piece it holds." }
        rarity:
          description: "Its rank by OpenRarity's method, 1 the rarest; null where its collection is not ranked."
          oneOf:
            - type: object
              required: [rank, of, strategy]
              properties:
                rank: { type: integer }
                of: { type: integer, description: "How many pieces were ranked." }
                strategy: { type: string, enum: [openrarity] }
            - { type: "null" }
        market:
          type: object
          required: [floor, bestListing, bestOffer, lastSale]
          properties:
            floor: { type: [number, "null"], description: "The collection's floor in ether." }
            bestListing:
              description: "The cheapest live listing of the piece."
              oneOf:
                - type: object
                  required: [price, priceUsd, currency, expiresAt, url]
                  properties:
                    price: { type: number }
                    priceUsd: { type: [number, "null"] }
                    currency: { type: [string, "null"] }
                    expiresAt: { type: [integer, "null"], description: "Unix seconds." }
                    url: { type: string, description: "The piece's page on OpenSea." }
                - { type: "null" }
            bestOffer:
              description: "The best live offer that covers the piece: its own, a trait offer whose every trait it carries, or its collection's."
              oneOf: [{ $ref: "#/components/schemas/NftPrice" }, { type: "null" }]
            lastSale:
              oneOf:
                - type: object
                  required: [price, priceUsd, currency, at, tx]
                  properties:
                    price: { type: number }
                    priceUsd: { type: [number, "null"] }
                    currency: { type: [string, "null"] }
                    at: { type: integer, description: "Unix seconds." }
                    tx: { $ref: "#/components/schemas/Hash" }
                - { type: "null" }
        history:
          type: array
          description: The piece's last 50 moves, newest first.
          items:
            type: object
            required: [type, at, tx, from, to, quantity, price, currency]
            properties:
              type:
                type: string
                enum: [mint, airdrop, transfer, sale, burn]
                description: "`airdrop` is a mint by another wallet's transaction, which the recipient paid nothing in; its `from` is that transaction's sender."
              at: { type: integer, description: "Unix seconds." }
              tx: { $ref: "#/components/schemas/Hash" }
              from: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }], description: "Null for a mint." }
              to: { oneOf: [{ $ref: "#/components/schemas/Address" }, { type: "null" }], description: "Null for a burn to the zero address." }
              quantity: { type: string }
              price: { type: [number, "null"], description: "What a sale paid for the move's pieces, in `currency`." }
              currency: { type: [string, "null"] }
        links:
          type: object
          required: [opensea, explorer]
          properties:
            opensea: { type: string }
            explorer: { type: string }
        pending: { type: boolean, description: "The piece's metadata was not read in time: ask again." }
    TokenPositionPnl:
      type: object
      description: "A wallet's trades and transfers of one token, each transaction netted for the wallet, at average cost."
      required: [bought, sold, received, sent, costBasisUsd, avgCostUsd, realizedUsd, unrealizedUsd, totalUsd, estimated, firstAt, lastAt]
      properties:
        bought:
          type: object
          description: "What the wallet bought in transactions that swapped the token: whole tokens, dollars paid, transactions."
          required: [amount, usd, txs]
          properties:
            amount: { type: number }
            usd: { type: number }
            txs: { type: integer }
        sold:
          type: object
          required: [amount, usd, txs]
          properties:
            amount: { type: number }
            usd: { type: number }
            txs: { type: integer }
        received:
          type: object
          description: "What reached it in transactions that swapped none of the token: transfers, airdrops, allocations, liquidity taken out."
          required: [amount, txs]
          properties:
            amount: { type: number }
            txs: { type: integer }
        sent:
          type: object
          required: [amount, txs]
          properties:
            amount: { type: number }
            txs: { type: integer }
        costBasisUsd: { type: number, description: "What the tokens it holds cost. A token that reached it with no trade costs that day's close." }
        avgCostUsd: { type: [number, "null"], description: "The average cost of one whole token held; null where it holds none." }
        realizedUsd: { type: number, description: "What its sales made over what the tokens sold had cost." }
        unrealizedUsd: { type: [number, "null"], description: "What it holds is worth at the token's price less its cost; null where the price values nothing." }
        totalUsd: { type: [number, "null"], description: "Realized and unrealized together; null where unrealized is." }
        estimated: { type: boolean, description: "A move before the token's first close was costed at that first close." }
        firstAt: { type: [integer, "null"], description: "Unix seconds of its first move of the token." }
        lastAt: { type: [integer, "null"], description: "Unix seconds of its last move of the token." }
    TokenTraderPosition:
      type: object
      description: One wallet's position in one token.
      required: [token, wallet, balance, valueUsd, priceUsd, label, pnl, pnlWhy, readAt, source]
      properties:
        token: { $ref: "#/components/schemas/Address" }
        wallet: { $ref: "#/components/schemas/Address" }
        balance: { $ref: "#/components/schemas/Uint", description: "What the wallet holds, unscaled." }
        valueUsd: { type: [number, "null"], description: "`balance` at `priceUsd`; null where there is no price." }
        priceUsd: { type: [number, "null"], description: "The token's price; null where it has none, or one too thin to value a holding." }
        label:
          description: "What the wallet is where it holds others' tokens or none of its own; null for a trader's wallet."
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [burn, token, pool, custody, contract] }
                name: { type: string, description: "The name Mancer's transaction page gives it, where it gives one." }
            - { type: "null" }
        pnl:
          oneOf: [{ $ref: "#/components/schemas/TokenPositionPnl" }, { type: "null" }]
        pnlWhy:
          type: [string, "null"]
          enum: [contract, moves, dollar, null]
          description: "Why `pnl` is null: a contract `label` names, more than 2,000 moves of the token, or a dollar token, which costs and is worth a dollar."
        readAt: { type: integer, description: "Unix seconds the balance and moves were read; the figures that move with the price are priced as asked." }
        source: { type: string, enum: [indexer] }
    TokenWindowsTrading:
      type: object
      description: "One window's trading. Each swap of the token in one pool counts once, so a trade routed through two of its pools counts twice."
      required: [txns, buys, sells, volumeUsd, buyVolumeUsd, sellVolumeUsd, makers, buyers, sellers]
      properties:
        txns: { type: integer, description: "Buys and sells together." }
        buys: { type: integer }
        sells: { type: integer }
        volumeUsd: { type: number }
        buyVolumeUsd: { type: number }
        sellVolumeUsd: { type: number }
        makers: { type: [integer, "null"], description: "Distinct wallets whose balance of the token a swap moved; null where `wallets` is `none`." }
        buyers: { type: [integer, "null"], description: "Of those, the wallets that came out of a swap holding more of the token." }
        sellers: { type: [integer, "null"], description: "And the wallets that came out of a swap holding less. A wallet that did both counts in each." }
    TokenWindowsResponse:
      type: object
      required: [token, asOf, windows, wallets, source]
      properties:
        token: { $ref: "#/components/schemas/Address" }
        asOf: { type: integer, description: "Unix seconds of the read: every window ends there." }
        windows:
          type: object
          required: [m5, h1, h6, h24]
          properties:
            m5: { $ref: "#/components/schemas/TokenWindowsTrading", description: The last 5 minutes. }
            h1: { $ref: "#/components/schemas/TokenWindowsTrading", description: The last hour. }
            h6: { $ref: "#/components/schemas/TokenWindowsTrading", description: The last 6 hours. }
            h24: { $ref: "#/components/schemas/TokenWindowsTrading", description: The last 24 hours. }
        wallets: { type: string, enum: [ledger, none], description: "`none` for wrapped ether, whose trades paid in native ether move no token balance, so its wallets are not counted." }
        source: { type: string, enum: [indexer] }
    TokenHoldersPnlRow:
      type: object
      description: One holder of the token.
      required: [holder, balance, share, valueUsd, label, pnl, pnlWhy]
      properties:
        holder: { $ref: "#/components/schemas/Address" }
        balance: { $ref: "#/components/schemas/Uint", description: "What it holds, unscaled." }
        share: { type: [number, "null"], description: "Its share of the total supply, from 0 to 1; null where the supply is unknown." }
        valueUsd: { type: [number, "null"], description: "`balance` at `priceUsd`; null where there is no price." }
        label:
          description: "What the holder is where it holds others' tokens or none of its own; null for a trader's wallet."
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [burn, token, book, market, pool, custody, contract], description: "`book` is one of a Book's own contracts, `market` one of an NFT market's." }
                name: { type: string, description: "The Book's or the market's role for its contract, or the name Mancer's transaction page gives a custody contract or router, where it gives one." }
            - { type: "null" }
        pnl:
          oneOf: [{ $ref: "#/components/schemas/TokenPositionPnl" }, { type: "null" }]
        pnlWhy:
          type: [string, "null"]
          enum: [contract, moves, budget, dollar, null]
          description: "Why `pnl` is null: a holder `label` names, more than 2,000 moves of the token, past the answer's 6,000 priced moves (read it alone at the trader route), or a dollar token."
    TokenHoldersPnlResponse:
      type: object
      required: [token, holders, priceUsd, priceConfidence, totalSupply, decimals, top10Share, top, readAt, source, users]
      properties:
        token: { $ref: "#/components/schemas/Address" }
        holders: { type: integer, description: "How many addresses hold the token." }
        priceUsd: { type: [number, "null"], description: "The price every figure is valued at; null where the token has none, or one too thin to value a holding." }
        priceConfidence: { type: [string, "null"], description: "The kind of the token's price, as the token's detail names it." }
        totalSupply: { type: [string, "null"], description: "The total supply, unscaled; null where it is unknown." }
        decimals: { type: integer }
        top10Share: { type: [number, "null"], description: "The ten largest holders' share of the total supply, pools and contracts among them; null where the supply is unknown." }
        top:
          type: array
          description: The largest holders, largest first.
          items: { $ref: "#/components/schemas/TokenHoldersPnlRow" }
        readAt: { type: integer, description: "Unix seconds the holders and their moves were read; the figures that move with the price are priced as asked." }
        source: { type: string, enum: [indexer] }
        users:
          type: [object, "null"]
          description: "The short identity of each listed wallet with no `label` that shows a name, a picture, a mark or an X handle, by lowercase address. Null where the names did not arrive in time."
          additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
    TokenTradersRow:
      type: object
      description: "One wallet's trades of the token in the window. Amounts are whole tokens and dollars, each trade at its transaction's own price."
      required: [wallet, bought, sold, realizedUsd, unrealizedUsd, pnlUsd, heldFromWindow, movedOut, soldFromBefore, balance, valueUsd, firstAt, lastAt]
      properties:
        wallet: { $ref: "#/components/schemas/Address" }
        bought:
          type: object
          required: [amount, usd, txs]
          properties:
            amount: { type: number }
            usd: { type: number }
            txs: { type: integer }
        sold:
          type: object
          required: [amount, usd, txs]
          properties:
            amount: { type: number }
            usd: { type: number }
            txs: { type: integer }
        realizedUsd: { type: number, description: "Its sales of tokens it bought in the window, over what those cost at its average purchase price there." }
        unrealizedUsd: { type: [number, "null"], description: "What it still holds of the window's purchases at `priceUsd`, over what that cost; null where there is no price." }
        pnlUsd: { type: [number, "null"], description: "Realized and unrealized together; null where unrealized is." }
        heldFromWindow: { type: number, description: "The tokens it bought in the window and did not sell there." }
        movedOut: { type: [number, "null"], description: "Of those, what it no longer holds: moved out by a transfer, not sold. Null where its balance was not read." }
        soldFromBefore:
          description: "What it sold in the window beyond what it bought there: tokens held from before, at their sale price. They make no PnL here; null where it sold no more than it bought."
          anyOf:
            - type: object
              required: [amount, usd]
              properties:
                amount: { type: number }
                usd: { type: number }
            - { type: "null" }
        balance: { type: [string, "null"], description: "What it holds of the token now, unscaled; null where the balances were not read." }
        valueUsd: { type: [number, "null"], description: "`balance` at `priceUsd`; null where either is null." }
        firstAt: { type: integer, description: "Unix seconds of its first trade in the window." }
        lastAt: { type: integer, description: "Unix seconds of its last trade in the window." }
    TokenTradersResponse:
      description: "The ranking, or `available: false` with `why` for a token whose traders this route does not rank."
      oneOf:
        - type: object
          required: [token, available, window, sort, priceUsd, priceConfidence, decimals, traders, readAt, source, users]
          properties:
            token: { $ref: "#/components/schemas/Address" }
            available: { type: boolean, enum: [true] }
            window: { type: string, enum: ["1d", "7d"] }
            sort: { type: string, enum: [pnl, bought, sold] }
            priceUsd: { type: [number, "null"], description: "The price unrealized PnL is reckoned at; null where the token has none, or one too thin to value a holding." }
            priceConfidence: { type: [string, "null"], description: "The kind of the token's price, as the token's detail names it." }
            decimals: { type: integer }
            traders:
              type: array
              description: Up to 100 wallets, in the order `sort` names.
              items: { $ref: "#/components/schemas/TokenTradersRow" }
            readAt: { type: integer, description: "Unix seconds the window was read; the window ends there." }
            source: { type: string, enum: [indexer] }
            users:
              type: [object, "null"]
              description: "The short identity of each listed wallet that shows a name, a picture, a mark or an X handle, by lowercase address. Null where the names did not arrive in time."
              additionalProperties: { $ref: "#/components/schemas/BooksShortIdentity" }
        - type: object
          required: [token, available, why, source, users]
          properties:
            token: { $ref: "#/components/schemas/Address" }
            available: { type: boolean, enum: [false] }
            why: { type: string, enum: [wrapped-ether, dollar], description: "Wrapped ether is traded in native ether too, which moves no token balance; a dollar token costs and is worth a dollar." }
            source: { type: string, enum: [indexer] }
            users: { type: "null" }
    VenueFactoriesResponse:
      type: object
      required: [factories, count]
      properties:
        factories:
          type: object
          description: "Each pool factory's venue id, by the factory's lowercase address."
          additionalProperties: { type: string }
        count: { type: integer, description: How many factories `factories` holds. }
    TokenKolMark:
      type: object
      description: One trade a named wallet made in the token.
      required: [ts, side, priceUsd, volumeUsd, txHash, address, handle, avatarUrl, tier]
      properties:
        ts: { type: integer, description: "Unix seconds." }
        side: { type: [string, "null"], enum: [buy, sell, null], description: "Of the token." }
        priceUsd: { type: number }
        volumeUsd: { type: number }
        txHash: { $ref: "#/components/schemas/Hash" }
        address: { $ref: "#/components/schemas/Address", description: "The named wallet that made the swap." }
        handle: { type: string }
        avatarUrl: { type: [string, "null"] }
        tier: { type: string, description: "The wallet's group in Mancer's list, `kol` unless named otherwise." }
    LaunchpadMark:
      type: object
      description: The launchpad that launched a token.
      required: [id, name, url, tokenUrl]
      properties:
        id: { type: string, enum: [mosh, pons, clanker, long, torch, stonklauncher] }
        name: { type: string }
        url: { type: string, description: "The launchpad's own site." }
        tokenUrl: { type: [string, "null"], description: "The token's page on the launchpad's site; null where none is known." }
    TokenSetupsResponse:
      type: object
      required: [criteria, asOf, universe, matches]
      properties:
        criteria:
          type: object
          description: "Every filter the scan ran, defaults filled in, under the query parameter's name."
          required: [setup, timeframe, lookbackBars, minVolume24hUsd, minRallyPct, retracementMin, retracementMax, tolerancePct, maPeriod, verifiedOnly, fibStage, maxBarsSinceTouch, baseBars, baseMaxRangePct, pivotBars, higherLowCount, minHigherLowPct, breakoutLookback, breakoutBufferPct, volumeLookback, minRelativeVolume, fibConfluence, confluenceTolerancePct, tokenAddress, bounceBasis, bounceLevelPct, bounceTolerancePct, minBouncePct, bounceConfirmBars]
          properties:
            setup: { type: string, enum: [fib-pullback, breakout-retest, ma-reclaim] }
            timeframe: { type: integer, enum: [900, 3600, 14400, 43200, 86400] }
            lookbackBars: { type: integer }
            minVolume24hUsd: { type: number }
            minRallyPct: { type: number }
            retracementMin: { type: number }
            retracementMax: { type: number }
            tolerancePct: { type: number }
            maPeriod: { type: integer }
            verifiedOnly: { type: boolean }
            fibStage: { type: string, enum: [in-zone, base, higher-lows, breakout, bounce] }
            maxBarsSinceTouch: { type: integer }
            baseBars: { type: integer }
            baseMaxRangePct: { type: number }
            pivotBars: { type: integer }
            higherLowCount: { type: integer }
            minHigherLowPct: { type: number }
            breakoutLookback: { type: integer }
            breakoutBufferPct: { type: number }
            volumeLookback: { type: integer }
            minRelativeVolume: { type: number }
            fibConfluence: { type: boolean }
            confluenceTolerancePct: { type: number }
            tokenAddress: { type: string, description: "Lowercase, or empty." }
            bounceBasis: { type: string, enum: [wick, close] }
            bounceLevelPct: { type: number }
            bounceTolerancePct: { type: number }
            minBouncePct: { type: number }
            bounceConfirmBars: { type: integer }
        asOf: { type: integer, description: "Unix seconds the candles the scan tested were read." }
        universe:
          type: object
          required: [limit, rankLimit, considered, evaluated, eligible, excluded, limited]
          properties:
            scope: { type: string, enum: [ranked, token], description: "`token` where `tokenAddress` named one." }
            limit: { type: integer, description: "The most tokens the scan reads: 2,000, or 1 for one token." }
            rankLimit: { type: integer }
            considered: { type: integer, description: "Tokens the scan read." }
            evaluated: { type: integer, description: "Tokens with clean history the setup was tested on; equal to `eligible`." }
            eligible: { type: integer }
            excluded:
              type: object
              description: "Tokens left out, by why: no usable metadata, too little volume, a stale price, short history, invalid candles, a candle with no trade, or no match."
              propertyNames: { enum: [metadata, volume, stale, history, invalid-candles, inactive, no-match] }
              additionalProperties: { type: integer }
            limited: { type: boolean, description: "More tokens traded in the last day than the 2,000 the scan reads." }
        matches:
          type: array
          description: "The matches, nearest their reference first, then the most volume."
          items: { $ref: "#/components/schemas/TokenSetupMatch" }
        inspection:
          type: object
          description: "Present with `tokenAddress`: what the scan found of that token."
          required: [address, status, volume24hUsd, availableBars, requiredBars]
          properties:
            address: { $ref: "#/components/schemas/Address" }
            symbol: { type: string }
            name: { type: string }
            status: { type: string, enum: [matched, excluded, not-indexed] }
            exclusion: { type: string, enum: [metadata, volume, stale, history, invalid-candles, inactive, no-match] }
            volume24hUsd: { type: [number, "null"] }
            availableBars: { type: integer, description: "Completed candles in the lookback window." }
            requiredBars: { type: integer }
    TokenSetupMatch:
      type: object
      description: "A token whose completed candles show the setup. It describes past prices and makes no forecast."
      required: [address, symbol, name, decimals, tier, isStock, setup, timeframe, priceUsd, volume24h, marketCapUsd, athPriceUsd, athMarketCapUsd, distancePct, asOf, matchedAt, reasons, anchors, zone, metrics, candles]
      properties:
        address: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        name: { type: string, description: "The token's name; a Book token's display name where its deployment gives one." }
        decimals: { type: integer }
        tier: { type: integer, enum: [0, 1, 2], description: "2 = verified by Mancer, 1 = issued stock, 0 = the unreviewed tail." }
        isStock: { type: boolean }
        setup: { type: string, enum: [fib-pullback, breakout-retest, ma-reclaim] }
        timeframe: { type: integer, enum: [900, 3600, 14400, 43200, 86400] }
        priceUsd: { type: number, description: "The latest completed close." }
        volume24h: { type: number, description: "Dollars." }
        marketCapUsd: { type: [number, "null"], description: "`priceUsd` times the circulating supply; null where the supply is unknown." }
        athPriceUsd: { type: [number, "null"], description: "The highest daily high the token's chart printed." }
        athMarketCapUsd: { type: [number, "null"] }
        distancePct: { type: number, description: "How far the latest close stands from the setup's reference, in percent; lower is nearer." }
        asOf: { type: integer, description: "Unix seconds the latest completed candle ended." }
        matchedAt: { type: integer, description: "Unix seconds the match was made." }
        reasons:
          type: array
          items:
            type: object
            required: [label, value]
            properties:
              label: { type: string }
              value: { type: string }
        anchors:
          type: array
          description: The prices the setup is measured from.
          items:
            type: object
            required: [label, t, price]
            properties:
              label: { type: string }
              t: { type: integer, description: "The candle's start, unix seconds." }
              price: { type: number }
        zone:
          type: object
          required: [low, high, label]
          properties:
            low: { type: number }
            high: { type: number }
            label: { type: string }
        extraZones:
          type: array
          description: "With `fibConfluence`: the second band."
          items:
            type: object
            required: [low, high, label]
            properties:
              low: { type: number }
              high: { type: number }
              label: { type: string }
        metrics:
          type: object
          description: "The setup's measures by name, each a finite number."
          additionalProperties: { type: number }
        evidence:
          type: array
          description: The confirmed events of a staged or confluent match.
          items:
            type: object
            required: [kind, label, t, price, confirmedAt]
            properties:
              kind: { type: string }
              label: { type: string }
              t: { type: integer, description: "The candle's start, unix seconds." }
              price: { type: number }
              confirmedAt: { type: integer, description: "Unix seconds its confirming candle closed." }
        candles:
          type: array
          description: The lookback window's completed candles, oldest first.
          items: { $ref: "#/components/schemas/Candle" }
        launchpad:
          description: "The launchpad that launched the token; null for any other token. Absent where it could not be read."
          oneOf: [{ $ref: "#/components/schemas/LaunchpadMark" }, { type: "null" }]
        book: { $ref: "#/components/schemas/BookFlag", description: "A Book token: its Book. Absent on every other token." }
