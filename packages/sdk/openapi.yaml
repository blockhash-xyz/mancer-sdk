  /v1/books/{token}/profile:
    put:
      tags: [Books]
      summary: Set a Book's profile
      operationId: putBookProfile
      security:
        - { bearer: [] }
      description: |-
        Sets each field the body names, keeps the rest, and answers the Book's profile.
        The Book's creator's session alone, from the creator wallet or any wallet of its account.
        Targets lock once anyone but the creator buys, a buys-only raise is armed, or the Book bonds; twenty changes an hour.
      parameters:
        - $ref: "#/components/parameters/BookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                description: { type: [string, "null"], description: "Plain text: 1 to 500 characters and 10 lines once trimmed, with no link (no `://`, no `www.`, no bare domain). Null clears it." }
                links:
                  type: [object, "null"]
                  description: Null clears all three. A link left out stands.
                  additionalProperties: false
                  properties:
                    website: { type: [string, "null"], description: "One https link on a host of its own, never a social network's page; an http link or a bare host is written as https. Null clears it." }
                    x: { type: [string, "null"], description: "An x.com or twitter.com link to an account, or an @handle. The profile answers the X account the creator linked through Mancer's X login." }
                    telegram: { type: [string, "null"], description: "A t.me or telegram.me link to a name or an invite, or an @name, written `https://t.me/<path>`. Null clears it." }
                targets:
                  type: array
                  minItems: 1
                  maxItems: 16
                  description: "Distinct verified tokens, issued stocks, WETH or USDG, never the Book's own token, naming one at least beyond WETH and USDG. WETH is put at the fourteenth place at the latest, within the 16."
                  items: { $ref: "#/components/schemas/Address" }
