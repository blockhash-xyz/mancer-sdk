name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install from the lock, running no package's install script
        run: npm ci --ignore-scripts
      - name: Typecheck the SDK, the MCP server and the example bot
        run: npm run typecheck
      - name: Test the SDK, the MCP server and the example bot
        run: npm test
      - name: Build both packages
        run: npm run build
      - name: Scan the tree for secrets and for text that is not public
        run: npm run scan
      - name: Pack both packages, install the tarballs fresh from a lock and run them in plain Node
        run: npm run pack-check
