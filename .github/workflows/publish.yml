name: Publish

# Publishes @blockhash/mancer-sdk and then @blockhash/mancer-mcp to npm through npm's trusted publishing: npm trusts this
# workflow of this repository by its OIDC token, so no npm token is stored anywhere. Each package's trusted publisher on
# npmjs.com names this repository, this file (publish.yml) and the environment `npm`.
#
# Every push to main runs it, and so does a tag `v<version>` on a commit of main. `plan` reads both packages' version
# (they must be one) and asks npm whether each is there: where both are, nothing more runs. `check` holds no credential:
# it installs from the lock with no install script, tests, builds, scans and packs, and hands on the two tarballs it
# checked with their hashes. `publish` alone may ask GitHub for an OIDC token, in the `npm` environment (a person
# approves each run, from main or a `v*` tag alone): it installs nothing but npm, runs no code of this repository, and
# publishes the very tarballs `check` read, each only where npm does not hold its version yet. `tag` then names the
# commit `v<version>` where no such tag exists, with the workflow's own token and no checkout.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    if: (github.ref_type == 'branch' && github.ref == 'refs/heads/main') || (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ref.outputs.version }}
      publish: ${{ steps.npm.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: The commit is main's, and both packages name one version (a tag's own)
        id: ref
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then echo "::error::$GITHUB_REF_NAME names $commit, which is not on main"; exit 1; fi
          sdk="$(node -p "require('./packages/sdk/package.json').version")"
          mcp="$(node -p "require('./packages/mcp/package.json').version")"
          if [ "$sdk" != "$mcp" ]; then echo "::error::the SDK is $sdk and the MCP server $mcp"; exit 1; fi
          version="$sdk"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::$version is no version"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tagged="$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")"
            if [ "$commit" != "$tagged" ]; then echo "::error::the checkout is $commit and the tag names $tagged"; exit 1; fi
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "::error::the packages are $version, and the tag is $GITHUB_REF_NAME"; exit 1; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Which of the two npm does not hold yet
        id: npm
        env:
          VERSION: ${{ steps.ref.outputs.version }}
        run: |
          set -euo pipefail
          publish=false
          for p in sdk mcp; do
            name="@blockhash/mancer-$p"
            if [ -n "$(npm view "$name@$VERSION" version --userconfig /dev/null 2>/dev/null || true)" ]; then
              echo "$name@$VERSION is on npm already"
            else
              echo "$name@$VERSION is not on npm: it is published"
              publish=true
            fi
          done
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ needs.plan.outputs.version }}
      sdk-sha256: ${{ steps.sums.outputs.sdk }}
      mcp-sha256: ${{ steps.sums.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install from the lock, running no package's install script
        run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run scan
      - name: Pack both packages, check the tarballs as a consumer installs them, and keep them
        run: node scripts/npm/pack-check.mjs --out "$RUNNER_TEMP/tarballs"
      - name: The tarballs' hashes, for the publish job
        id: sums
        working-directory: ${{ runner.temp }}/tarballs
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          echo "sdk=$(sha256sum sdk.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "mcp=$(sha256sum mcp.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: |
            ${{ runner.temp }}/tarballs/sdk.tgz
            ${{ runner.temp }}/tarballs/mcp.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10: npm is the one package this job installs
      - run: npm install -g npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs
      - name: The tarballs are the ones the check job read
        env:
          SDK_SHA256: ${{ needs.check.outputs.sdk-sha256 }}
          MCP_SHA256: ${{ needs.check.outputs.mcp-sha256 }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          held="$(ls -A tarballs | sort | tr '\n' ' ')"
          if [ "$held" != "mcp.tgz sdk.tgz " ]; then echo "::error::the artifact holds $held"; exit 1; fi
          printf '%s  %s\n' "$SDK_SHA256" tarballs/sdk.tgz "$MCP_SHA256" tarballs/mcp.tgz | sha256sum -c -
          for p in sdk mcp; do
            name="$(tar -xzOf "tarballs/$p.tgz" package/package.json | jq -r .name)"
            version="$(tar -xzOf "tarballs/$p.tgz" package/package.json | jq -r .version)"
            if [ "$name" != "@blockhash/mancer-$p" ] || [ "$version" != "$VERSION" ]; then echo "::error::$p.tgz is $name@$version"; exit 1; fi
          done
      - name: Publish the SDK, then the MCP server whose shrinkwrap names it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          for p in sdk mcp; do
            name="@blockhash/mancer-$p"
            ours="sha512-$(openssl dgst -sha512 -binary "tarballs/$p.tgz" | base64 -w0)"
            theirs="$(npm view "$name@$VERSION" dist.integrity --userconfig /dev/null 2>/dev/null || true)"
            if [ -n "$theirs" ]; then
              if [ "$theirs" = "$ours" ]; then echo "$name@$VERSION is on npm already, the same tarball: skipped"
              else echo "::notice::$name@$VERSION is on npm already as $theirs (published another way); the tarball checked is $ours: skipped"; fi
            else
              # a path with no ./ is read by npm as a GitHub shorthand (owner/repo) and fetched with git: exit 128
              npm publish "./tarballs/$p.tgz" --provenance --access public --ignore-scripts
            fi
          done

  tag:
    needs: [plan, publish]
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: The commit is named v<version>, where no tag of that name stands
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if held="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
            echo "::notice::$tag stands already (at the object $held): left as it is"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" --jq .ref
